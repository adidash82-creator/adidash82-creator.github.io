*{box-sizing:border-box}
body{margin:0;font-family:NSH,system-ui,sans-serif;background:#f4f1fb;color:#222}
.wrap{display:flex;gap:16px;padding:14px;align-items:flex-start;max-width:1500px;margin:auto}
.boardbox{flex:1;min-width:0}
.boardbox svg{width:100%;height:auto;display:block}
.panel{width:430px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
@media(max-width:1000px){.wrap{flex-direction:column}.panel{width:100%}}
.box{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 2px 8px rgba(60,30,120,.08)}
.turn{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}
.dot{width:22px;height:22px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:8px}
.sc{border-radius:12px;padding:6px 8px;background:#f6f3ff;text-align:center;font-weight:700;border:3px solid transparent}
.sc.on{border-color:#7b4fc4;background:#efe6ff}
.sc b{display:block;font-size:24px}
.tcard{background:#eef7ff;border:2px solid #9cc7ef;border-radius:16px;overflow:hidden}
.tcard .band{background:#3b8fd9;color:#fff;padding:6px 12px;font-weight:700;display:flex;justify-content:space-between}
.tcard h2{margin:8px 12px 2px;text-align:center;color:#1d4f8a;font-size:24px}
.tcard .body{padding:2px 16px 12px;font-size:20px;line-height:1.75}
.tcard .body p{margin:0 0 2px}
.pcard{background:#f6f0ff;border:2px solid #c9b6ea;border-radius:16px;overflow:hidden;text-align:center;animation:pop .35s}
.pcard .band{color:#fff;padding:6px 10px 8px}
.pcard .band small{display:block;font-size:13px;opacity:.9}
.pcard .band b{font-size:28px}
.pcard .q{font-size:23px;font-weight:700;line-height:1.6;padding:16px 18px;color:#2b1d4a}
.pcard .rw{font-size:14px;color:#6b4fa0;font-weight:700;padding-bottom:10px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
button{font-family:inherit;font-size:19px;font-weight:700;border:0;border-radius:14px;padding:12px 16px;cursor:pointer}
.btn-blue{background:#3b8fd9;color:#fff}.btn-purple{background:#7b4fc4;color:#fff}
.btn-ok{background:#2e9e5b;color:#fff}.btn-no{background:#e6e1ef;color:#444}
.btn-light{background:#eef2f8;color:#2f4f7a;font-size:15px;padding:8px 12px}
.row{display:flex;gap:10px}.row>*{flex:1}
.placeholder{border:2px dashed #c9bfe0;border-radius:16px;padding:22px;text-align:center;color:#8a7fa8}
.msg{min-height:26px;font-weight:700;color:#4a2c8a;text-align:center}
.modal{position:fixed;inset:0;background:rgba(30,15,60,.45);display:flex;align-items:center;justify-content:center;z-index:9}
.modal .in{background:#fff;border-radius:22px;padding:24px 26px;max-width:460px;width:92%;text-align:center;animation:pop .3s}
.modal h1{margin:0 0 8px;color:#4a2c8a}
.modal input{font-family:inherit;font-size:18px;padding:9px 12px;border-radius:10px;border:2px solid #d8cfee;width:100%;margin:5px 0}
.nbtn.sel{background:#7b4fc4;color:#fff}
.hidden{display:none!important}
.big{font-size:60px;line-height:1}
#pawns g{transition:transform .28s ease}

<script>
const D={"texts": [{"g": "סיפור", "t": "המפתח בעליית הגג", "l": ["בחופשת הפסח עזרה מאיה לסבתה לפנות את עליית הגג בבית הישן בזכרון יעקב. בין הארגזים המאובקים מצאה קופסת עץ קטנה ונעולה. סבתא סיפרה שהקופסה הייתה של אביה, שעלה לארץ לפני שבעים שנה, אבל המפתח אבד מזמן. מאיה לא ויתרה. במשך יומיים חיפשה בכל פינה, עד שגילתה מפתח זעיר תפור בתוך כרית ישנה. כשפתחו את הקופסה, מצאו בה מכתבים שכתב סבא־רבא לאשתו במהלך המסע לארץ. סבתא קראה אותם בקול, ודמעות זלגו מעיניה. \"עכשיו,\" אמרה, \"הסיפור של המשפחה שלנו שוב שלם.\""]}, {"g": "סיפור", "t": "ההחלטה של עומר", "l": ["ביום שלישי, בהפסקה הגדולה, ראה עומר שכמה ילדים מכיתתו צוחקים על יונתן, התלמיד החדש, בגלל המבטא שלו. עומר הרגיש לא נוח, אבל פחד שאם יתערב, יצחקו גם עליו. כל אותו היום לא הפסיק לחשוב על המבט העצוב של יונתן. בערב סיפר להוריו, ואביו שאל: \"איך היית מרגיש במקומו?\" למחרת בבוקר ניגש עומר ליונתן והזמין אותו לשחק איתו כדורסל במגרש. כמה ילדים הצטרפו אליהם, והצחוק נפסק. בסוף השבוע כבר ישבו השניים יחד בכיתה, ויונתן לימד את עומר כמה מילים ברוסית."]}, {"g": "סיפור", "t": "לילה סוער במחנה", "l": ["בקיץ שעבר יצאה קבוצת הצופים של שירה למחנה ליד חוף דור. בלילה השני התעוררה שירה מרעש חזק: רוח עזה קרעה את יריעות האוהלים, והגשם החל לרדת בזרמים. המדריכים הורו לכולם לאסוף את התיקים ולרוץ אל מבנה המועדון הסמוך. בדרך הבחינה שירה שאלה, הילדה הצעירה בקבוצה, נשארה מאחור, קפואה מפחד. שירה חזרה, אחזה בידה והובילה אותה בזהירות עד המבנה. כשהגיעו, ספר המדריך את הילדים ומצא שכולם בטוחים. בבוקר, כשהשמש זרחה, העניקו המדריכים לשירה תעודת הוקרה על האומץ והאחריות שגילתה."]}, {"g": "סיפור", "t": "ארוחת בוקר מפתיעה", "l": ["לכבוד יום ההולדת של אמא החליטו התאומים איתי ונגה להכין לה ארוחת בוקר מפתיעה. ביום שישי השכימו קום בשש בבוקר והתגנבו למטבח בשקט. איתי טיגן חביתה, ונגה אפתה לחמניות לפי מתכון שמצאה באינטרנט. אבל בהתלהבות שכחה נגה להוסיף שמרים, והלחמניות יצאו קשות כמו אבן. בינתיים החביתה נשרפה, ועשן סמיך מילא את הבית. גלאי העשן צפצף בקול רם, ואמא קפצה מהמיטה בבהלה. כשראתה את פני הילדים המאוכזבים, פרצה בצחוק ואמרה: \"זו ארוחת הבוקר הכי מצחיקה שקיבלתי!\" יחד הכינו ארוחה חדשה, והפעם הצליחו."]}, {"g": "סיפור", "t": "המהלך הנכון", "l": ["בגמר טורניר השחמט הבית־ספרי, שנערך בספרייה ביום חמישי, התמודדה דנה מול רועי, האלוף של השנה הקודמת. דנה התאמנה חודשים ארוכים, כי רצתה להוכיח לעצמה שהיא מסוגלת לנצח. המשחק נמשך כמעט שעה, ושני השחקנים היו מרוכזים לגמרי. בשלב מסוים הבחינה דנה שרועי הזיז בטעות כלי למשבצת אסורה. היא יכלה לשתוק ולנצל את הטעות, אבל הצביעה עליה בנימוס. רועי הודה לה, תיקן את המהלך ובסוף ניצח בהפרש קטן. בטקס הסיום הודיעה המנהלת שדנה זוכה בפרס מיוחד על רוח ספורטיבית. דנה חייכה: היא הבינה שגם הפסד יכול להרגיש כמו ניצחון."]}, {"g": "סיפור", "t": "מקס ורון", "l": ["מאז שהשכנה, גברת לוי, שברה את רגלה, לא יכלה לצאת עם הכלב שלה, מקס, לטיולים. רון, שגר בקומה שמעליה, שמע את מקס מיילל בעצב בכל ערב. הוא החליט להציע עזרה, אף שתמיד פחד מכלבים גדולים. ביום הראשון החזיק את הרצועה בידיים רועדות, ומקס משך אותו לכל עבר בפארק השכונתי. אבל מיום ליום נעשה רון בטוח יותר, ומקס למד ללכת לצידו בנחת. אחרי חודש, כשגברת לוי החלימה, היא הודתה לו ואמרה שמקס יתגעגע. רון חייך: \"אולי אמשיך לבוא בשבתות. נראה לי שגם אני אתגעגע.\""]}, {"g": "טקסט מידעי", "t": "הדבורים: קטנות וחשובות", "l": ["דבורת הדבש חיה בכוורת שבה עשרות אלפי דבורים, ולכל אחת מהן תפקיד מוגדר. המלכה מטילה ביצים, והפועלות אוספות צוף ואבקה, בונות חלות ושומרות על הכוורת. בזמן שהדבורים עוברות מפרח לפרח, הן מעבירות אבקה ביניהם ומאפשרות לצמחים להתרבות. תהליך זה נקרא האבקה. מדענים מעריכים שכשליש מהמזון שאנו אוכלים תלוי בהאבקה של דבורים ושל חרקים אחרים. בשנים האחרונות מספר הדבורים בעולם הולך ופוחת, בעיקר בגלל חומרי הדברה, מחלות ושינויי אקלים. כדי לעזור להן, אפשר לשתול פרחים בגינה ובמרפסת ולהימנע מריסוס מיותר."]}, {"g": "טקסט מידעי", "t": "ים המלח: המקום הנמוך בעולם", "l": ["ים המלח נמצא בבקעת הירדן, כ־430 מטרים מתחת לפני הים, והוא המקום הנמוך ביותר על פני היבשה בכדור הארץ. המים בו מלוחים פי שמונה בערך ממי הים התיכון. בגלל המליחות הגבוהה כמעט אין בו חיים, ולכן בשפות רבות הוא נקרא \"הים המת\". לעומת זאת, המלח הרב מאפשר לרוחצים לצוף על המים בלי מאמץ. מאז שנות השישים של המאה העשרים יורד מפלס ים המלח בכמטר בכל שנה. הסיבה העיקרית היא שרוב המים של נהר הירדן, שהזינו את הים, משמשים היום להשקיה ולשתייה. כתוצאה מכך נפערים לאורך החוף בולענים, בורות עמוקים שמסכנים מטיילים וכבישים."]}, {"g": "טקסט מידעי", "t": "איך נוצרת קשת בענן?", "l": ["קשת בענן מופיעה בדרך כלל אחרי גשם, כשהשמש נמצאת מאחורי הצופה וטיפות מים עדיין מרחפות באוויר. אור השמש נראה לנו לבן, אבל למעשה הוא מורכב מכל צבעי הקשת. כשקרן אור נכנסת לטיפת מים, היא נשברת ומתפצלת לצבעים, משום שכל צבע נשבר בזווית מעט שונה. האור מוחזר מהדופן האחורית של הטיפה ויוצא ממנה אל עינינו. כך אנו רואים קשת של שבעה צבעים: אדום, כתום, צהוב, ירוק, כחול, אינדיגו וסגול. הצבע האדום נמצא תמיד בחלק העליון של הקשת, והסגול בחלק התחתון. אפשר ליצור קשת גם בגינה: עומדים בגב לשמש בבוקר בהיר ומרססים מים מצינור."]}, {"g": "טקסט מידעי", "t": "האיש שהחיה את העברית", "l": ["לפני כמאה וחמישים שנה שימשה העברית בעיקר לתפילה וללימוד, וכמעט איש לא דיבר בה בחיי היום־יום. אליעזר בן־יהודה, שנולד בליטא, האמין שעם ישראל זקוק לשפה משותפת כדי לחיות בארצו. בשנת 1881 עלה לארץ ישראל והחליט שבביתו ידברו רק עברית. בנו, איתמר, היה הילד הראשון בעת החדשה שגדל כשהעברית היא שפת אמו. בן־יהודה הוציא לאור עיתונים בעברית, ובמשך שנים עבד על מילון גדול של השפה. כשלא מצא מילה מתאימה, חידש מילים בעצמו, למשל \"מילון\" ו\"עיתון\". כיום מדברים עברית מיליוני אנשים, וזה אחד ההישגים המופלאים בתולדות השפות."]}, {"g": "טקסט טיעון", "t": "בעד הפסקה ארוכה יותר", "l": ["לדעתי, יש להאריך את ההפסקה הגדולה בבית הספר שלנו מעשרים דקות לחצי שעה. ראשית, מחקרים מראים שתנועה ומשחק בחוץ משפרים את הריכוז, ולכן אחרי הפסקה ארוכה לומדים טוב יותר. שנית, בעשרים דקות בקושי מספיקים לאכול, ומשחק כדורגל או קפיצה בחבל נקטעים באמצע. שלישית, בהפסקה נוצרות חברויות, ויש לה חשיבות חברתית גדולה. אמנם יש הטוענים שהארכת ההפסקה תקצר את זמן הלמידה, אך אפשר לפתור זאת בקיצור קל של כל שיעור. לסיכום, הפסקה ארוכה תיטיב עם הגוף, עם הראש ועם הלב, ולכן אני פונה למנהלת לאשר אותה כבר בשנה הבאה. (יואב, כיתה ה'2)"]}, {"g": "טקסט טיעון", "t": "טלפון חכם בגיל עשר?", "l": ["אני סבורה שעדיף לדחות את קניית הטלפון החכם לילדים עד גיל שתים־עשרה לפחות. הסיבה הראשונה היא שילדים רבים מבלים מול המסך שעות ארוכות, על חשבון משחק בחוץ, קריאה ושינה. הסיבה השנייה היא שברשתות החברתיות ילדים עלולים להיחשף לתכנים לא מתאימים ולפגיעה מצד אחרים. מנגד, יש הטוענים שהטלפון חשוב לביטחון, כי כך ההורים יכולים ליצור קשר עם ילדם בכל רגע. זו טענה נכונה, אבל לשם כך מספיק טלפון פשוט, בלי אינטרנט ובלי אפליקציות. לכן אני ממליצה להורים: תנו לילדים טלפון רגיל, ושמרו את הטלפון החכם לגיל מאוחר יותר. (מיכל, אם לשלושה, במכתב לעיתון המקומי)"]}, {"g": "טקסט טיעון", "t": "מכתב: השאירו לנו את הפארק", "l": ["לכבוד ראש העירייה, בחודש שעבר פורסמה תוכנית לבנות חניון במקום הפארק הקטן ברחוב הדקל. אנו, תלמידי כיתה ה' בבית הספר \"אלונים\", מתנגדים לתוכנית מכמה סיבות. ראשית, הפארק הוא המקום היחיד בשכונה שבו ילדים יכולים לשחק בבטחה, רחוק מהכביש. שנית, יש בו עצים ותיקים שמספקים צל בקיץ ומשפרים את איכות האוויר. אנו מבינים שחסרים מקומות חניה בשכונה, ולכן אנו מציעים לבנות חניון תת־קרקעי מתחת למגרש הספורט הסמוך. כך יהיו גם חניות וגם מקום לשחק. אנא, השאירו לנו את הפארק. בתודה, תלמידי כיתה ה'."]}, {"g": "ידיעה עיתונאית", "t": "תלמידים מחיפה זכו בתחרות רובוטיקה", "l": ["חיפה, יום ראשון. קבוצת תלמידים מבית הספר \"הגפן\" בחיפה זכתה אתמול במקום הראשון בתחרות רובוטיקה בין־לאומית שנערכה בטוקיו שביפן. בתחרות השתתפו כמאה קבוצות מעשרים מדינות. הרובוט שבנו התלמידים נועד לאסוף פסולת פלסטיק מחופי הים, והשופטים התרשמו במיוחד מהרעיון הסביבתי. \"רצינו לפתור בעיה אמיתית שאנחנו רואים כל שבוע בחוף,\" אמרה תמר, בת 11, אחת מחברות הקבוצה. התלמידים עבדו על הפרויקט שמונה חודשים, בעזרת המורה למדעים. הקבוצה תשוב ארצה ביום שלישי, ובעירייה מתכננים לקבל את פניה בטקס חגיגי."]}, {"g": "ידיעה עיתונאית", "t": "צבת ים פצועה חזרה לים", "l": ["אשדוד, יום רביעי. צבת ים ירוקה, ממין נדיר ומוגן, שוחררה הבוקר לים בחוף אשדוד לאחר שלושה חודשי טיפול. הצבה נמצאה בחודש אוגוסט כשהיא פצועה ולכודה ברשת דייגים שננטשה במים. מטיילים שהבחינו בה התקשרו למרכז להצלת צבי ים, ומתנדבי המרכז העבירו אותה לטיפול. \"רשתות דיג וזבל פלסטיק הם הסכנה הגדולה ביותר לצבי הים,\" הסבירה הווטרינרית של המרכז. עשרות ילדים ומבוגרים התאספו על החוף כדי לצפות בשחרור, ומחאו כפיים כשהצבה נעלמה בין הגלים. במרכז קוראים לציבור לאסוף פסולת מהחופים ולדווח על כל צב פצוע."]}, {"g": "ידיעה עיתונאית", "t": "ספריית רחוב נפתחה בבאר שבע", "l": ["באר שבע, יום חמישי. ספריית רחוב חדשה נחנכה אתמול בגינה הציבורית בשכונה ד' בבאר שבע. זהו ארון עץ צבעוני ובו כמאתיים ספרים, שכל עובר ושב יכול לקחת, לקרוא ולהחזיר, או להביא ספר משלו במקומו. את הרעיון הגו חברי מועצת התלמידים של בית ספר יסודי סמוך, שרצו לעודד ילדים ומבוגרים לקרוא יותר. התלמידים אספו את הספרים מתרומות של תושבים, והעירייה סייעה בבניית הארון. \"שמחנו לראות שכבר ביום הראשון נלקחו עשרות ספרים,\" סיפר יו\"ר מועצת התלמידים. בעתיד מתכננים להקים ספריות דומות בשכונות נוספות בעיר."]}], "purple": [{"k": "who", "x": "מי או מה עומד במרכז הטקסט? הסבירו איך זיהיתם.", "task": false}, {"k": "who", "x": "מי כתב את הטקסט או מי מספר אותו? למי הוא פונה?", "task": false}, {"k": "who", "x": "מי מהדמויות או מהגורמים בטקסט השפיע הכי הרבה על מה שקרה? נמקו.", "task": false}, {"k": "who", "x": "מי ירוויח מהמידע או מהרעיון שבטקסט? הסבירו.", "task": false}, {"k": "what", "x": "מה הרעיון המרכזי של הטקסט? נסחו אותו במשפט אחד.", "task": false}, {"k": "what", "x": "מה הבעיה, השאלה או הנושא שהטקסט עוסק בו?", "task": false}, {"k": "what", "x": "מה למדתם מהטקסט שלא ידעתם קודם?", "task": false}, {"k": "what", "x": "מה סוגת הטקסט (סיפור, מידע, טיעון, ידיעה)? הביאו שתי ראיות מהטקסט.", "task": false}, {"k": "when", "x": "מתי מתרחשים האירועים, או מתי נכתב הטקסט? מצאו ביטויי זמן.", "task": false}, {"k": "when", "x": "סדרו לפי הסדר שלושה אירועים או שלבים מהטקסט.", "task": false}, {"k": "when", "x": "מה השתנה בין תחילת הטקסט לסופו?", "task": false}, {"k": "when", "x": "מצאו בטקסט מילת קישור של זמן (למשל: בינתיים, לאחר מכן, מאז).", "task": false}, {"k": "where", "x": "היכן מתרחש הטקסט? ציינו את כל המקומות שמוזכרים בו.", "task": false}, {"k": "where", "x": "כיצד המקום משפיע על מה שקורה או מתואר בטקסט?", "task": false}, {"k": "where", "x": "תארו את המקום במשפט אחד, בעזרת פרטים מהטקסט.", "task": f const COLORS=['#e23b3b','#2f6fd6','#2e9e5b','#f2b705'];
const NAMES=['שחקן 1','שחקן 2','שחקן 3','שחקן 4'];
let S;
const $=id=>document.getElementById(id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(deck,src){if(!S[deck].length)S[deck]=shuffle([...Array(src.length).keys()]);return S[deck].pop()}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

function modal(html){$('modalIn').innerHTML=html;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}

function setup(){
  let n=2;
  const render=()=>{modal(`<h1>מסלול הקריאה והחשיבה</h1>
   <p>כמה שחקנים?</p><div class="row">${[2,3,4].map(k=>`<button class="btn-no nbtn ${k==n?'sel':''}" data-k="${k}">${k}</button>`).join('')}</div>
   <div style="margin-top:12px">${[...Array(n).keys()].map(i=>`<div style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${COLORS[i]}"></span><input id="nm${i}" placeholder="${NAMES[i]}"></div>`).join('')}</div>
   <button class="btn-purple" style="width:100%;margin-top:14px" id="go">מתחילים!</button>`);
   document.querySelectorAll('.nbtn').forEach(b=>b.onclick=()=>{n=+b.dataset.k;render()});
   $('go').onclick=()=>start([...Array(n).keys()].map(i=>($('nm'+i).value.trim()||NAMES[i])));
  };
  render();
}
function start(names){
  S={players:names.map((nm,i)=>({name:nm,color:COLORS[i],pos:1,pts:0})),cur:0,tDeck:[],pDeck:[],text:null,card:null,busy:false,over:false};
  closeModal();drawPawns();newTurn(true);
}
function P(){return S.players[S.cur]}

function drawPawns(){
  const g=$('pawns');g.innerHTML='';
  S.players.forEach((p,i)=>{
    const el=document.createElementNS('http://www.w3.org/2000/svg','g');el.id='pw'+i;
    el.innerHTML=`<ellipse cx="0" cy="26" rx="17" ry="6" fill="rgba(0,0,0,.2)"/><path d="M-15,24 Q-15,4 0,0 Q15,4 15,24 Z" fill="${p.color}" stroke="#fff" stroke-width="3"/><circle cx="0" cy="-8" r="12" fill="${p.color}" stroke="#fff" stroke-width="3"/>`;
    g.appendChild(el);placePawn(i);
  });
}
const OFF=[[-24,-22],[24,-22],[-24,20],[24,20]];
function placePawn(i){const p=S.players[i],[x,y]=D.pos[p.pos],[dx,dy]=OFF[i];$('pw'+i).style.transform=`translate(${x+dx}px,${y+dy-4}px)`}

function renderSide(){
  const p=P();$('tdot').style.background=p.color;$('tname').textContent='התור של '+p.name;
  $('scores').innerHTML=S.players.map((q,i)=>`<div class="sc ${i==S.cur?'on':''}"><span class="dot" style="background:${q.color};width:14px;height:14px"></span> ${esc(q.name)}<b>${q.pts}</b><small>משבצת ${q.pos}</small></div>`).join('');
  // text
  if(S.text==null){$('textArea').innerHTML=`<div class="placeholder"><button class="btn-blue" onclick="newText()">📖 שלפו קלף טקסט</button></div>`}
  else{const t=D.texts[S.text];$('textArea').innerHTML=`<div class="tcard"><div class="band"><span>קלף טקסט ${S.text+1}${t.g?' · '+t.g:''}</span><button class="btn-light" style="padding:2px 10px;font-size:13px" onclick="newText()">טקסט חדש</button></div><h2>${t.t}</h2><div class="body">${t.l.map(l=>`<p>${esc(l)}</p>`).join('')}</div></div>`}
  // purple
  if(S.card==null){$('purpleArea').innerHTML=S.text==null?'':`<button class="btn-purple" style="width:100%" onclick="newCard()">❓ שלפו קלף סגל</button>`}
  else{const c=D.purple[S.card],cat=D.cats[c.k];
    $('purpleArea').innerHTML=`<div class="pcard"><div class="band" style="background:${cat.col}"><small>${c.task?'משימה':'חמשת הממים'}</small><b>${cat.lab}</b></div><div class="q">${esc(c.x)}</div><div class="rw">הצלחה = ${c.task?'3 צעדים · 2 נקדות':'2 צעדים · 1 נקדה'}</div></div>
    <div class="row" style="margin-top:10px"><button class="btn-ok" onclick="result(true)" ${S.busy?'disabled':''}>✓ הצליח</button><button class="btn-no" onclick="result(false)" ${S.busy?'disabled':''}>✗ לא הפעם</button></div>`}
}
function newText(){if(S.busy)return;S.text=draw('tDeck',D.texts);renderSide()}
function newCard(){if(S.busy)return;S.card=draw('pDeck',D.purple);say('');renderSide()}
function say(t){$('msg').textContent=t}

async function result(ok){
  if(S.busy)return;const c=D.purple[S.card],p=P();
  if(!ok){say('לא נורא! בתור הבא זה יצליח 💪');S.card=null;return setTimeout(()=>nextTurn(),900)}
  S.busy=true;renderSide();
  p.pts+=c.task?2:1;
  const steps=c.task?3:2;
  for(let k=0;k<steps&&p.pos<D.n;k++){p.pos++;placePawn(S.cur);await sleep(330)}
  S.busy=false;S.card=null;
  if(p.pos>=D.n)return finish();
  const sp=D.special[p.pos];
  if(sp==='star'){p.pts+=2;renderSide();modal(`<div class="big">⭐</div><h1>כוכב!</h1><p>${esc(p.name)} מקבל/ת 2 נקודות בונוס</p><button class="btn-purple" onclick="closeModal();nextTurn()">המשך</button>`)}
  else if(sp==='move'){renderSide();modal(`<div class="big">👟</div><h1>משימת תנועה</h1><p style="font-size:22px">קפצו 5 קפיצות במקום!</p><button class="btn-ok" onclick="P().pts++;closeModal();nextTurn()">עשיתי! (+1)</button>`)}
  else if(sp==='q'){renderSide();modal(`<div class="big">❓</div><h1>משבצת שאלה</h1><p>${esc(p.name)} שולף/ת עוד קלף סגול – באותו תור!</p><button class="btn-purple" onclick="closeModal();newCard()">לשלוף</button>`)}
  else{say('כל הכבוד! 🎉');renderSide();setTimeout(()=>nextTurn(),900)}
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function nextTurn(){if(S.over)return;S.cur=(S.cur+1)%S.players.length;newTurn()}
function newTurn(first){S.card=null;renderSide();if(!first)say('')}
function finish(){
  const p=P();p.pts+=5;S.over=true;renderSide();
  const r=S.players.slice().sort((a,b)=>b.pts-a.pts);
  modal(`<div class="big">🏆</div><h1>המשחק נגמר!</h1><p>${esc(p.name)} הגיע/ה ראשון/ה לסיום (+5)</p>
  ${r.map((q,i)=>`<div style="display:flex;justify-content:space-between;font-size:20px;padding:6px 10px;border-radius:10px;background:${i?'#f6f3ff':'#fff3c4'};margin:4px 0"><span>${i+1}. <span class="dot" style="background:${q.color};width:14px;height:14px"></span> ${esc(q.name)}</span><b>${q.pts} נק׳</b></div>`).join('')}
  <button class="btn-purple" style="width:100%;margin-top:12px" onclick="setup()">משחק חדש</button>`);
}
function openRules(){modal(`<h1>חוקי המשחק</h1><div style="text-align:right;line-height:1.7;font-size:16px">
<b>1.</b> שולפים קלף טקסט וקוראים בקול (אפשר להשאיר את אותו טקסט לכמה תורות).<br>
<b>2.</b> שולפים קלף סגול – שאלה לפי חמשת הממ״ים או משימה – ועונים. מותר לחזור לטקסט.<br>
<b>3.</b> המנחה מחליט/ה: ✓ הצליח או ✗ לא הפעם.<br>
שאלה = 2 צעדים + נקודה · משימה = 3 צעדים + 2 נקודות.<br>
⭐ כוכב: +2 · 👟 צעדים: 5 קפיצות = +1 · ❓ שאלה: עוד קלף סגול.<br>
<b>סיום:</b> הראשון שמגיע מקבל +5. מנצח מי שצבר הכי הרבה נקודות.</div>
<button class="btn-purple" style="margin-top:12px" onclick="closeModal()">הבנתי</button>`)}
setup();
</script>
