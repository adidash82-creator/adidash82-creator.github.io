<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>פרצוף הניקוד</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Frank+Ruhl+Libre:wght@700;900&display=swap">
<style>
/* Layout: a big friendly face on a "stage" card; nikud buttons beside it (stack on phone). Two tabs: learn / quiz. */
:root{
  --bg:#E8F3FA; --surface:#FFFFFF; --stage:#FDF7EE; --ink:#1E2A4A; --muted:#5B6787; --line:#CFDDEA;
  --kamatz:#F0544F; --tsere:#E89A12; --hiriq:#1FA36B; --holam:#7C4DEB; --shuruk:#2A84E0;
  --good:#1FA36B; --bad:#E0473F;
  --ui:"Varela Round", "Arial Hebrew", Arial, sans-serif;
  --letter:"Frank Ruhl Libre", "David", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141B2E; --surface:#1E2740; --stage:#28324F; --ink:#EEF2FB; --muted:#A9B4CF; --line:#36426A;
  --kamatz:#FF7A75; --tsere:#FFB84A; --hiriq:#3FCB8E; --holam:#A487FF; --shuruk:#5AA8FF;
  --good:#3FCB8E; --bad:#FF6B63; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141B2E; --surface:#1E2740; --stage:#28324F; --ink:#EEF2FB; --muted:#A9B4CF; --line:#36426A;
  --kamatz:#FF7A75; --tsere:#FFB84A; --hiriq:#3FCB8E; --holam:#A487FF; --shuruk:#5AA8FF;
  --good:#3FCB8E; --bad:#FF6B63; color-scheme:dark }

html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--ui);font-size:17px;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:clamp(26px,5vw,36px);text-wrap:balance}
.tabs{display:flex;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:5px}
.tab{font:inherit;font-size:17px;border:0;background:transparent;color:var(--ink);padding:8px 20px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab:focus-visible,.nk:focus-visible,.btn:focus-visible,.hot:focus-visible{outline:3px solid var(--shuruk);outline-offset:3px}

.main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.main{grid-template-columns:1fr}}
.stage{background:var(--stage);border-radius:28px;padding:12px;position:relative}
.stage svg{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
.hint{text-align:center;color:var(--muted);font-size:15px;margin:4px 0 6px}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.nk{font:inherit;cursor:pointer;background:var(--surface);color:var(--ink);border:3px solid var(--line);border-radius:20px;
  padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s,border-color .15s}
.nk:hover{transform:translateY(-2px)}
.nk .lt{font-family:var(--letter);font-weight:900;font-size:44px;line-height:1.25;color:var(--c)}
.nk .nm{font-size:14px;color:var(--muted)}
.nk.on{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}

.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.info-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.big{font-family:var(--letter);font-weight:900;font-size:72px;line-height:1.1;color:var(--c,var(--ink))}
.info h2{margin:0;font-size:22px;color:var(--c,var(--ink))}
.info p{margin:0;color:var(--ink);line-height:1.5}
.info .sound{font-size:20px}
.muted{color:var(--muted)}
.btn{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:10px 20px;background:var(--ink);color:var(--bg);font-size:17px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* quiz */
.q-letter{font-family:var(--letter);font-weight:900;font-size:110px;line-height:1.1;text-align:center;color:var(--ink)}
.q-msg{text-align:center;font-size:22px;min-height:1.5em}
.q-msg.good{color:var(--good)} .q-msg.bad{color:var(--bad)}
.stars{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;font-size:22px;color:var(--line)}
.stars span.got{color:var(--tsere)}
.score{text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}

/* face */
.gesture{opacity:0;transform:scale(.6);transform-box:fill-box;transform-origin:center;transition:opacity .3s,transform .35s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.gesture.on{opacity:1;transform:scale(1)}
.dot-pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.25)}}
.hot{fill:transparent;cursor:pointer}
.hot:hover{fill:rgba(255,255,255,.18)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.gesture,.nk{transition:none}.dot-pulse,.shake{animation:none}}
.note{font-size:14px;color:var(--muted);text-align:center}
</style>

<div class="wrap">
  <header>
    <h1>פרצוף הניקוד</h1>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-learn" role="tab" aria-selected="true">לומדים</button>
      <button class="tab" id="tab-quiz" role="tab" aria-selected="false">חידון</button>
    </div>
  </header>

  <div class="main">
    <div class="stage" id="stage">
      <svg viewBox="0 0 300 350" aria-label="פרצוף" role="img">
        <!-- ears -->
        <ellipse cx="40" cy="180" rx="18" ry="26" fill="#F6C9A4" stroke="#C98B62" stroke-width="3"/>
        <ellipse cx="260" cy="180" rx="18" ry="26" fill="#F6C9A4" stroke="#C98B62" stroke-width="3"/>
        <!-- face -->
        <ellipse cx="150" cy="175" rx="112" ry="118" fill="#F9D5B5" stroke="#C98B62" stroke-width="3"/>
        <!-- hair -->
        <path d="M40 150 C 35 70, 95 40, 150 42 C 210 40, 268 70, 260 150 C 245 110, 220 92, 190 88 C 205 100, 200 108, 190 104 C 160 90, 120 88, 95 98 C 75 106, 55 125, 40 150 Z" fill="#6B3E26"/>
        <!-- eyebrows -->
        <path d="M92 128 q18 -10 36 0" stroke="#6B3E26" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M172 128 q18 -10 36 0" stroke="#6B3E26" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- eyes -->
        <ellipse cx="110" cy="155" rx="13" ry="15" fill="#fff"/>
        <ellipse cx="190" cy="155" rx="13" ry="15" fill="#fff"/>
        <circle cx="112" cy="158" r="8" fill="#2B2B3A"/>
        <circle cx="192" cy="158" r="8" fill="#2B2B3A"/>
        <circle cx="115" cy="154" r="3" fill="#fff"/>
        <circle cx="195" cy="154" r="3" fill="#fff"/>
        <!-- nose -->
        <path d="M150 168 q-12 26 0 28 q8 1 10 -4" stroke="#C98B62" stroke-width="4" fill="none" stroke-linecap="round"/>
        <!-- cheeks -->
        <ellipse cx="92" cy="212" rx="18" ry="11" fill="#F7A3A3" opacity=".6"/>
        <ellipse cx="208" cy="212" rx="18" ry="11" fill="#F7A3A3" opacity=".6"/>
        <!-- mouth -->
        <path d="M118 228 q32 30 64 0" stroke="#B5484B" stroke-width="5" fill="#fff" stroke-linecap="round"/>

        <!-- gesture: kamatz/patach — flat hand under chin -->
        <g class="gesture" id="g-kamatz">
          <rect x="70" y="296" width="210" height="24" rx="12" fill="#F6C9A4" stroke="#C98B62" stroke-width="3"/>
          <line x1="100" y1="302" x2="150" y2="302" stroke="#C98B62" stroke-width="2" stroke-linecap="round"/>
          <line x1="100" y1="308" x2="150" y2="308" stroke="#C98B62" stroke-width="2" stroke-linecap="round"/>
          <line x1="100" y1="314" x2="150" y2="314" stroke="#C98B62" stroke-width="2" stroke-linecap="round"/>
          <ellipse cx="190" cy="294" rx="22" ry="8" fill="#F6C9A4" stroke="#C98B62" stroke-width="3"/>
          <rect x="70" y="292" width="210" height="32" rx="16" fill="none" stroke="var(--kamatz)" stroke-width="4"/>
        </g>

        <!-- gesture: tsere/segol — two index fingers on cheek dimples -->
        <g class="gesture" id="g-tsere">
          <line x1="22" y1="300" x2="86" y2="220" stroke="#C98B62" stroke-width="19" stroke-linecap="round"/>
          <line x1="22" y1="300" x2="86" y2="220" stroke="#F6C9A4" stroke-width="13" stroke-linecap="round"/>
          <circle cx="22" cy="306" r="20" fill="#F6C9A4" stroke="#C98B62" stroke-width="3"/>
          <line x1="278" y1="300" x2="214" y2="220" stroke="#C98B62" stroke-width="19" stroke-linecap="round"/>
          <line x1="278" y1="300" x2="214" y2="220" stroke="#F6C9A4" stroke-width="13" stroke-linecap="round"/>
          <circle cx="278" cy="306" r="20" fill="#F6C9A4" stroke="#C98B62" stroke-width="3"/>
          <circle cx="92" cy="212" r="7" fill="var(--tsere)" stroke="#fff" stroke-width="3" class="dot-pulse"/>
          <circle cx="208" cy="212" r="7" fill="var(--tsere)" stroke="#fff" stroke-width="3" class="dot-pulse"/>
        </g>

        <!-- dots -->
        <g class="gesture" id="g-hiriq"><circle cx="150" cy="268" r="12" fill="var(--hiriq)" stroke="#fff" stroke-width="3" class="dot-pulse"/></g>
        <g class="gesture" id="g-holam"><circle cx="150" cy="104" r="12" fill="var(--holam)" stroke="#fff" stroke-width="3" class="dot-pulse"/></g>
        <g class="gesture" id="g-shuruk"><circle cx="156" cy="188" r="11" fill="var(--shuruk)" stroke="#fff" stroke-width="3" class="dot-pulse"/></g>

        <!-- tap zones -->
        <circle class="hot" data-g="holam" cx="150" cy="104" r="30" tabindex="0" role="button" aria-label="מצח"/>
        <circle class="hot" data-g="shuruk" cx="152" cy="186" r="20" tabindex="0" role="button" aria-label="אף"/>
        <circle class="hot" data-g="tsere" cx="92" cy="212" r="22" tabindex="0" role="button" aria-label="לחי"/>
        <circle class="hot" data-g="tsere" cx="208" cy="212" r="22" tabindex="0" role="button" aria-label="לחי"/>
        <circle class="hot" data-g="hiriq" cx="150" cy="270" r="18" tabindex="0" role="button" aria-label="סנטר"/>
        <rect class="hot" data-g="kamatz" x="70" y="292" width="160" height="40" rx="16" tabindex="0" role="button" aria-label="מתחת לסנטר"/>
      </svg>
      <p class="hint" id="hint">לחצו על מקום בפרצוף או על ניקוד</p>
    </div>

    <!-- LEARN panel -->
    <div class="panel" id="learn">
      <div class="grid" id="buttons"></div>
      <div class="card info" id="info">
        <div class="info-top">
          <div class="big" id="i-big">מ</div>
          <div>
            <h2 id="i-name">בחרו ניקוד</h2>
            <p class="sound" id="i-sound"></p>
          </div>
        </div>
        <p id="i-place" class="muted">כל ניקוד מקבל מקום משלו בפרצוף.</p>
        <div class="row"><button class="btn" id="i-play" hidden>🔊 שמיעה</button></div>
      </div>
    </div>

    <!-- QUIZ panel -->
    <div class="panel" id="quiz" hidden>
      <div class="card">
        <div class="score" id="q-count">שאלה 1 מתוך 10</div>
        <div class="q-letter" id="q-letter">מָ</div>
        <p class="q-msg" id="q-msg">איפה הניקוד הזה בפרצוף?</p>
        <div class="row" style="justify-content:center">
          <button class="btn ghost" id="q-play">🔊 שמיעה</button>
          <button class="btn" id="q-next" hidden>הבא ←</button>
        </div>
        <div class="stars" id="stars"></div>
      </div>
    </div>
  </div>
  <p class="note" id="voice-note" hidden>במכשיר הזה אין קול בעברית, לכן ההשמעה לא תעבוד.</p>
</div>

<script>
const G = {
  kamatz:{name:'קָמָץ · פַּתָּח', sound:'אָה', syl:['מָ','מַ'], say:'מָה', place:'יד ישרה מתחת לסנטר', c:'--kamatz'},
  tsere:{name:'צֵירֵה · סֶגּוֹל', sound:'אֶה', syl:['מֵ','מֶ'], say:'מֶה', place:'שתי אצבעות מצביעות על הגומות בלחיים', c:'--tsere'},
  hiriq:{name:'חִירִיק', sound:'אִי', syl:['מִ'], say:'מִי', place:'נקודה על הסנטר', c:'--hiriq'},
  holam:{name:'חוֹלָם', sound:'אוֹ', syl:['מוֹ'], say:'מוֹ', place:'נקודה על המצח', c:'--holam'},
  shuruk:{name:'שׁוּרוּק', sound:'אוּ', syl:['מוּ'], say:'מוּ', place:'נקודה על האף', c:'--shuruk'}
};
const $ = id => document.getElementById(id);
let mode = 'learn', current = null;

/* speech */
let heVoice = null;
function loadVoices(){ try{ const v = speechSynthesis.getVoices(); heVoice = v.find(x=>/^he|^iw/i.test(x.lang)) || null; if(v.length && !heVoice) $('voice-note').hidden=false; }catch(e){} }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function say(t){ try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang='he-IL'; if(heVoice) u.voice=heVoice; u.rate=.8; speechSynthesis.speak(u);}catch(e){} }

function showGesture(id){
  document.querySelectorAll('.gesture').forEach(g=>g.classList.remove('on'));
  if(id){ const g = $('g-'+id); void g.getBBox(); requestAnimationFrame(()=>g.classList.add('on')); }
}

/* learn */
const btns = $('buttons');
Object.entries(G).forEach(([id,g])=>{
  const b = document.createElement('button');
  b.className='nk'; b.dataset.g=id; b.style.setProperty('--c',`var(${g.c})`);
  b.innerHTML = `<span class="lt">${g.syl.join(' ')}</span><span class="nm">${g.name}</span>`;
  b.onclick = ()=>select(id,true);
  btns.appendChild(b);
});
function select(id, speak){
  current = id; const g = G[id];
  showGesture(id);
  document.querySelectorAll('.nk').forEach(b=>b.classList.toggle('on', b.dataset.g===id));
  const info = $('info'); info.style.setProperty('--c',`var(${g.c})`);
  $('i-big').textContent = g.syl.join(' ');
  $('i-name').textContent = g.name;
  $('i-sound').textContent = 'הצליל: ' + g.sound;
  $('i-place').textContent = g.place;
  $('i-play').hidden = false;
  if(speak) say(g.say);
}
$('i-play').onclick = ()=> current && say(G[current].say);

/* face taps */
document.querySelectorAll('.hot').forEach(h=>{
  const act = ()=> mode==='learn' ? select(h.dataset.g,true) : answer(h.dataset.g);
  h.addEventListener('click',act);
  h.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();act();} });
});

/* quiz */
const ALL = Object.entries(G).flatMap(([id,g])=>g.syl.map((s,i)=>({id,s,say:g.say})));
const TOTAL = 10;
let qi=0, score=0, q=null, locked=false, firstTry=true, last=null;
function newRound(){ qi=0; score=0; renderStars(); nextQ(); }
function nextQ(){
  if(qi>=TOTAL){ endRound(); return; }
  let pick; do{ pick = ALL[Math.floor(Math.random()*ALL.length)]; }while(last && pick.s===last.s);
  q=last=pick; locked=false; firstTry=true; qi++;
  showGesture(null);
  $('q-count').textContent = `שאלה ${qi} מתוך ${TOTAL}`;
  $('q-letter').textContent = q.s;
  $('q-msg').textContent = 'איפה הניקוד הזה בפרצוף?'; $('q-msg').className='q-msg';
  $('q-next').hidden = true; $('q-play').hidden=false;
}
function answer(id){
  if(locked||!q) return;
  if(id===q.id){
    locked=true; if(firstTry) score++;
    showGesture(id); say(q.say);
    $('q-msg').textContent = ['כל הכבוד! 🎉','מצוין! ⭐','נכון מאוד! 👏'][Math.floor(Math.random()*3)] + ' ' + G[id].place;
    $('q-msg').className='q-msg good'; renderStars();
    $('q-next').hidden=false; $('q-next').textContent = qi>=TOTAL ? 'לסיכום ←' : 'הבא ←'; $('q-next').focus();
  } else {
    firstTry=false;
    $('q-msg').textContent = 'עוד לא... נסו שוב 🙂'; $('q-msg').className='q-msg bad';
    const st=$('stage'); st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake');
  }
}
function renderStars(){ $('stars').innerHTML = Array.from({length:TOTAL},(_,i)=>`<span class="${i<score?'got':''}">★</span>`).join(''); }
function endRound(){
  q=null; showGesture(null);
  $('q-count').textContent='סיום!';
  $('q-letter').textContent = score>=8?'🏆':score>=5?'🌟':'💪';
  $('q-msg').textContent = `קיבלתם ${score} כוכבים מתוך ${TOTAL}`; $('q-msg').className='q-msg good';
  $('q-play').hidden=true; $('q-next').hidden=false; $('q-next').textContent='שחקו שוב';
}
$('q-next').onclick = ()=> q===null ? newRound() : nextQ();
$('q-play').onclick = ()=> q && say(q.say);

/* tabs */
function setMode(m){
  mode=m;
  $('tab-learn').setAttribute('aria-selected', m==='learn');
  $('tab-quiz').setAttribute('aria-selected', m==='quiz');
  $('learn').hidden = m!=='learn'; $('quiz').hidden = m!=='quiz';
  $('hint').textContent = m==='learn' ? 'לחצו על מקום בפרצוף או על ניקוד' : 'לחצו על המקום הנכון בפרצוף';
  if(m==='quiz') newRound(); else { showGesture(current); }
}
$('tab-learn').onclick=()=>setMode('learn');
$('tab-quiz').onclick=()=>setMode('quiz');

select('kamatz',false);
</script>
