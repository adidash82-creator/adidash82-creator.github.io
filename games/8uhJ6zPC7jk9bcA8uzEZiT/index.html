<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>מעבדת המילים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: a lab bench — four numbered stations on a grid, one experiment card at a time */
:root{
  --bg:#eef1f7; --panel:#ffffff; --ink:#1d2340; --muted:#5d6584;
  --line:#d5dae8; --accent:#e4572e; --accent-ink:#ffffff;
  --ok:#1f8a5b; --ok-bg:#e2f4ea; --bad:#c23b3b; --bad-bg:#fbe7e6;
  --chip:#e3e7f3;
  --s1:#3b5bdb; --s2:#e4572e; --s3:#0f8b8d; --s4:#a23ea8;
  --display:"Suez One","Assistant",Arial,sans-serif;
  --body:"Assistant","Arial Hebrew",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12152a; --panel:#1c2140; --ink:#eef0fa; --muted:#a3aac8; --line:#2f365e;
  --accent:#ff7a52; --accent-ink:#1a1020; --ok:#4fd197; --ok-bg:#16382c; --bad:#ff7d7d; --bad-bg:#3d1d24;
  --chip:#272d52; --s1:#7d97ff; --s2:#ff8a63; --s3:#3fc7c9; --s4:#d27ad8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12152a; --panel:#1c2140; --ink:#eef0fa; --muted:#a3aac8; --line:#2f365e;
  --accent:#ff7a52; --accent-ink:#1a1020; --ok:#4fd197; --ok-bg:#16382c; --bad:#ff7d7d; --bad-bg:#3d1d24;
  --chip:#272d52; --s1:#7d97ff; --s2:#ff8a63; --s3:#3fc7c9; --s4:#d27ad8; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:18px;line-height:1.5;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,2.8rem);line-height:1.1}
.sub{color:var(--muted);margin:4px 0 0}
header{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.total{font-family:var(--display);font-size:1.1rem;background:var(--chip);border-radius:999px;padding:6px 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.station{all:unset;cursor:pointer;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px;position:relative;transition:transform .15s,border-color .15s}
.station:hover{transform:translateY(-2px);border-color:var(--c)}
.station:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.station .no{font-family:var(--display);color:var(--c);font-size:.95rem;letter-spacing:.04em}
.station h2{font-size:1.6rem}
.station p{margin:0;color:var(--muted);font-size:1rem}
.stars{font-size:1.2rem;letter-spacing:2px;color:var(--c)}
.stars .off{color:var(--line)}
.mix{grid-column:1/-1;border-style:dashed}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.back{all:unset;cursor:pointer;color:var(--muted);font-weight:600}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.now{outline:2px solid var(--c);outline-offset:2px}
.tag{font-family:var(--display);color:var(--c);font-size:1rem}
.ask{color:var(--muted);font-weight:600;margin:0}
.prompt{font-family:var(--display);font-size:clamp(1.8rem,7vw,2.6rem);line-height:1.3;text-align:center;padding:14px;background:var(--chip);border-radius:14px}
.prompt .gap{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--c);margin:0 .2em}
.opts{display:grid;gap:10px}
.opt{all:unset;cursor:pointer;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px 16px;font-size:1.45rem;text-align:center;font-weight:600}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:12px 16px;font-size:1.05rem}
.fb.ok{background:var(--ok-bg);color:var(--ok)} .fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb b{font-family:var(--display);font-weight:400}
.next{all:unset;cursor:pointer;align-self:flex-start;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:999px;padding:10px 26px;font-size:1.1rem}
.next:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.end{text-align:center;align-items:center}
.big{font-family:var(--display);font-size:3rem;color:var(--c)}
.streak{font-size:.95rem;color:var(--muted)}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.pop{animation:pop .25s ease}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.station{transition:none}}
</style>

<div class="wrap" id="app"></div>

<script>
const ST = [
 {id:"shoresh", name:"שורש", c:"var(--s1)", desc:"מוציאים את שלוש אותיות השורש", ask:"מה השורש של המילה?", qs:[
  ["מִכְתָּב","כ.ת.ב",["מ.כ.ת","ת.כ.ב"],"מ' בהתחלה היא תוספת. משפחה: כָּתַב, כְּתֹבֶת."],
  ["תַּלְמִיד","ל.מ.ד",["ת.ל.מ","מ.י.ד"],"ת' וי' הן תוספות. משפחה: לָמַד, מְלַמֵּד."],
  ["מִשְׁמֶרֶת","ש.מ.ר",["מ.ש.מ","ש.מ.ת"],"מ' בהתחלה ות' בסוף הן תוספות. משפחה: שׁוֹמֵר."],
  ["סִפְרִיָּה","ס.פ.ר",["פ.ר.י","ס.פ.י"],"יָּה בסוף היא תוספת. משפחה: סֵפֶר, סוֹפֵר."],
  ["מַחְשֵׁב","ח.ש.ב",["מ.ח.ש","מ.ש.ב"],"מ' בהתחלה היא תוספת. משפחה: חָשַׁב, חֶשְׁבּוֹן."],
  ["מִסְגֶּרֶת","ס.ג.ר",["מ.ס.ג","ג.ר.ת"],"מ' ות' הן תוספות. משפחה: סָגַר, סָגוּר."],
  ["זִכָּרוֹן","ז.כ.ר",["כ.ר.ן","ז.כ.ן"],"וֹן בסוף היא תוספת. משפחה: זָכַר, מַזְכִּיר."],
  ["שַׂחְקָן","שׂ.ח.ק",["ח.ק.ן","שׂ.ח.ן"],"ן בסוף היא תוספת. משפחה: מִשְׂחָק."]
 ]},
 {id:"poal", name:"פועל", c:"var(--s2)", desc:"זמן, גוף ושם הפועל", ask:"איזה פועל מתאים?", qs:[
  ["ש.מ.ר · עבר · אני","שָׁמַרְתִּי",["שָׁמַרְנוּ","אֶשְׁמֹר"],"עבר + אני = סיומת ־תִּי."],
  ["כ.ת.ב · הווה · היא","כּוֹתֶבֶת",["כּוֹתֵב","כָּתְבָה"],"הווה, נקבה יחידה = כּוֹתֶבֶת. כָּתְבָה היא עבר."],
  ["ל.מ.ד · עתיד · אנחנו","נִלְמַד",["לָמַדְנוּ","יִלְמְדוּ"],"עתיד + אנחנו = נ' בהתחלה."],
  ["ס.ג.ר · שם הפועל","לִסְגֹּר",["סוֹגֵר","סָגַר"],"שם הפועל מתחיל ב־לְ/לִ ואין לו זמן."],
  ["ג.מ.ר · עבר · הם","גָּמְרוּ",["יִגְמְרוּ","גּוֹמְרִים"],"עבר + הם = סיומת ־וּ."],
  ["ז.כ.ר · עתיד · אני","אֶזְכֹּר",["זָכַרְתִּי","תִּזְכֹּר"],"עתיד + אני = א' בהתחלה."],
  ["ש.ב.ר · עבר · את","שָׁבַרְתְּ",["שָׁבַרְתָּ","תִּשְׁבְּרִי"],"את = ־תְּ (בשווא). אתה = ־תָּ."],
  ["פ.ק.ד · עתיד · הם","יִפְקְדוּ",["פָּקְדוּ","נִפְקֹד"],"עתיד + הם = י' בהתחלה ו־וּ בסוף."]
 ]},
 {id:"smichut", name:"סמיכות", c:"var(--s3)", desc:"נסמך + סומך, ואיפה ה' הידיעה", ask:"איזה צירוף כתוב נכון?", qs:[
  ["אֲרוּחָה + עֶרֶב","אֲרוּחַת עֶרֶב",["אֲרוּחָה עֶרֶב","הָאֲרוּחַת עֶרֶב"],"־ה בסוף הנסמך הופכת ל־ת."],
  ["סְפָרִים + לִמּוּד","סִפְרֵי לִמּוּד",["סְפָרִים לִמּוּד","סִפְרִים לִמּוּד"],"־ים בנסמך הופך ל־י."],
  ["חֶדֶר + הַמּוֹרִים","חֲדַר הַמּוֹרִים",["הַחֶדֶר הַמּוֹרִים","הַחֲדַר מוֹרִים"],"ה' הידיעה באה רק בסומך."],
  ["תַּלְמִידִים + הַתִּיכוֹן","תַּלְמִידֵי הַתִּיכוֹן",["הַתַּלְמִידִים הַתִּיכוֹן","תַּלְמִידִים הַתִּיכוֹן"],"־ים ← ־י, וה' הידיעה בסומך."],
  ["עוּגָה + שׁוֹקוֹלָד","עוּגַת שׁוֹקוֹלָד",["עוּגָה שׁוֹקוֹלָד","הָעוּגַת שׁוֹקוֹלָד"],"־ה ← ־ת."],
  ["בֵּית סֵפֶר + ה' הידיעה","בֵּית הַסֵּפֶר",["הַבַּיִת סֵפֶר","הַבֵּית הַסֵּפֶר"],"מיידעים רק את הסומך: בֵּית הַסֵּפֶר."],
  ["כִּתָּה + הַמַּדָּעִים","כִּתַּת הַמַּדָּעִים",["כִּתָּה הַמַּדָּעִים","הַכִּתַּת מַדָּעִים"],"־ה ← ־ת, וה' הידיעה בסומך."],
  ["שִׁירִים + יְלָדִים","שִׁירֵי יְלָדִים",["שִׁירִים יְלָדִים","הַשִּׁירֵי יְלָדִים"],"־ים ← ־י."]
 ]},
 {id:"hetem", name:"התאם", c:"var(--s4)", desc:"שם התואר מתאים במין, מספר ויידוע", ask:"השלימי את שם התואר:", qs:[
  ["הַיַּלְדָּה _ (חָדָשׁ)","הַחֲדָשָׁה",["חֲדָשָׁה","הֶחָדָשׁ"],"ילדה: נקבה, יחידה, מיודעת ← הַחֲדָשָׁה."],
  ["סְפָרִים _ (גָּדוֹל)","גְּדוֹלִים",["הַגְּדוֹלִים","גְּדוֹלוֹת"],"ספרים: זכר, רבים, לא מיודע ← גְּדוֹלִים."],
  ["כִּתַּת הַמַּדָּעִים _ (חָדָשׁ)","הַחֲדָשָׁה",["הַחֲדָשִׁים","חֲדָשָׁה"],"מתאימים לנסמך: כיתה – נקבה, יחידה. הצירוף מיודע."],
  ["סִפְרֵי הַלִּמּוּד _ (יָשָׁן)","הַיְּשָׁנִים",["הַיָּשָׁן","יְשָׁנִים"],"מתאימים לנסמך: ספרי – זכר, רבים, ומיודע."],
  ["חֲדַר הַמּוֹרִים _ (גָּדוֹל)","הַגָּדוֹל",["הַגְּדוֹלִים","גָּדוֹל"],"החדר גדול, לא המורים: זכר, יחיד, מיודע."],
  ["אֲרוּחַת הָעֶרֶב _ (טָעִים)","הַטְּעִימָה",["הַטָּעִים","טְעִימָה"],"ארוחה – נקבה, יחידה, מיודעת."],
  ["שַׂחְקָנֵי הַקְּבוּצָה _ (טוֹב)","הַטּוֹבִים",["הַטּוֹבָה","טוֹבִים"],"השחקנים טובים, לא הקבוצה: זכר, רבים, מיודע."],
  ["נַעֲלֵי סְפּוֹרְט _ (חָדָשׁ)","חֲדָשׁוֹת",["הַחֲדָשׁוֹת","חֲדָשִׁים"],"נעליים – נקבה, רבות, והצירוף לא מיודע."]
 ]}
];
const MIX = {id:"mix", name:"אתגר מעורב", c:"var(--accent)", desc:"10 שאלות מכל התחנות"};
const PRAISE = ["מצוין!","בדיוק!","נכון מאוד!","יפה!","את בעניין!"];

let best = {};
try { best = JSON.parse(localStorage.getItem("mabada-best")||"{}"); } catch(e){ best = {}; }
function saveBest(){ try{ localStorage.setItem("mabada-best", JSON.stringify(best)); }catch(e){} }

const app = document.getElementById("app");
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const starsFor = (s,n) => s===n?3 : s>=Math.ceil(n*.75)?2 : s>=Math.ceil(n*.5)?1 : 0;
const starHTML = k => [0,1,2].map(i=>`<span class="${i<k?"":"off"}">★</span>`).join("");

function home(){
  const total = Object.values(best).reduce((a,b)=>a+b,0);
  app.innerHTML = `
  <header><div><h1>מעבדת המילים</h1><p class="sub">ארבע תחנות, כל אחת עם 8 ניסויים. אספי כוכבים בכל תחנה.</p></div>
  <span class="total" aria-label="סך הכוכבים">★ ${total} / 15</span></header>
  <div class="grid">
   ${ST.map((s,i)=>`<button class="station" style="--c:${s.c}" data-id="${s.id}">
     <span class="no">תחנה ${i+1}</span><h2>${s.name}</h2><p>${s.desc}</p>
     <span class="stars">${starHTML(best[s.id]||0)}</span></button>`).join("")}
   <button class="station mix" style="--c:${MIX.c}" data-id="mix">
     <span class="no">בונוס</span><h2>${MIX.name}</h2><p>${MIX.desc}</p>
     <span class="stars">${starHTML(best.mix||0)}</span></button>
  </div>`;
  app.querySelectorAll(".station").forEach(b=>b.onclick=()=>start(b.dataset.id));
}

function start(id){
  let qs, meta;
  if(id==="mix"){
    meta = MIX;
    qs = shuffle(ST.flatMap(s=>s.qs.map(q=>({q,s})))).slice(0,10);
  } else {
    meta = ST.find(s=>s.id===id);
    qs = shuffle(meta.qs).map(q=>({q,s:meta}));
  }
  const run = {meta, qs, i:0, score:0, streak:0, res:[]};
  ask(run);
}

function ask(run){
  const {q,s} = run.qs[run.i];
  const [prompt, right, wrongs, why] = q;
  const opts = shuffle([right, ...wrongs]);
  const promptHTML = prompt.replace(" _ ", ' <span class="gap"></span> ');
  app.innerHTML = `
  <div class="card pop" style="--c:${s.c}">
   <div class="topbar">
    <button class="back" id="back">→ לכל התחנות</button>
    <div class="dots" aria-label="התקדמות">${run.qs.map((_,k)=>`<span class="dot ${run.res[k]===true?"ok":run.res[k]===false?"bad":""} ${k===run.i?"now":""}"></span>`).join("")}</div>
   </div>
   <div><span class="tag">${run.meta.id==="mix"?"מעורב · "+s.name:"תחנת "+s.name} · ${run.i+1} מתוך ${run.qs.length}</span>
   <p class="ask">${s.ask}</p></div>
   <div class="prompt">${promptHTML}</div>
   <div class="opts">${opts.map((o,k)=>`<button class="opt" id="opt${k}" data-v="${o}">${o}</button>`).join("")}</div>
   <div id="fb" aria-live="polite"></div>
  </div>`;
  document.getElementById("back").onclick = home;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const ok = b.dataset.v===right;
    app.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(x.dataset.v===right) x.classList.add("right"); });
    if(!ok) b.classList.add("wrong");
    run.res[run.i]=ok;
    if(ok){ run.score++; run.streak++; } else run.streak=0;
    const last = run.i===run.qs.length-1;
    document.getElementById("fb").innerHTML = `
     <div class="fb ${ok?"ok":"bad"}"><b>${ok?PRAISE[Math.floor(Math.random()*PRAISE.length)]:"כמעט! התשובה: "+right}</b> ${why}
     ${ok&&run.streak>=3?`<div class="streak">רצף של ${run.streak} תשובות נכונות</div>`:""}</div>
     <div style="margin-top:12px"><button class="next" id="next">${last?"לתוצאות":"לניסוי הבא"}</button></div>`;
    const n = document.getElementById("next"); n.focus();
    n.onclick = ()=>{ if(last) end(run); else { run.i++; ask(run); } };
  });
}

function end(run){
  const n = run.qs.length, k = starsFor(run.score,n), id = run.meta.id;
  if(k>(best[id]||0)){ best[id]=k; saveBest(); }
  const msg = k===3?"ציון מושלם!":k===2?"עבודה טובה, עוד קצת ושלושה כוכבים.":k===1?"התחלה טובה. נסי שוב, השאלות יתערבבו.":"בואי ננסה שוב יחד.";
  app.innerHTML = `
  <div class="card end pop" style="--c:${run.meta.c}">
   <span class="tag">${run.meta.name}</span>
   <div class="big">${run.score} / ${n}</div>
   <div class="stars" style="font-size:2rem">${starHTML(k)}</div>
   <p>${msg}</p>
   <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
    <button class="next" id="again">שחקי שוב</button>
    <button class="back" id="home">→ לכל התחנות</button>
   </div>
  </div>`;
  document.getElementById("again").onclick=()=>start(id);
  document.getElementById("home").onclick=home;
}
home();
</script>
