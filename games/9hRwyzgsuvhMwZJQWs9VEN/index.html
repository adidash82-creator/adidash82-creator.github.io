*{box-sizing:border-box}
body{margin:0;font-family:NSH,system-ui,sans-serif;background:#f4f1fb;color:#222}
.wrap{display:flex;gap:16px;padding:14px;align-items:flex-start;max-width:1500px;margin:auto}
.boardbox{flex:1;min-width:0}
.boardbox svg{width:100%;height:auto;display:block}
.panel{width:430px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
@media(max-width:1000px){.wrap{flex-direction:column}.panel{width:100%}}
.box{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 2px 8px rgba(60,30,120,.08)}
.turn{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}
.dot{width:22px;height:22px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:8px}
.sc{border-radius:12px;padding:6px 8px;background:#f6f3ff;text-align:center;font-weight:700;border:3px solid transparent}
.sc.on{border-color:#7b4fc4;background:#efe6ff}
.sc b{display:block;font-size:24px}
.tcard{background:#eef7ff;border:2px solid #9cc7ef;border-radius:16px;overflow:hidden}
.tcard .band{background:#3b8fd9;color:#fff;padding:6px 12px;font-weight:700;display:flex;justify-content:space-between}
.tcard h2{margin:8px 12px 2px;text-align:center;color:#1d4f8a;font-size:24px}
.tcard .body{padding:2px 16px 12px;font-size:20px;line-height:1.75}
.tcard .body p{margin:0 0 2px}
.pcard{background:#f6f0ff;border:2px solid #c9b6ea;border-radius:16px;overflow:hidden;text-align:center;animation:pop .35s}
.pcard .band{color:#fff;padding:6px 10px 8px}
.pcard .band small{display:block;font-size:13px;opacity:.9}
.pcard .band b{font-size:28px}
.pcard .q{font-size:23px;font-weight:700;line-height:1.6;padding:16px 18px;color:#2b1d4a}
.pcard .rw{font-size:14px;color:#6b4fa0;font-weight:700;padding-bottom:10px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
button{font-family:inherit;font-size:19px;font-weight:700;border:0;border-radius:14px;padding:12px 16px;cursor:pointer}
.btn-blue{background:#3b8fd9;color:#fff}.btn-purple{background:#7b4fc4;color:#fff}
.btn-ok{background:#2e9e5b;color:#fff}.btn-no{background:#e6e1ef;color:#444}
.btn-light{background:#eef2f8;color:#2f4f7a;font-size:15px;padding:8px 12px}
.row{display:flex;gap:10px}.row>*{flex:1}
.placeholder{border:2px dashed #c9bfe0;border-radius:16px;padding:22px;text-align:center;color:#8a7fa8}
.msg{min-height:26px;font-weight:700;color:#4a2c8a;text-align:center}
.modal{position:fixed;inset:0;background:rgba(30,15,60,.45);display:flex;align-items:center;justify-content:center;z-index:9}
.modal .in{background:#fff;border-radius:22px;padding:24px 26px;max-width:460px;width:92%;text-align:center;animation:pop .3s}
.modal h1{margin:0 0 8px;color:#4a2c8a}
.modal input{font-family:inherit;font-size:18px;padding:9px 12px;border-radius:10px;border:2px solid #d8cfee;width:100%;margin:5px 0}
.nbtn.sel{background:#7b4fc4;color:#fff}
.hidden{display:none!important}
.big{font-size:60px;line-height:1}
#pawns g{transition:transform .28s ease}

<script>
const D={"texts": [{"g": "סיפור", "t": "הסוד של המורה לנגינה", "l": ["כבר שלושה חודשים ניסתה ליה לנגן את הקטע הקשה בפסנתר, ובכל פעם נתקעו האצבעות שלה באותו מקום, כמו מכונית שנתקעה בבוץ. ביום שלישי אחד, אחרי השיעור, טרקה את מכסה הפסנתר והודיעה שהיא מפסיקה. המורה, גברת אדלר, לא כעסה. היא הוציאה ממגירה מחברת ישנה ומצהיבה והראתה לליה דף מלא מחיקות. \"זה הקטע הראשון שניסיתי לנגן כשהייתי בגילך,\" אמרה, \"לקח לי חצי שנה.\" ליה הסתכלה על המחיקות ופתאום הרגישה שהיא לא לבד. באותו ערב, בחדרה, ניגנה את הקטע לאט־לאט, תיבה אחר תיבה. כעבור חודש, בקונצרט הסיום של בית הספר למוזיקה, ניגנה אותו מתחילתו ועד סופו, והאצבעות שלה רקדו על הקלידים."]}, {"g": "סיפור", "t": "הארנק שבתחנה", "l": ["בבוקר חורפי, בדרך לבית הספר, מצא אורי ארנק חום מתחת לספסל בתחנת האוטובוס. בתוכו היו שלוש מאות שקלים, תעודה של אישה בשם רחל מזרחי ותמונה של ילד קטן. אורי עמד רגע מהוסס. הוא חשב על הנעליים החדשות שחלם עליהן כבר חודשים, אבל אז הביט שוב בתמונה של הילד. אחרי הלימודים הלך עם אמו לכתובת שהופיעה בתעודה. אישה מבוגרת פתחה את הדלת, ועיניה התמלאו דמעות כשראתה את הארנק. היא סיפרה שהכסף נועד לקנות תרופות לנכדה. היא רצתה לתת לאורי פרס, אבל הוא סירב בנימוס. בדרך הביתה הרגיש אורי קליל כמו נוצה, ואמו אמרה שזו ההרגשה הכי שווה שיש."]}, {"g": "סיפור", "t": "גשר של חבלים", "l": ["בטיול השנתי לגליל הגיעה כיתה ו' לגשר חבלים שנמתח מעל ערוץ עמוק. כל הילדים חצו אותו בצחוק, אבל רוני קפא במקומו. הלב שלו הלם כמו תוף, והרגליים סירבו לזוז. כמה ילדים התחילו לקרוא לו \"פחדן\", ורוני רצה להיעלם. אז ניגשה אליו מאיה, שבדרך כלל כמעט לא דיברה איתו. \"גם אני פחדתי,\" לחשה, \"תסתכל רק על הגב שלי, לא למטה.\" היא הלכה לפניו לאט, צעד אחרי צעד, ודיברה איתו כל הזמן על הסדרה האהובה עליהם. כשהגיעו לצד השני, רוני לא האמין שעשה זאת. מאותו יום הם ישבו יחד בהפסקות, ורוני הבין שאומץ אינו היעדר פחד, אלא ההחלטה להתקדם למרות הפחד."]}, {"g": "סיפור", "t": "העיתון של הכיתה", "l": ["בתחילת השנה הציעה המחנכת לכיתה ו'3 להוציא עיתון כיתתי. נועה, שחלמה להיות עיתונאית, התמנתה לעורכת. היא חילקה תפקידים: תמר תכתוב על ספורט, יואב יצייר קריקטורות, ועידו יראיין את השרת הוותיק. אבל ככל שהתקרב מועד ההדפסה, נועה התחילה לשכתב את הכתבות של כולם, כי לדעתה רק כך העיתון יהיה מושלם. החברים נעלבו, ויום אחד יואב קרע את הקריקטורה שלו ויצא מהכיתה בכעס. נועה הבינה שהעיתון עלול להתפרק. בערב כתבה לכל אחד מהם הודעת התנצלות, וביקשה להחליט יחד מה ייכנס לגיליון. הגיליון הראשון יצא באיחור של שבוע, אבל כולם הסכימו שהוא העיתון הכי טוב שהיה לכיתה אי פעם."]}, {"g": "סיפור", "t": "המכתב מסבא", "l": ["ביום הולדתו השתים־עשרה קיבל דניאל מעטפה ישנה, שסבו השאיר לו לפני מותו, עם הוראה ברורה: \"לפתוח רק בגיל 12\". הידיים שלו רעדו כשפתח אותה. בתוך המעטפה היה מכתב בכתב יד עגול ומפה מצוירת של המושב. סבא סיפר במכתב שבילדותו שתל עץ תאנה ליד באר ישנה, ושאל אם העץ עדיין חי. באותה שבת יצאו דניאל ואביו לחפש. אחרי שעה של הליכה בין שדות, הם גילו עץ תאנה ענק, שענפיו נפרשו כמו זרועות פתוחות. דניאל טיפס עליו וישב על ענף רחב. הוא הרגיש, כך אמר אחר כך, כאילו סבא מחבק אותו. לפני שחזרו הביתה שתל דניאל לידו שתיל קטן משלו."]}, {"g": "טקסט מידעי", "t": "העגורים של עמק החולה", "l": ["בכל סתיו עוברות בשמי ישראל מאות מיליוני ציפורים בדרכן מאירופה לאפריקה. ישראל נמצאת על \"צוואר הבקבוק\" שבין שלוש יבשות, ולכן היא אחד מנתיבי הנדידה החשובים בעולם. בין הנודדים בולטים העגורים, ציפורים גדולות ואפורות בעלות קול חצוצרה. עשרות אלפי עגורים כבר אינם ממשיכים לאפריקה, אלא נשארים לחרוף בעמק החולה. בעבר גרמה הנוכחות שלהם לנזקים קשים לחקלאים, משום שהעגורים אכלו את הזרעים שנזרעו בשדות. כדי לפתור את הבעיה, החלו להאכיל את העגורים בתירס באגמון החולה, הרחק מהשדות. כך נשמרים גם היבולים וגם הציפורים. כיום אגמון החולה הוא מוקד משיכה לתיירים, הבאים לצפות בלהקות העגורים הממריאות בשחר."]}, {"g": "טקסט מידעי", "t": "איך נוצרים נטיפים?", "l": ["במערות רבות אפשר לראות עמודים מאבן, שנראים כמו פסלים שיצר אמן. אלה הם נטיפים וזקיפים. מי גשם מחלחלים דרך האדמה וממיסים בדרכם מעט מסלע הגיר. כשטיפת המים מגיעה לתקרת המערה ומתאדה, נשאר ממנה שכבה דקיקה של אבן. טיפה אחר טיפה, במשך אלפי שנים, נבנה נטיף שתלוי מהתקרה כמו קרח. הטיפות שנופלות לרצפה בונות ממול זקיף, שגדל כלפי מעלה. לפעמים השניים נפגשים ויוצרים עמוד. הנטיפים גדלים לאט מאוד, לעיתים סנטימטר אחד במאה שנה, ולכן אסור לגעת בהם. בישראל אפשר לראות אותם במערת הנטיפים שליד בית שמש, שהתגלתה במקרה בשנת 1968, בזמן פיצוץ במחצבה."]}, {"g": "טקסט מידעי", "t": "הלב: משאבה שלא נחה", "l": ["הלב הוא שריר בגודל של אגרוף, הנמצא בחלק השמאלי של בית החזה. תפקידו להזרים דם לכל חלקי הגוף. הדם נושא חמצן ומזון לתאים, ומפנה מהם פסולת. הלב מחולק לארבעה חללים: שתי עליות ושני חדרים. הצד הימני שולח את הדם לריאות כדי לקבל חמצן, והצד השמאלי שולח את הדם העשיר בחמצן אל שאר הגוף. אצל אדם בוגר הלב פועם בין 60 ל־100 פעמים בדקה במנוחה, כלומר כמאה אלף פעמים ביממה. בזמן מאמץ, כמו ריצה, הוא פועם מהר יותר, כי השרירים זקוקים ליותר חמצן. כדי לשמור על לב בריא, מומלץ לעסוק בפעילות גופנית, לאכול מזון מגוון ולהימנע מעישון."]}, {"g": "טקסט מידעי", "t": "ההמצאה ששינתה את העולם", "l": ["לפני כשש מאות שנה, כל ספר נכתב ביד. סופרים ישבו חודשים ארוכים והעתיקו מילה אחר מילה, ולכן הספרים היו נדירים ויקרים מאוד, ורק מעטים ידעו לקרוא. בסביבות שנת 1450 פיתח יוהנס גוטנברג, צורף מהעיר מגנץ שבגרמניה, מכונת דפוס חדשנית. הרעיון שלו היה ליצור אותיות נפרדות ממתכת, שאפשר לסדר אותן מחדש לכל עמוד. בעזרת המכונה אפשר היה להדפיס מאות עותקים בזמן שבעבר הספיקו להעתיק עותק אחד. בעקבות ההמצאה ירדו מחירי הספרים, רעיונות חדשים התפשטו במהירות, ויותר ויותר אנשים למדו לקרוא. היסטוריונים רבים רואים בדפוס את אחת ההמצאות החשובות בתולדות האנושות."]}, {"g": "טקסט טיעון", "t": "די לשיעורי הבית!", "l": ["לדעתי, יש לבטל את שיעורי הבית בבית הספר היסודי. ראשית, אחרי יום לימודים ארוך ילדים זקוקים למנוחה, למשחק ולזמן עם המשפחה, ושיעורי הבית גוזלים זמן יקר זה. שנית, שיעורי בית רבים יוצרים מתח וריבים בבית, במיוחד אצל ילדים שמתקשים ואין מי שיעזור להם. שלישית, חוקרים אחדים מצאו שבגיל היסודי לשיעורי הבית יש תרומה קטנה בלבד להישגים. יש הטוענים כי שיעורי הבית מלמדים אחריות והרגלי עבודה. אולם את האחריות אפשר ללמד גם בדרכים אחרות, למשל באמצעות פרויקטים בכיתה או תפקידים בבית. לכן אני מציע להחליף את שיעורי הבית בקריאה חופשית של עשרים דקות ביום, שתהיה הנאה ולא עונש. (עמית, כיתה ו')"]}, {"g": "טקסט טיעון", "t": "בעד תלבושת אחידה", "l": ["אני תומכת בחובת תלבושת אחידה בכל בתי הספר. הנימוק הראשון הוא שהתלבושת מצמצמת את התחרות על בגדים יקרים ומותגים. כשכולם לבושים באותה חולצה, אף ילד אינו מרגיש נחות בגלל מצבה הכלכלי של משפחתו. הנימוק השני הוא שהתלבושת חוסכת זמן בבוקר, כי אין צורך להתלבט מה ללבוש. נוסף על כך, היא יוצרת תחושת שייכות וגאווה בבית הספר. מתנגדי התלבושת טוענים שהיא פוגעת בחופש הביטוי ובאפשרות של כל ילד להביע את אישיותו. עם זאת, אפשר להביע אישיות גם בדרכים אחרות: בתסרוקת, בתיק, ובעיקר במעשים ובמילים. לסיכום, היתרונות של התלבושת האחידה גדולים בהרבה מחסרונותיה. (שירה, נציגת מועצת התלמידים)"]}, {"g": "טקסט טיעון", "t": "מכתב: שבילי אופניים בעיר", "l": ["לכבוד מהנדסת העיר, שלום רב. אנו, תלמידי כיתה ו' בבית הספר \"הדקל\", פונים אלייך בבקשה לסלול שביל אופניים לאורך רחוב הנשיא, המוביל לבית הספר. כיום רוכבים עשרות ילדים על הכביש עצמו, בין מכוניות ואוטובוסים, ובחודשים האחרונים אירעו שתי תאונות קלות. שביל אופניים יאפשר לנו להגיע לבית הספר בבטחה. מלבד זאת, אם יותר ילדים ירכבו על אופניים, יפחת מספר ההורים המסיעים ברכב, ויפחתו הפקקים וזיהום האוויר בבוקר. אנו יודעים שהרחוב צר, ולכן אנו מציעים לוותר על חלק ממקומות החניה בצד אחד שלו. נשמח להציג לך את הסקר שערכנו בקרב התלמידים. בתודה ובתקווה, תלמידי כיתה ו'."]}, {"g": "טקסט טיעון", "t": "גני חיות: מקלט או כלא?", "l": ["יש הרואים בגני חיות כלא לבעלי חיים, ולכן דורשים לסגור אותם. אני סבור שגני חיות מודרניים חשובים, ויש להמשיך לקיים אותם. ראשית, גני חיות רבים מגדלים מינים הנמצאים בסכנת הכחדה, ואף מחזירים חלק מהם לטבע. שנית, הם מאפשרים לילדים ולמבוגרים להכיר בעלי חיים מקרוב, וכך להבין מדוע חשוב לשמור עליהם. שלישית, בגני החיות מתבצע מחקר שעוזר לווטרינרים ולשומרי טבע ברחבי העולם. נכון שבעבר הוחזקו בעלי החיים בכלובים צרים ומשעממים, ובמקרים אלה הביקורת מוצדקת. אך גני החיות של היום משקיעים בשטחים רחבים, הדומים לבית הטבעי של החיות. לכן הפתרון אינו לסגור את גני החיות, אלא לדרוש מכולם לעמוד בתנאים הטובים ביותר. (ד\"ר איתן, וטרינר)"]}, {"g": "ידיעה עיתונאית", "t": "נער מצא מטבע עתיק בחוף", "l": ["אשקלון, יום שני. נער בן 12 מאשקלון מצא בסוף השבוע מטבע ברונזה עתיק בן כאלפיים שנה, בזמן ששיחק בחול בחוף העיר. המטבע נחשף לאחר הסערה שפקדה את האזור בשבוע שעבר, כשהגלים החזקים סחפו כמויות גדולות של חול. הנער, יונתן לוי, שם לב לעיגול ירקרק שבלט מהחול, והבין מיד שמדובר בדבר מיוחד. במקום לשמור את המטבע לעצמו, מסר אותו עם הוריו לרשות העתיקות. לדברי הארכאולוגים, על המטבע מופיעה דמותו של מלך יהודה, והוא יוצג בתערוכה במוזיאון. \"אני גאה שהמטבע יהיה במוזיאון ולא במגירה שלי,\" אמר יונתן. הוא קיבל תעודת הוקרה על אזרחות טובה."]}, {"g": "ידיעה עיתונאית", "t": "שיא תרומות לבנק המזון", "l": ["רחובות, יום חמישי. תלמידי בית הספר היסודי \"השקד\" ברחובות אספו השבוע יותר משלושה טון של מזון למשפחות נזקקות לקראת החג, שיא חדש בעיר. המבצע החל ביוזמה של מועצת התלמידים, שהציבה ארגזי איסוף בכניסה לבית הספר ובסופרמרקטים בשכונה. במשך שבועיים הביאו התלמידים והוריהם שקיות אורז, פסטה, שימורים ושמן. בכל כיתה נתלה מד שהראה את כמות המזון שנאספה, והכיתות התחרו ביניהן בהתלהבות. \"רצינו שכל משפחה בעיר תוכל לשבת לארוחת חג,\" אמרה יו\"ר המועצה, תלמידת כיתה ו'. המזון הועבר לבנק המזון העירוני, והמנהלת הודיעה כי המבצע יהפוך למסורת שנתית."]}, {"g": "ידיעה עיתונאית", "t": "שלג כבד ברמת הגולן", "l": ["קצרין, יום ראשון. סופת חורף עזה הביאה הלילה שלג כבד לרמת הגולן ולחרמון, ובמקומות מסוימים הצטברו יותר מחצי מטר של שלג. בשל הסכנה של החלקה על הכבישים, החליטה המשטרה לסגור את הדרכים העולות לחרמון ולחלק מיישובי הצפון. אלפי מטיילים שתכננו לנסוע לשלג התבקשו לדחות את הגעתם עד שהכבישים יפונו. בבתי הספר באזור בוטלו הלימודים, ולשמחתם של הילדים, הם יצאו לבנות אנשי שלג ולגלוש במזחלות. לדברי החזאים, השלג ימשיך לרדת גם מחר, ורק ביום שלישי צפויה התחממות. רשויות הצפון מבקשות מהציבור להתעדכן לפני היציאה לדרך ולא לנסוע בלי ציוד חורף מתאים."]}], "purple": [{"k": "who", "x": "מי הכותב או המספר של הטקסט? מה עמדתו כלפי הנושא? הביאו ראיה.", "task": false}, {"k": "who", "x": "למי מיועד הטקסט? איך ניכר הדבר בלשון או בתוכן?", "task": false}, {"k": "who", "x": "איזו דמות או איזה גורם השתנו במהלך הטקסט? תארו את השינוי.", "task": false}, {"k": "who", "x": "מי עשוי להתנגד לרעיון המרכזי בטקסט? מה הוא היה טוען?", "task":   let n=2;
  const render=()=>{modal(`<h1>מסלול הקריאה והחשיבה</h1>
   <p>כמה שחקנים?</p><div class="row">${[2,3,4].map(k=>`<button class="btn-no nbtn ${k==n?'sel':''}" data-k="${k}">${k}</button>`).join('')}</div>
   <div style="margin-top:12px">${[...Array(n).keys()].map(i=>`<div style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${COLORS[i]}"></span><input id="nm${i}" placeholder="${NAMES[i]}"></div>`).join('')}</div>
   <button class="btn-purple" style="width:100%;margin-top:14px" id="go">מתחילים!</button>`);
   document.querySelectorAll('.nbtn').forEach(b=>b.onclick=()=>{n=+b.dataset.k;render()});
   $('go').onclick=()=>start([...Array(n).keys()].map(i=>($('nm'+i).value.trim()||NAMES[i])));
  };
  render();
}
function start(names){
  S={players:names.map((nm,i)=>({name:nm,color:COLORS[i],pos:1,pts:0})),cur:0,tDeck:[],pDeck:[],text:null,card:null,busy:false,over:false};
  closeModal();drawPawns();newTurn(true);
}
function P(){return S.players[S.cur]}

function drawPawns(){
  const g=$('pawns');g.innerHTML='';
  S.players.forEach((p,i)=>{
    const el=document.createElementNS('http://www.w3.org/2000/svg','g');el.id='pw'+i;
    el.innerHTML=`<ellipse cx="0" cy="26" rx="17" ry="6" fill="rgba(0,0,0,.2)"/><path d="M-15,24 Q-15,4 0,0 Q15,4 15,24 Z" fill="${p.color}" stroke="#fff" stroke-width="3"/><circle cx="0" cy="-8" r="12" fill="${p.color}" stroke="#fff" stroke-width="3"/>`;
    g.appendChild(el);placePawn(i);
  });
}
const OFF=[[-24,-22],[24,-22],[-24,20],[24,20]];
function placePawn(i){const p=S.players[i],[x,y]=D.pos[p.pos],[dx,dy]=OFF[i];$('pw'+i).style.transform=`translate(${x+dx}px,${y+dy-4}px)`}

function renderSide(){
  const p=P();$('tdot').style.background=p.color;$('tname').textContent='התור של '+p.name;
  $('scores').innerHTML=S.players.map((q,i)=>`<div class="sc ${i==S.cur?'on':''}"><span class="dot" style="background:${q.color};width:14px;height:14px"></span> ${esc(q.name)}<b>${q.pts}</b><small>משבצת ${q.pos}</small></div>`).join('');
  // text
  if(S.text==null){$('textArea').innerHTML=`<div class="placeholder"><button class="btn-blue" onclick="newText()">📖 שלפו קלף טקסט</button></div>`}
  else{const t=D.texts[S.text];$('textArea').innerHTML=`<div class="tcard"><div class="band"><span>קלף טקסט ${S.text+1}${t.g?' · '+t.g:''}</span><button class="btn-light" style="padding:2px 10px;font-size:13px" onclick="newText()">טקסט חדש</button></div><h2>${t.t}</h2><div class="body">${t.l.map(l=>`<p>${esc(l)}</p>`).join('')}</div></div>`}
  // purple
  if(S.card==null){$('purpleArea').innerHTML=S.text==null?'':`<button class="btn-purple" style="width:100%" onclick="newCard()">❓ שלפו קלף סגל</button>`}
  else{const c=D.purple[S.card],cat=D.cats[c.k];
    $('purpleArea').innerHTML=`<div class="pcard"><div class="band" style="background:${cat.col}"><small>${c.task?'משימה':'חמשת הממים'}</small><b>${cat.lab}</b></div><div class="q">${esc(c.x)}</div><div class="rw">הצלחה = ${c.task?'3 צעדים · 2 נקדות':'2 צעדים · 1 נקדה'}</div></div>
    <div class="row" style="margin-top:10px"><button class="btn-ok" onclick="result(true)" ${S.busy?'disabled':''}>✓ הצליח</button><button class="btn-no" onclick="result(false)" ${S.busy?'disabled':''}>✗ לא הפעם</button></div>`}
}
function newText(){if(S.busy)return;S.text=draw('tDeck',D.texts);renderSide()}
function newCard(){if(S.busy)return;S.card=draw('pDeck',D.purple);say('');renderSide()}
function say(t){$('msg').textContent=t}

async function result(ok){
  if(S.busy)return;const c=D.purple[S.card],p=P();
  if(!ok){say('לא נורא! בתור הבא זה יצליח 💪');S.card=null;return setTimeout(()=>nextTurn(),900)}
  S.busy=true;renderSide();
  p.pts+=c.task?2:1;
  const steps=c.task?3:2;
  for(let k=0;k<steps&&p.pos<D.n;k++){p.pos++;placePawn(S.cur);await sleep(330)}
  S.busy=false;S.card=null;
  if(p.pos>=D.n)return finish();
  const sp=D.special[p.pos];
  if(sp==='star'){p.pts+=2;renderSide();modal(`<div class="big">⭐</div><h1>כוכב!</h1><p>${esc(p.name)} מקבל/ת 2 נקודות בונוס</p><button class="btn-purple" onclick="closeModal();nextTurn()">המשך</button>`)}
  else if(sp==='move'){renderSide();modal(`<div class="big">👟</div><h1>משימת תנועה</h1><p style="font-size:22px">קפצו 5 קפיצות במקום!</p><button class="btn-ok" onclick="P().pts++;closeModal();nextTurn()">עשיתי! (+1)</button>`)}
  else if(sp==='q'){renderSide();modal(`<div class="big">❓</div><h1>משבצת שאלה</h1><p>${esc(p.name)} שולף/ת עוד קלף סגול – באותו תור!</p><button class="btn-purple" onclick="closeModal();newCard()">לשלוף</button>`)}
  else{say('כל הכבוד! 🎉');renderSide();setTimeout(()=>nextTurn(),900)}
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function nextTurn(){if(S.over)return;S.cur=(S.cur+1)%S.players.length;newTurn()}
function newTurn(first){S.card=null;renderSide();if(!first)say('')}
function finish(){
  const p=P();p.pts+=5;S.over=true;renderSide();
  const r=S.players.slice().sort((a,b)=>b.pts-a.pts);
  modal(`<div class="big">🏆</div><h1>המשחק נגמר!</h1><p>${esc(p.name)} הגיע/ה ראשון/ה לסיום (+5)</p>
  ${r.map((q,i)=>`<div style="display:flex;justify-content:space-between;font-size:20px;padding:6px 10px;border-radius:10px;background:${i?'#f6f3ff':'#fff3c4'};margin:4px 0"><span>${i+1}. <span class="dot" style="background:${q.color};width:14px;height:14px"></span> ${esc(q.name)}</span><b>${q.pts} נק׳</b></div>`).join('')}
  <button class="btn-purple" style="width:100%;margin-top:12px" onclick="setup()">משחק חדש</button>`);
}
function openRules(){modal(`<h1>חוקי המשחק</h1><div style="text-align:right;line-height:1.7;font-size:16px">
<b>1.</b> שולפים קלף טקסט וקוראים בקול (אפשר להשאיר את אותו טקסט לכמה תורות).<br>
<b>2.</b> שולפים קלף סגול – שאלה לפי חמשת הממ״ים או משימה – ועונים. מותר לחזור לטקסט.<br>
<b>3.</b> המנחה מחליט/ה: ✓ הצליח או ✗ לא הפעם.<br>
שאלה = 2 צעדים + נקודה · משימה = 3 צעדים + 2 נקודות.<br>
⭐ כוכב: +2 · 👟 צעדים: 5 קפיצות = +1 · ❓ שאלה: עוד קלף סגול.<br>
<b>סיום:</b> הראשון שמגיע מקבל +5. מנצח מי שצבר הכי הרבה נקודות.</div>
<button class="btn-purple" style="margin-top:12px" onclick="closeModal()">הבנתי</button>`)}
setup();
</script>
<a href="../../" aria-label="חזרה לעולם המשחקים" style="position:fixed;bottom:16px;left:16px;z-index:9999;width:52px;height:52px;border-radius:50%;background:#ffc93c;color:#1b2a5e;display:grid;place-items:center;font-size:26px;text-decoration:none;box-shadow:0 4px 0 #d89c12,0 6px 14px #0003">🏠</a>
</body></html>
