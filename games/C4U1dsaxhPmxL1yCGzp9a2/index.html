<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מסע הרגשות תלת־ממד</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, playful, calm — a children's board-game journey, never clinical
   IDEA: a sea voyage between five islands; every worksheet is a stepping stone
   PICTURE: winding dotted route over the sea, round island stones, a friendly blob avatar
   COLOUR and TYPE: deep sea blue ground, sand cards, coral accent; island colours; Fredoka throughout
   LAYOUT: one column; map is the home, each level a sand card on the sea; stacks on phones */
:root{color-scheme:light dark;
--sea:light-dark(#1f6f8b,#0d2b33);--sea2:light-dark(#38a3a5,#16484f);
--card:light-dark(#fff7e6,#1b2c44);--ink:light-dark(#22303f,#f3ead8);--soft:light-dark(#6b7280,#a9b4c4);
--line:light-dark(#ecdcbc,#2e4566);--coral:#ff6b57;--sun:#ffc93c;--field:light-dark(#ffffff,#13223a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(circle at 88% 0%,light-dark(rgba(255,170,130,.55),rgba(255,140,110,.16)),transparent 42%),radial-gradient(circle at 12% 18%,var(--sea2),transparent 60%),linear-gradient(180deg,var(--sea2),var(--sea) 60%);color:var(--ink);font:17px/1.55 Fredoka,"Varela Round",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:16px max(4vw,14px) 60px}
.top{display:flex;align-items:center;gap:12px;color:#fff;padding:6px 0 14px;flex-wrap:wrap}
.top h1{font-size:clamp(26px,5vw,38px);line-height:1.05;margin:0;font-weight:700;flex:1}
.stars{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);padding:6px 14px;border-radius:99px;font-weight:600}
.card{background:var(--card);border-radius:28px;padding:clamp(18px,4vw,34px);box-shadow:0 10px 0 rgba(0,0,0,.12)}
.btn{border:0;border-radius:99px;padding:12px 22px;min-height:48px;font-weight:600;background:var(--coral);color:#fff;box-shadow:0 4px 0 #c94a39;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c94a39}
.btn.sec{background:var(--field);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.sm{min-height:44px;padding:8px 16px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
h2{font-size:clamp(26px,4.5vw,36px);line-height:1.1;margin:0 0 6px;text-wrap:balance}
.island{display:inline-block;font-size:14px;font-weight:600;padding:3px 12px;border-radius:99px;color:#22303f;margin-bottom:8px}
.lead{color:var(--soft);margin:0 0 18px;max-width:60ch}
label.f{display:block;font-weight:500;margin:14px 0 6px}
input[type=text],textarea,select{width:100%;font-size:17px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--field)}
textarea{min-height:84px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 4px}
.chip{border:2px solid var(--line);background:var(--field);border-radius:99px;padding:9px 16px;min-height:44px;font-size:16px;transition:transform .15s}
.chip.on{background:var(--sun);border-color:#e0a800;color:#22303f;transform:scale(1.06) rotate(-1deg)}
.grp{font-weight:600;margin:18px 0 2px}
.addrow{display:flex;gap:8px;margin-top:12px}.addrow input{flex:1}
.lvlfoot{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.speak{display:inline-flex;align-items:center;gap:6px}
.speak svg{width:22px;height:22px}
/* map */
.map{position:relative;height:1440px;margin-top:8px}
.map svg.route{position:absolute;inset:0;width:100%;height:100%}
.stone{position:absolute;transform:translate(50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:130px;background:none;border:0;padding:0;color:#fff}
.stone .disc{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:700;color:#22303f;box-shadow:0 7px 0 rgba(0,0,0,.25),inset 0 -6px 0 rgba(0,0,0,.12);border:4px solid #fff;position:relative;transition:transform .15s}
.stone:hover .disc{transform:scale(1.08)}
.stone .t{font-size:15px;font-weight:600;text-align:center;line-height:1.2;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.stone .badge{position:absolute;top:-12px;left:-10px;width:38px;height:38px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;color:#fff;font-size:14px;font-weight:500;margin-top:14px}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:14px;height:14px;border-radius:50%;border:2px solid #fff}
.isl-label{position:absolute;color:#fff;opacity:.85;font-weight:600;font-size:14px;letter-spacing:0;background:rgba(0,0,0,.18);padding:4px 12px;border-radius:99px;transform:translate(50%,-50%);white-space:nowrap}
/* faces */
.faces{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.face{border:3px solid transparent;background:var(--field);border-radius:22px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px}
.face svg{width:64px;height:64px}
.face.on{border-color:var(--coral);transform:scale(1.05)}
input[type=range]{width:100%;accent-color:var(--coral);height:40px}
.meter{display:flex;justify-content:space-between;color:var(--soft);font-size:14px}
.big{font-size:42px;font-weight:700;color:var(--coral);text-align:center;line-height:1}
/* candies */
.candies{display:flex;flex-direction:column;align-items:center;gap:14px;margin:10px 0}
.candy{position:relative;width:min(340px,100%);height:72px}
.candy .b{position:absolute;inset:0 36px;border-radius:36px;background:var(--c);display:flex;align-items:center;padding:0 16px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
.candy::before,.candy::after{content:"";position:absolute;top:8px;width:42px;height:56px;background:var(--c);filter:brightness(.9)}
.candy::before{right:0;clip-path:polygon(100% 0,0 50%,100% 100%)}
.candy::after{left:0;clip-path:polygon(0 0,100% 50%,0 100%)}
.candy input{background:transparent!important;border:0!important;text-align:center;color:#22303f;font-weight:600;padding:8px}
.candy input::placeholder{color:rgba(34,48,63,.55)}
/* anchors */
.anchors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:460px;margin:10px auto}
.buoy{aspect-ratio:1;border-radius:50%;border:5px solid #ff8a7a;background:var(--field);display:grid;place-items:center;padding:10px;box-shadow:inset 0 0 0 6px #fff,0 4px 0 rgba(0,0,0,.1)}
.buoy input{border:0!important;background:transparent!important;text-align:center;padding:4px;font-size:15px}
.me{aspect-ratio:1;display:grid;place-items:center}
.me svg{width:90%;height:90%}
/* reframe */
.ref{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);gap:8px;align-items:center;margin:10px 0}
.ref .a{color:var(--coral);font-size:28px;text-align:center}
.ref.ok .good{border-color:#4fc3a1;background:light-dark(#e8fbf3,#123a33)}
.ex{opacity:.8;font-size:15px}
.ref input.bad{border-color:#ffb3a8}
@media(max-width:560px){.ref{grid-template-columns:1fr}.ref .a{transform:rotate(-90deg);font-size:22px}}
/* jar */
.jarbox{position:relative;width:260px;height:300px;margin:10px auto}
.jarbox svg{position:absolute;inset:0;width:100%;height:100%}
.notes{position:absolute;inset:92px 38px 26px;display:flex;flex-wrap:wrap-reverse;align-content:flex-start;justify-content:center;gap:5px;overflow:hidden}
.note{background:var(--n);color:#22303f;font-size:13px;padding:4px 8px;border-radius:8px;max-width:100%;overflow-wrap:anywhere;display:flex;gap:4px;align-items:center;animation:drop .7s cubic-bezier(.3,1.4,.6,1)}
.note button{border:0;background:none;font-size:14px;padding:0 2px;color:#22303f;min-height:0}
@keyframes drop{from{transform:translateY(-220px) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
/* balloons */
.sky{min-height:280px;border-radius:22px;background:linear-gradient(light-dark(#bfe7ff,#123a5c),light-dark(#eaf7ff,#1b2c44));display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:flex-end;padding:20px 12px;overflow:hidden;position:relative}
.bal{border:0;background:none;display:flex;flex-direction:column;align-items:center;width:120px;padding:0;color:var(--ink)}
.bal .o{width:110px;height:130px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;background:var(--c);display:grid;place-items:center;padding:14px;color:#22303f;font-size:14px;font-weight:600;overflow-wrap:anywhere;box-shadow:inset -10px -12px 0 rgba(0,0,0,.1),inset 10px 10px 0 rgba(255,255,255,.35);line-height:1.2}
.bal .s{width:2px;height:60px;background:var(--soft)}
.bal.fly{animation:fly 2.2s ease-in forwards}
@keyframes fly{to{transform:translateY(-520px) rotate(12deg);opacity:0}}
.sky2{position:relative;border-radius:24px;overflow:hidden;background:linear-gradient(light-dark(#7cc8f5,#0f2d4d),light-dark(#e6f6ff,#2a4e78));padding:18px 10px 0;min-height:470px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;margin-top:12px}
.cloud{position:absolute;left:-140px;height:28px;border-radius:99px;background:#fff;opacity:.7;animation:drift linear infinite}
.cloud::before{content:"";position:absolute;width:46%;height:180%;bottom:30%;left:18%;border-radius:50%;background:inherit}
.c1{top:40px;width:110px;animation-duration:38s}.c2{top:190px;width:80px;animation-duration:52s;animation-delay:-20s}.c3{top:310px;width:130px;animation-duration:45s;animation-delay:-34s}
@keyframes drift{to{transform:translateX(calc(100vw + 300px))}}
.bubbles{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:12px 10px}
.bub{position:relative;margin-top:var(--y);border:2px solid rgba(255,255,255,.9);border-radius:999px;padding:10px 16px;min-height:46px;font-size:15px;font-weight:600;color:#22303f;background:radial-gradient(circle at 28% 25%,rgba(255,255,255,.95) 0 10%,transparent 32%),hsl(calc(var(--h)*1deg) 85% 84%);box-shadow:0 6px 14px rgba(20,60,100,.18),inset 0 -6px 10px rgba(0,0,0,.06);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;animation:bob 3.2s ease-in-out var(--d) infinite}
.bub.drag{animation:none;z-index:6;cursor:grabbing;box-shadow:0 14px 26px rgba(20,60,100,.3)}
@keyframes bob{50%{transform:translateY(-9px)}}
.hab{position:relative;z-index:1;width:170px;margin:0 auto;transition:transform .2s}
.hab svg{width:100%;display:block;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(1.5deg)}}
.hab.over{transform:scale(1.1)}.hab.gulp svg{animation:gulp .35s ease-out}
@keyframes gulp{40%{transform:scale(1.08,.94)}}
.hab .flame{opacity:0;transform-origin:80px 196px}
.hab.go{animation:up 3s cubic-bezier(.45,0,.6,.35) forwards}.hab.go .flame{opacity:1;animation:flick .12s infinite alternate}
@keyframes up{15%{transform:translateY(8px)}100%{transform:translateY(-720px) rotate(-5deg)}}
@keyframes flick{to{transform:scale(1.25,1.4)}}
.hab.back{animation:back 1.1s cubic-bezier(.3,1.3,.6,1)}@keyframes back{from{transform:translateY(320px);opacity:0}}
.load{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);width:230px;display:flex;flex-wrap:wrap-reverse;justify-content:center;gap:3px;pointer-events:none}
.load span{font-size:11px;font-weight:600;color:#22303f;padding:3px 8px;border-radius:99px;border:1.5px solid #fff;background:hsl(calc(var(--h)*1deg) 85% 84%);box-shadow:0 2px 4px rgba(0,0,0,.15);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:pop .45s cubic-bezier(.3,1.6,.6,1)}
.launching .bubbles{opacity:.25;transition:opacity .6s}
.cnt{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);background:#fff;color:#22303f;font-weight:700;font-size:14px;min-width:28px;height:28px;border-radius:99px;display:grid;place-items:center;border:2px solid #8a5a2b}
.bye{position:absolute;inset:0;z-index:8;display:grid;place-items:center;font-size:clamp(30px,7vw,44px);font-weight:700;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.35);animation:pop .7s cubic-bezier(.3,1.6,.6,1);pointer-events:none}
.basket{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:12px}
.flyer{position:fixed;z-index:20;pointer-events:none}
.flyer.paper{background:#fff;color:#22303f;font-size:14px;font-weight:600;padding:8px 12px;border-radius:6px;box-shadow:0 6px 14px rgba(0,0,0,.25);max-width:220px}
.flyer.candy{width:230px;height:62px}.flyer.candy .b{inset:0 32px;justify-content:center;font-weight:600;font-size:15px;color:#22303f;white-space:nowrap;overflow:hidden}
.candy.wrap::before,.candy.wrap::after{animation:twist .6s cubic-bezier(.3,1.6,.6,1)}
@keyframes twist{from{transform:scale(0) rotate(90deg)}}
.cave{position:relative;border-radius:24px;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,light-dark(#ffe9b0,#5a4520) 0 30%,transparent 60%),linear-gradient(light-dark(#2a9bc4,#0f2d4d),light-dark(#7fd0e6,#1d4a5c));padding:18px 10px 6px;min-height:440px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;margin-top:12px}
.bub.gem{background:radial-gradient(circle at 30% 25%,#fffbe0 0 12%,transparent 35%),linear-gradient(#ffe16b,#ffbf1f);border-color:#e0a800;color:#5a3b00;box-shadow:0 5px 0 #c98a00,0 8px 14px rgba(0,0,0,.2)}
.hab.chest{width:190px}.hab.chest svg{animation:none}
.shop{position:relative;border-radius:24px;background:repeating-linear-gradient(90deg,light-dark(#ffe1ec,#3b2333) 0 28px,light-dark(#fff5f8,#2a1c27) 28px 56px);padding:22px 10px;margin-top:12px;display:grid;place-items:center}
.bowl{position:relative;width:min(300px,100%);transition:transform .2s}
.bowl svg{width:100%;display:block}
.incandy{position:absolute;inset:22% 10% 14%;display:flex;flex-wrap:wrap-reverse;justify-content:center;align-content:flex-start;gap:4px;overflow:hidden}
.mc{position:relative;background:var(--c);color:#22303f;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;max-width:118px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 7px;overflow:visible}
.mc::before,.mc::after{content:"";position:absolute;top:2px;width:9px;height:14px;background:var(--c);filter:brightness(.88)}
.mc::before{right:-8px;clip-path:polygon(100% 0,0 50%,100% 100%)}.mc::after{left:-8px;clip-path:polygon(0 0,100% 50%,0 100%)}
.mc.pop,.note.pop{animation:pop .5s cubic-bezier(.3,1.6,.6,1)}
.bowl.gulp{animation:gulp .35s ease-out}
.sea{position:relative;border-radius:24px;overflow:hidden;margin-top:12px;background:linear-gradient(light-dark(#bfe7ff,#16365a) 0 120px,light-dark(#2a9bc4,#0c3b5e) 120px,light-dark(#1d6fa8,#08243d));min-height:360px;padding-top:30px}
.sea::before{content:"";position:absolute;left:-20px;right:-20px;top:112px;height:22px;background:radial-gradient(circle at 15px -4px,transparent 14px,light-dark(#2a9bc4,#0c3b5e) 15px) 0 0/30px 22px repeat-x;animation:wave 3s linear infinite}
@keyframes wave{to{transform:translateX(30px)}}
.boat{position:relative;z-index:2;width:220px;margin:0 auto;height:124px}
.boat svg{width:100%;transform-origin:50% 80%;animation:rock var(--sp) ease-in-out infinite alternate}
@keyframes rock{from{transform:rotate(calc(var(--rock)*-1)) translateY(-3px)}to{transform:rotate(var(--rock)) translateY(3px)}}
.water{position:relative;padding:8px 10px 18px}
.chains{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px}
.chain{display:flex;flex-direction:column;align-items:center;width:84px;color:#fff;font-size:14px;font-weight:600;text-align:center}
.chain .rope{width:0;height:34px;border-inline-start:3px dashed rgba(255,255,255,.7)}
.chain .anc{width:36px;height:46px}
.chain .anm{line-height:1.2;overflow-wrap:anywhere;margin-top:2px}
.chain button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:99px;width:30px;height:30px;margin-top:4px;font-size:16px}
.chain.drop{animation:dropa 1s cubic-bezier(.3,1.3,.6,1)}@keyframes dropa{from{transform:translateY(-140px);opacity:0}}
.lab{position:relative;border-radius:24px;padding:18px 12px;background:radial-gradient(circle at 50% 30%,light-dark(#f3efff,#2b2550),light-dark(#d9d0ff,#1a1638));display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:12px}
.machine{width:220px}.machine svg{width:100%;display:block;overflow:visible}
.machine .g1,.machine .g2{transform-box:fill-box;transform-origin:center}
.machine .lt{opacity:.55}.machine .spark{opacity:0;transform-box:fill-box;transform-origin:center}
.machine.run{animation:shake .12s infinite}
.machine.run .g1{animation:spin .7s linear infinite}.machine.run .g2{animation:spin .5s linear infinite reverse}
.machine.run .lt{animation:blink .3s infinite alternate}.machine.run .spark{animation:twinkle .5s infinite alternate}
@keyframes shake{25%{transform:translate(-2px,1px) rotate(-1deg)}75%{transform:translate(2px,-1px) rotate(1deg)}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{to{opacity:1}}@keyframes twinkle{to{opacity:1;transform:scale(1.2)}}
.outcard{width:100%;max-width:480px;background:var(--field);border:3px solid #ffd84a;border-radius:20px;padding:14px;animation:pop .6s cubic-bezier(.3,1.6,.6,1);box-shadow:0 0 0 6px rgba(255,216,74,.25)}
.outcard .ob{text-decoration:line-through;color:var(--soft);margin-bottom:6px}
.outcard .ol{font-weight:600;margin-bottom:4px}
.pairs{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.pair{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:light-dark(#fff8d6,#2e2a17);border:2px solid #ffd84a;border-radius:18px;padding:10px 14px}
.pair s{color:var(--soft)}.pair b{flex:1;min-width:140px}.pair .arr{color:var(--coral);font-size:22px}
.pair button{border:0;background:none;font-size:20px;color:var(--soft);width:36px;height:36px}
.pair.new{animation:pop .6s cubic-bezier(.3,1.6,.6,1)}
.lid{position:absolute;z-index:3;left:70px;top:20px;width:120px;height:34px;border-radius:10px;background:#ff8a7a;border:3px solid #c94a39;transform-origin:10% 100%;transition:transform .35s}
.lid.open{transform:translate(-40px,-26px) rotate(-35deg)}
.lid.shut{animation:shut .7s cubic-bezier(.3,1.6,.6,1)}
@keyframes shut{from{transform:translate(-40px,-26px) rotate(-35deg)}}
.note.fold{clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.btn:disabled{opacity:.45;cursor:default}
.passport{background:linear-gradient(light-dark(#1f4e7a,#163a5c),light-dark(#2a6aa3,#1d4a73));border-radius:22px;padding:16px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.pp-head{display:flex;align-items:center;gap:12px;border-bottom:2px dashed rgba(255,255,255,.35);padding-bottom:12px;margin-bottom:12px}
.pp-av{width:58px;height:58px;background:#fff7e6;border-radius:16px;padding:3px;flex:none}.pp-av svg{width:100%;height:100%}
.pp-t{font-size:13px;opacity:.8}.pp-n{font-size:24px;font-weight:700;line-height:1.1}.pp-c{margin-inline-start:auto;font-size:14px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:99px}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.st{border:3px dashed rgba(255,255,255,.35);border-radius:16px;min-height:78px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
.st .sq{font-size:12px;opacity:.85}.st .sa{font-size:15px;font-weight:600;overflow-wrap:anywhere;line-height:1.15}
.st.on{border:3px solid var(--c);background:color-mix(in srgb,var(--c) 30%,transparent);transform:rotate(var(--r))}
.st.new{animation:stamp .55s cubic-bezier(.3,1.6,.6,1)}
@keyframes stamp{from{transform:scale(2.4) rotate(calc(var(--r) + 20deg));opacity:0}}
.qcard{margin-top:16px;border:3px solid var(--line);border-radius:22px;padding:16px;background:var(--field)}
.qq{font-size:20px;font-weight:600;margin-top:4px}

 const l=LV.find(x=>x.id===id),isl=l?ISL[l.i]:null,islDone=!!(first&&l&&LV.filter(x=>x.i===l.i).every(x=>kid.done[x.id]));
 const nx=LV.find(x=>!kid.done[x.id]),o=document.createElement("div");o.className="ov";
 o.innerHTML=`<div class="card win"><div class="burst">${star()}</div><h2>כל הכבוד, ${esc(kid.name)}!</h2>
 <div class="rewards">${first?`<span class="rw">${star()}+1 כוכב</span><span class="rw">${COIN}+100 מטבעות</span>`:`<span class="rw">${star()}${n} / ${LV.length} כוכבים</span>`}</div>
 ${up?`<p class="banner">עלית דרגה! עכשיו ${G("אתה","את")} <b>${esc(r.name)}</b></p>`:""}
 ${islDone?`<p class="banner tro-b">${trophy(isl[1])}<span>קיבלת את הגביע של <b>${esc(isl[0])}</b>!</span></p>`:""}
 ${all?`<p class="banner">השלמת את כל ${LV.length} השלבים במסע!</p>`:""}
 <div class="row" style="justify-content:center">${nx?`<button class="btn" id="nextLv">לשלב הבא</button>`:""}<button class="btn sec" id="ok">חזרה למפה</button></div></div>`;
 document.body.append(o);confetti(up||islDone||all?260:150);snd("win");if(up||islDone)setTimeout(()=>snd("up"),750);
 say(`כל הכבוד ${kid.name}!`+(up?` עלית לדרגת ${r.name}!`:"")+(islDone?` קיבלת את הגביע של ${isl[0]}!`:""));
 const go=v=>{o.remove();view=v;render();scrollTo(0,0)};
 o.querySelector("#ok").onclick=()=>go("map");const nb=o.querySelector("#nextLv");if(nb){nb.onclick=()=>go("lv:"+nx.id);nb.focus()}else o.querySelector("#ok").focus()};
const _rMap=renderMap,_rLv=renderLevel,_rNew=renderNew,_touch=touch,_render=render;
renderMap=function(){_rMap();enhanceMap()};
renderLevel=function(id){_rLv(id);enhanceLevel(id)};
renderNew=function(){_rNew();enhanceNew()};
touch=function(now){_touch(now);updateHud()};
render=function(){app.className="wrap v-"+String(view).split(":")[0];_render()};

boot();
}
</script>
