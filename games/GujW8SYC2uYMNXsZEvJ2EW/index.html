<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: מסע במערה – פס שלבים דביק, תחנה אחת בכל פעם; תחנות רענון מקבלות רקע חולי וכוכב */
:root{
  --paper:#edf1f0; --card:#f8faf9; --ink:#17282b; --muted:#566a6d; --line:#c3d0cf;
  --sea:#1f6f78; --accent:#c4572a; --sand:#f3e6c8; --tamar:#d99a1e; --ido:#2f6fb5;
  --blue:#2f6fb5; --green:#2f7a4f; --orange:#b8641c; --purple:#6b4a9a; --red:#b0303a;
  --display:"Secular One","Assistant",system-ui,sans-serif; --body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11191b; --card:#1a2427; --ink:#e4ecea; --muted:#9fb1b2; --line:#30403f;
  --sea:#5fbcc6; --accent:#f08a5d; --sand:#3a3222; --tamar:#f2c25a; --ido:#7fb0ea;
  --blue:#7fb0ea; --green:#7cc79a; --orange:#e7a462; --purple:#b597e0; --red:#f0808a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11191b; --card:#1a2427; --ink:#e4ecea; --muted:#9fb1b2; --line:#30403f;
  --sea:#5fbcc6; --accent:#f08a5d; --sand:#3a3222; --tamar:#f2c25a; --ido:#7fb0ea;
  --blue:#7fb0ea; --green:#7cc79a; --orange:#e7a462; --purple:#b597e0; --red:#f0808a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6;direction:rtl;text-align:right}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;padding-block:10px}
h1{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0;line-height:1.2}
.sub{color:var(--muted);font-size:.9rem}
.clock{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.clock b{font-size:1.25rem}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px}
button:hover{border-color:var(--sea)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.word:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
button.primary{background:var(--sea);color:var(--paper);border-color:var(--sea);font-weight:700}
.trail{display:flex;gap:4px;overflow-x:auto;padding-block:0 10px}
.trail button{flex:1 0 auto;border-radius:20px;font-size:.85rem;padding:4px 12px;white-space:nowrap}
.trail button.rf{background:var(--sand)}
.trail button[aria-current="step"]{background:var(--sea);color:var(--paper);border-color:var(--sea)}
.trail button.done{border-style:dashed;color:var(--muted)}
main{padding-top:20px}
main.refresh{background:var(--sand);border-radius:0 0 16px 16px}
.stage-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;margin-bottom:12px}
h2{font-family:var(--display);font-weight:400;font-size:1.9rem;margin:0;text-wrap:balance}
h3{margin:0;font-size:1.15rem}
.mins{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.kind{font-size:.85rem;border:1px solid var(--line);border-radius:12px;padding:1px 10px;color:var(--muted)}
.goal{color:var(--muted);margin:0 0 16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.tip{border-right:4px solid var(--accent);padding:6px 12px;background:var(--card);border-radius:4px;font-size:.95rem}
.tip b{color:var(--accent)}
label{font-weight:600;display:block;margin-bottom:4px}
input[type=text],textarea,select{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-align:right}
textarea{min-height:60px;resize:vertical}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.reveal{font-size:.92rem;color:var(--muted);margin-top:6px}
.link{background:none;border:none;color:var(--sea);text-decoration:underline;padding:0;font-size:.9rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid2>*{min-width:0}
.teacher{font-size:.9rem;color:var(--muted)}
.chans{display:flex;flex-wrap:wrap;gap:8px}
.chan{border:1px solid var(--line);border-radius:20px;padding:4px 14px;background:var(--card);font-weight:600}
/* story */
.modes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.modes .mt[aria-pressed="true"]{background:var(--tamar);border-color:var(--tamar);color:#1b1404;font-weight:700}
.modes .mi[aria-pressed="true"]{background:var(--ido);border-color:var(--ido);color:var(--paper);font-weight:700}
.para{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.para .n{font-family:var(--display);color:var(--sea);min-width:2ch}
.para .who{font-size:.8rem;color:var(--muted);display:block}
.para p{margin:0;min-width:0}
.word{cursor:pointer;border-radius:3px}
.word.t{background:color-mix(in srgb,var(--tamar) 38%,transparent)}
.word.i{background:color-mix(in srgb,var(--ido) 30%,transparent)}
.stop{margin:10px 0;padding:12px;border:2px solid var(--accent);border-radius:10px;background:var(--paper)}

.waves{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.orb{width:160px;height:160px;border-radius:50%;background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--sea) 55%,var(--card)),var(--sea));transform:scale(.55);transition:transform 4s ease-in-out}
.orb.in{transform:scale(1)}
.wavecount{font-family:var(--display);font-size:1.4rem}
@media (prefers-reduced-motion:reduce){.orb{transition:none}}
/* statues */
.statue{background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.statue .who2{font-weight:700}
.statue.t .who2{color:var(--tamar)} .statue.i .who2{color:var(--ido)}
/* figures */
.figs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.figs{grid-template-columns:1fr}}
.fig{border:2px solid var(--c);border-radius:14px;padding:12px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.fig h3{color:var(--c)}
.fig svg{display:block}
.notes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.note{background:color-mix(in srgb,var(--c) 22%,var(--card));border:1px solid var(--c);border-radius:4px;padding:6px 10px;max-width:100%;font-size:.95rem;box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 15%,transparent)}
.note b{display:block}
.note small{color:var(--muted)}
.note button{font-size:.75rem;padding:0 6px;margin-top:4px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.bank button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.adder{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;align-items:end}
@media (max-width:620px){.adder{grid-template-columns:1fr}}
.adder>*{min-width:0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:right;vertical-align:top}
th{background:var(--paper)}
/* change path */
.tape{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-top:28px}
.tape::before{content:"";position:absolute;top:12px;right:4%;left:4%;height:6px;background:repeating-linear-gradient(90deg,var(--accent) 0 14px,transparent 14px 22px);border-radius:3px}
.pt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative}
.pt .dot{position:absolute;top:-24px;width:22px;height:22px;border-radius:50%;background:var(--card);border:3px solid var(--accent)}
.pt.on .dot{background:var(--accent)}
.pt button{font-size:.9rem}
@media (max-width:620px){.tape{grid-template-columns:1fr 1fr}.tape::before{display:none}.pt .dot{position:static}}
/* detective & cards */
.formula{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:end}
.formula .op{font-family:var(--display);font-size:1.6rem;color:var(--accent);padding-bottom:4px}
@media (max-width:640px){.formula{grid-template-columns:1fr}.formula .op{text-align:center;padding:0}}
.decks{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.deck{border-width:2px;padding:12px 10px;font-weight:700;border-radius:12px}
.flip{min-height:150px;border-radius:14px;border:3px solid var(--c,var(--line));background:var(--card);padding:18px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.flip .cat{font-weight:700;color:var(--c)}
.flip .q{font-size:1.2rem;font-weight:600}
.flip .a{color:var(--muted)}
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sd{width:22px;height:22px;border-radius:50%;border:2px solid var(--sea)}
.sd.on{background:var(--sea)}
.exit{width:26px;height:22px;border-radius:13px 13px 0 0;background:var(--accent)}
/* post */
.phone{max-width:360px;border:2px solid var(--line);border-radius:22px;padding:14px;background:var(--paper);display:flex;flex-direction:column;gap:8px}
.phone .grp{font-weight:700;text-align:center;border-bottom:1px solid var(--line);padding-bottom:6px}
.bubble{align-self:flex-start;background:color-mix(in srgb,var(--tamar) 30%,var(--card));border-radius:14px 14px 14px 4px;padding:8px 12px;max-width:90%;white-space:pre-wrap;min-height:40px}
.bubble small{display:block;font-weight:700;color:var(--orange)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button[aria-pressed="true"],.rate button[aria-pressed="true"]{background:var(--sea);color:var(--paper);border-color:var(--sea)}
.rate{display:flex;gap:8px}
.rate button{width:48px;height:48px;font-size:1.2rem;font-weight:700;border-radius:50%}
</style>

<script>
(function(){
const P='eyalcave-';

const story=[
 'תמר תמיד הייתה הראשונה. ראשונה לקפוץ למים, ראשונה לטפס על הסלע הגבוה, ראשונה להרים יד בכיתה – גם כשלא הייתה בטוחה בתשובה. "מי שמחכה, מפסיד," נהגה לומר לאחיה הקטן, עידו, שתמיד קרא את ההוראות פעמיים.',
 'בחופשת סוכות שכרה המשפחה צימר ליד חוף סלעי בצפון. כבר בבוקר הראשון גילתה תמר, מעבר לסלעים, פתח של מערה. המים הגיעו רק עד הקרסוליים, ובפנים נצצו קירות לחים בצבע ירוק כהה. "אנחנו נכנסים," הודיעה. זו לא הייתה שאלה.',
 'עידו הוציא מהכיס את הדף שקיבלו בכניסה לחוף. "כתוב פה שהגאות מתחילה בשתיים," אמר בשקט. תמר הציצה בשעון: אחת ועשרים. "יש לנו המון זמן. בוא כבר, פחדן." עידו התכווץ קצת, אבל הלך אחריה.',
 'המערה הייתה עמוקה יותר ממה שנראה מבחוץ. אור הפנס של הטלפון גילה מעבר צר, ומעבר לו אולם קטן שתקרתו מלאה צדפים מאובנים. תמר צילמה הכול ודמיינה את התגובות בקבוצת הכיתה. עידו, לעומת זאת, הביט ברצפה. "תמר, המים עלו. הם כבר בשוקיים."',
 '"אלה רק גלים, זה עולה ויורד," ענתה בלי להסתובב. היא רצתה להגיע לסוף האולם, שם נראה סדק שדרכו חדר אור. אבל כשחזרה אל המעבר הצר, המים כבר הגיעו לברכיים, והזרם משך בחוזקה פנימה.',
 'בפעם הראשונה תמר לא ידעה מה לעשות. ליבה הלם, והמחשבות רצו: אמא תכעס, זה בגללי, אני הבאתי אותו לפה. היא ניסתה לעבור בכוח, מעדה וכמעט נפלה. עידו תפס בחולצתה.',
 '"חכי," אמר עידו. קולו רעד, אבל הוא דיבר לאט. "ראיתי שהמים נכנסים בגלים. בין גל לגל יש כמה שניות שהם יורדים. נספור, ונעבור כשהם יורדים." תמר הביטה בו כאילו ראתה אותו בפעם הראשונה.',
 'הם עמדו צמודים לקיר וספרו. גל, ירידה, אחת, שתיים, שלוש. בגל הרביעי לחש עידו "עכשיו", והם עברו את המעבר הצר כשידיהם אחוזות. בחוץ סינוורה אותם השמש, והמים כבר כיסו את הסלעים שעליהם הלכו קודם.',
 'הם חזרו בדרך עוקפת, על הצוקים. הידיים של תמר היו שרוטות, והטלפון שלה, עם כל התמונות, נפל למים ונעלם. מוזר, אבל זה כמעט לא הפריע לה.',
 'בערב, ליד המדורה, אבא שאל איך היה היום. תמר הסתכלה על עידו. בדרך כלל היא זו שמספרת את הסיפורים, והיא גם הגיבורה שלהם. הפעם אמרה: "עידו הציל אותנו. הוא שם לב לדברים שאני רצה לידם."',
 'עידו הסמיק והסתכל באש. מאוחר יותר, כשכולם נכנסו לישון, ישבה תמר עם הדף מהכניסה לחוף וקראה אותו מההתחלה ועד הסוף. פעמיים.'
];
const channels=['עושה','אומר','חושב'];

const answers={
 tamar:[['נמהרת','"ראשונה להרים יד – גם כשלא הייתה בטוחה" (1)','עושה'],['תחרותית','"מי שמחכה, מפסיד" (1)','אומרת'],['שתלטנית','"אנחנו נכנסים" (2)','אומרת'],['מזלזלת','"בוא כבר, פחדן" (3)','אומרת'],['מחפשת תשומת לב','צילמה ודמיינה את התגובות (4)','עושה, חושבת'],['אחראית','"זה בגללי, אני הבאתי אותו לפה" (6)','חושבת']],
 ido:[['זהיר','"תמיד קרא את ההוראות פעמיים" (1)','עושה'],['שקט','"אמר בשקט" (3)','אומר'],['שם לב לפרטים','"ראיתי שהמים נכנסים בגלים" (7)','אומר'],['אמיץ','"קולו רעד, אבל הוא דיבר לאט" (7)','עושה'],['צנוע','"הסמיק והסתכל באש" (11)','עושה']]
};

 {k:'פרט',c:'--blue',q:[['באיזו שעה מתחילה הגאות?','בשתיים (3)'],['מה עשתה תמר באולם?','צילמה הכול (4)']]},
