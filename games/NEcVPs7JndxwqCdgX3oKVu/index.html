*{box-sizing:border-box}
body{margin:0;font-family:NSH,system-ui,sans-serif;background:#f4f1fb;color:#222}
.wrap{display:flex;gap:16px;padding:14px;align-items:flex-start;max-width:1500px;margin:auto}
.boardbox{flex:1;min-width:0}
.boardbox svg{width:100%;height:auto;display:block}
.panel{width:430px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
@media(max-width:1000px){.wrap{flex-direction:column}.panel{width:100%}}
.box{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 2px 8px rgba(60,30,120,.08)}
.turn{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}
.dot{width:22px;height:22px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:8px}
.sc{border-radius:12px;padding:6px 8px;background:#f6f3ff;text-align:center;font-weight:700;border:3px solid transparent}
.sc.on{border-color:#7b4fc4;background:#efe6ff}
.sc b{display:block;font-size:24px}
.tcard{background:#eef7ff;border:2px solid #9cc7ef;border-radius:16px;overflow:hidden}
.tcard .band{background:#3b8fd9;color:#fff;padding:6px 12px;font-weight:700;display:flex;justify-content:space-between}
.tcard h2{margin:8px 12px 2px;text-align:center;color:#1d4f8a;font-size:24px}
.tcard .body{padding:4px 16px 12px;font-size:32px;line-height:1.9;font-weight:700;text-align:center}.tcard .body p{cursor:pointer;border-radius:12px;transition:background .2s}.tcard .body p.hl{background:#fff3b0}.modes{display:flex;gap:6px;padding:0 12px 10px;flex-wrap:wrap;justify-content:center}.modes button{font-size:14px;padding:6px 10px;background:#e3efff;color:#1d4f8a}.modes button.sel{background:#3b8fd9;color:#fff}
.tcard .body p{margin:0 0 2px}
.pcard{background:#f6f0ff;border:2px solid #c9b6ea;border-radius:16px;overflow:hidden;text-align:center;animation:pop .35s}
.pcard .band{color:#fff;padding:6px 10px 8px}
.pcard .band small{display:block;font-size:13px;opacity:.9}
.pcard .band b{font-size:28px}
.pcard .q{font-size:23px;font-weight:700;line-height:1.6;padding:16px 18px;color:#2b1d4a}
.pcard .rw{font-size:14px;color:#6b4fa0;font-weight:700;padding-bottom:10px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
button{font-family:inherit;font-size:19px;font-weight:700;border:0;border-radius:14px;padding:12px 16px;cursor:pointer}
.btn-blue{background:#3b8fd9;color:#fff}.btn-purple{background:#7b4fc4;color:#fff}
.btn-ok{background:#2e9e5b;color:#fff}.btn-no{background:#e6e1ef;color:#444}
.btn-light{background:#eef2f8;color:#2f4f7a;font-size:15px;padding:8px 12px}
.row{display:flex;gap:10px}.row>*{flex:1}
.placeholder{border:2px dashed #c9bfe0;border-radius:16px;padding:22px;text-align:center;color:#8a7fa8}
.msg{min-height:26px;font-weight:700;color:#4a2c8a;text-align:center}
.modal{position:fixed;inset:0;background:rgba(30,15,60,.45);display:flex;align-items:center;justify-content:center;z-index:9}
.modal .in{background:#fff;border-radius:22px;padding:24px 26px;max-width:460px;width:92%;text-align:center;animation:pop .3s}
.modal h1{margin:0 0 8px;color:#4a2c8a}
.modal input{font-family:inherit;font-size:18px;padding:9px 12px;border-radius:10px;border:2px solid #d8cfee;width:100%;margin:5px 0}
.nbtn.sel{background:#7b4fc4;color:#fff}
.hidden{display:none!important}
.big{font-size:60px;line-height:1}
#pawns g{transition:transform .28s ease}

const COLORS=['#e23b3b','#2f6fd6','#2e9e5b','#f2b705'];
const NAMES=['שחקן 1','שחקן 2','שחקן 3','שחקן 4'];
let S;
const $=id=>document.getElementById(id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(deck,src){if(!S[deck].length)S[deck]=shuffle([...Array(src.length).keys()]);return S[deck].pop()}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

function modal(html){$('modalIn').innerHTML=html;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}

function setup(){
  let n=2;
  const render=()=>{modal(`<h1>הַמַּסָּע שֶׁל נֹעַם בַּחָלָל 🚀</h1>
   <p>כמה שחקנים?</p><div class="row">${[2,3,4].map(k=>`<button class="btn-no nbtn ${k==n?'sel':''}" data-k="${k}">${k}</button>`).join('')}</div>
   <div style="margin-top:12px">${[...Array(n).keys()].map(i=>`<div style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${COLORS[i]}"></span><input id="nm${i}" value="${NAMES[i]}"></div>`).join('')}</div>
   <button class="btn-purple" style="width:100%;margin-top:14px" id="go">מתחילים!</button>`);
   document.querySelectorAll('.nbtn').forEach(b=>b.onclick=()=>{n=+b.dataset.k;render()});
   $('go').onclick=()=>start([...Array(n).keys()].map(i=>($('nm'+i).value.trim()||NAMES[i])));
  };
  render();
}
function start(names){
  S={players:names.map((nm,i)=>({name:nm,color:COLORS[i],pos:1,pts:0})),cur:0,tDeck:[],pDeck:[],text:null,card:null,busy:false,over:false,mode:1,readDone:false};
  closeModal();drawPawns();newTurn(true);
}
function P(){return S.players[S.cur]}

function drawPawns(){
  const g=$('pawns');g.innerHTML='';
  S.players.forEach((p,i)=>{
    const el=document.createElementNS('http://www.w3.org/2000/svg','g');el.id='pw'+i;
    el.innerHTML=`<ellipse cx="0" cy="26" rx="17" ry="6" fill="rgba(0,0,0,.2)"/><path d="M-15,24 Q-15,4 0,0 Q15,4 15,24 Z" fill="${p.color}" stroke="#fff" stroke-width="3"/><circle cx="0" cy="-8" r="12" fill="${p.color}" stroke="#fff" stroke-width="3"/>`;
    g.appendChild(el);placePawn(i);
  });
}
const OFF=[[-24,-22],[24,-22],[-24,20],[24,20]];
function placePawn(i){const p=S.players[i],[x,y]=D.pos[p.pos],[dx,dy]=OFF[i];$('pw'+i).style.transform=`translate(${x+dx}px,${y+dy-4}px)`}

function renderSide(){
  const p=P();$('tdot').style.background=p.color;$('tname').textContent='התור של '+p.name;
  $('scores').innerHTML=S.players.map((q,i)=>`<div class="sc ${i==S.cur?'on':''}"><span class="dot" style="background:${q.color};width:14px;height:14px"></span> ${esc(q.name)}<b>${q.pts}</b><small>משבצת ${q.pos}</small></div>`).join('');
  // text
  if(S.text==null){$('textArea').innerHTML=`<div class="placeholder"><button class="btn-blue" onclick="newText()">📖 שִׁלְפוּ קְלַף טֶקְסְט</button></div>`}
  else{const t=D.texts[S.text];$('textArea').innerHTML=`<div class="tcard"><div class="band"><span>קְלַף טֶקְסְט ${S.text+1}${t.g?' · '+t.g:''}</span><button class="btn-light" style="padding:2px 10px;font-size:13px" onclick="newText()">טקסט חדש</button></div><h2>${t.t}</h2><div class="body">${t.l.map((l,i)=>`<p onclick="hl(${i})" id="ln${i}">${esc(l)}</p>`).join('')}</div><div class="modes">${['אֲנִי קוֹרֵא לְבַד','שׁוּרָה אֲנִי, שׁוּרָה עֲדִי','עֲדִי קוֹרֵאת, אֲנִי חוֹזֵר'].map((m,i)=>`<button class="${S.mode==i?'sel':''}" onclick="S.mode=${i};renderSide()">${m}</button>`).join('')}</div>${S.readDone?'<div style="text-align:center;padding-bottom:10px;font-weight:800;color:#2e9e5b">⭐ קָרָאתָ! +1</div>':'<div style="text-align:center;padding-bottom:12px"><button class="btn-ok" onclick="readDone()">✓ קָרָאתִי!</button></div>'}</div>`}

  if(S.card==null){$('purpleArea').innerHTML=S.text==null?'':`<button class="btn-purple" style="width:100%" onclick="newCard()">❓ שִׁלְפוּ קְלָף סָגֹל</button>`}

    $('purpleArea').innerHTML=`<div class="pcard"><div class="band" style="background:${cat.col}"><small>${c.task?'מְשִׂימָה':'חֲמֵשֶׁת הַמֵּמִים'}</small><b>${cat.lab}</b></div><div class="q">${esc(c.x)}</div><div class="rw">הַצְלָחָה = ${c.task?'3 צְעָדִים · 2 נְקֻדּוֹת':'2 צְעָדִים · 1 נְקֻדָּה'}</div></div>

}
function newText(){if(S.busy)return;S.text=draw('tDeck',D.texts);S.readDone=false;renderSide()}
function hl(i){document.querySelectorAll('.tcard .body p').forEach(p=>p.classList.remove('hl'));$('ln'+i).classList.add('hl')}
function readDone(){P().pts++;S.readDone=true;renderSide();say('כָּל הַכָּבוֹד! ⭐')}
function newCard(){if(S.busy)return;S.card=draw('pDeck',D.purple);say('');renderSide()}
function say(t){$('msg').textContent=t}

async function result(ok){
  if(S.busy)return;const c=D.purple[S.card],p=P();
  if(!ok){say('לֹא נוֹרָא! בַּפַּעַם הַבָּאָה 💪');S.card=null;return setTimeout(()=>nextTurn(),900)}

  p.pts+=c.task?2:1;
  const steps=c.task?3:2;
  for(let k=0;k<steps&&p.pos<D.n;k++){p.pos++;placePawn(S.cur);await sleep(330)}
  S.busy=false;S.card=null;
  if(p.pos>=D.n)return finish();
  const sp=D.special[p.pos];
  if(sp==='star'){p.pts+=2;renderSide();modal(`<div class="big">⭐</div><h1>כּוֹכָב!</h1><p>${esc(p.name)} מקבל/ת 2 נקודות בונוס</p><button class="btn-purple" onclick="closeModal();nextTurn()">המשך</button>`)}
  else if(sp==='move'){renderSide();modal(`<div class="big">👟</div><h1>מְשִׂימַת תְּנוּעָה</h1><p style="font-size:22px">קִפְצוּ 5 קְפִיצוֹת בַּמָּקוֹם!</p><button class="btn-ok" onclick="P().pts++;closeModal();nextTurn()">עשיתי! (+1)</button>`)}
  else if(sp==='q'){renderSide();modal(`<div class="big">❓</div><h1>מִשְׁבֶּצֶת שְׁאֵלָה</h1><p>${esc(p.name)} שולף/ת עוד קלף סגול – באותו תור!</p><button class="btn-purple" onclick="closeModal();newCard()">לשלוף</button>`)}
  else if(sp==='rocket'){renderSide();modal(`<div class="big">🚀</div><h1>טִיל!</h1><p>${esc(p.name)} טָס 2 מִשְׁבָּצוֹת קָדִימָה!</p><button class="btn-purple" onclick="rocket()">לְהַמְרִיא!</button>`)}
  else{say('כָּל הַכָּבוֹד! 🎉');renderSide();setTimeout(()=>nextTurn(),900)}
}
async function rocket(){closeModal();const p=P();for(let k=0;k<2&&p.pos<D.n;k++){p.pos++;placePawn(S.cur);await sleep(330)}if(p.pos>=D.n)return finish();renderSide();nextTurn()}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function nextTurn(){if(S.over)return;S.cur=(S.cur+1)%S.players.length;newTurn()}
function newTurn(first){S.card=null;renderSide();if(!first)say('')}
function finish(){
  const p=P();p.pts+=5;S.over=true;renderSide();
  const r=S.players.slice().sort((a,b)=>b.pts-a.pts);
  modal(`<div class="big">🏆</div><h1>המשחק נגמר!</h1><p>${esc(p.name)} הגיע/ה ראשון/ה לסיום (+5)</p>
  ${r.map((q,i)=>`<div style="display:flex;justify-content:space-between;font-size:20px;padding:6px 10px;border-radius:10px;background:${i?'#f6f3ff':'#fff3c4'};margin:4px 0"><span>${i+1}. <span class="dot" style="background:${q.color};width:14px;height:14px"></span> ${esc(q.name)}</span><b>${q.pts} נק׳</b></div>`).join('')}
  <button class="btn-purple" style="width:100%;margin-top:12px" onclick="setup()">משחק חדש</button>`);
}
function openRules(){modal(`<h1>חוקי המשחק</h1><div style="text-align:right;line-height:1.7;font-size:16px">
<b>1.</b> שולפים קלף טקסט. התלמיד בוחר איך קוראים, ולוחצים על שורה כדי לסמן אותה. קריאה מלאה = נקודה.<br>
<b>2.</b> שולפים קלף סגול – שאלה לפי חמשת הממ״ים או משימה – ועונים. מותר לחזור לטקסט.<br>
<b>3.</b> המנחה מחליט/ה: ✓ הצליח או 🔄 בפעם הבאה.<br>
שאלה = 2 צעדים + נקודה · משימה = 3 צעדים + 2 נקודות.<br>
⭐ כוכב: +2 · 👟 צעדים: 5 קפיצות = +1 · ❓ שאלה: עוד קלף סגול · 🚀 טיל: 2 קדימה.<br>
<b>סיום:</b> הראשון שמגיע מקבל +5. מנצח מי שצבר הכי הרבה נקודות.</div>
<button class="btn-purple" style="margin-top:12px" onclick="closeModal()">הבנתי</button>`)}
setup();
</script>
