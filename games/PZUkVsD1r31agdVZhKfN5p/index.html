<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מסע המחוננים – כיתה ב׳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Varela+Round&display=swap" rel="stylesheet">
<style>
/* VOICE: playful, warm, encouraging – a game for 7–8 year olds, never an exam sheet
   IDEA: a sailing adventure – each test part is a colourful island with its own animal guide
   PICTURE: the island map, then big question cards: speech bubbles, number tiles, picture tiles
   COLOUR and TYPE: sky-to-sea blue, each island its own candy colour, coral accent; Fredoka titles, Varela Round text, 20px+
   LAYOUT: one column, 56px touch targets, passage beside the questions on wide screens */
:root{color-scheme:light dark;
--sky:light-dark(#4fc3f7,#0f2a44);--sea:light-dark(#0277bd,#071a2c);
--card:light-dark(#ffffff,#18293a);--soft:light-dark(#f4f8fb,#22374b);
--ink:light-dark(#1b2b38,#f1f6fa);--mute:light-dark(#5a6b78,#a9bccb);
--line:light-dark(#dfe8ef,#2e465c);--coral:#ff6b4a;--good:#18a874;--bad:#e5484d;--sun:#ffc93c;
--fs:1}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{font-size:calc(18px * var(--fs));background:var(--sea)}
body{margin:0;color:var(--ink);font:1rem/1.65 "Varela Round",Arial,sans-serif;overflow-x:clip;min-height:100vh;
background:linear-gradient(180deg,var(--sky) 0,var(--sea) 70%) fixed}
h1,h2,h3,.fred{font-family:Fredoka,"Varela Round",sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:18px;min-height:52px;color:inherit}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:16px max(4vw,14px) 60px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#fff}
.top h1{font-size:clamp(30px,6vw,46px);line-height:1.05;margin:0;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.sp{flex:1}
.chip{background:rgba(255,255,255,.22);color:#fff;padding:6px 14px;border-radius:99px;font-size:.85rem;white-space:nowrap;font-family:Fredoka,sans-serif;font-weight:600}
.ib{background:rgba(255,255,255,.22);color:#fff;min-width:52px;padding:0 14px;font-family:Fredoka,sans-serif;font-weight:600}
.card{background:var(--card);border-radius:28px;padding:clamp(16px,3vw,30px);box-shadow:0 10px 0 rgba(0,0,0,.14);margin-top:16px;position:relative}
.btn{background:var(--coral);color:#fff;font-family:Fredoka,sans-serif;font-weight:600;font-size:1.05rem;padding:8px 26px;box-shadow:0 5px 0 #c94a2e}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c94a2e}
.btn.alt{background:var(--soft);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* home */
.hello{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hello .mas{font-size:64px;line-height:1}
input.nm{font:inherit;padding:10px 16px;border-radius:16px;border:3px solid var(--line);background:var(--soft);color:var(--ink);width:min(100%,260px);min-height:52px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin-top:16px}
.seg button{background:var(--soft);text-align:start;padding:14px 16px;border:4px solid transparent;display:flex;gap:12px;align-items:center}
.seg button.on{border-color:var(--coral);background:light-dark(#fff1ec,#3a2420)}
.seg .e{font-size:38px}.seg b{display:block;font-family:Fredoka,sans-serif;font-size:1.15rem}
.seg small{color:var(--mute);font-size:.85rem;line-height:1.4;display:block}
.part{color:#fff;font-family:Fredoka,sans-serif;font-weight:600;font-size:1.15rem;margin:26px 0 10px;display:flex;gap:8px;align-items:center}
.part:after{content:"";flex:1;border-top:3px dashed rgba(255,255,255,.45)}
.isles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:16px}
.isl{background:var(--card);border-radius:26px;padding:16px;display:flex;gap:14px;align-items:center;text-align:start;box-shadow:0 8px 0 rgba(0,0,0,.14);border-bottom:8px solid var(--c);transition:transform .15s}
.isl:hover{transform:translateY(-3px) rotate(-.5deg)}
.badge{flex:none;width:78px;height:78px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:42px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.isl b{display:block;font-family:Fredoka,sans-serif;font-size:1.3rem;line-height:1.2}
.isl small{color:var(--mute);font-size:.85rem}
.st{color:var(--sun);font-size:1.25rem;letter-spacing:2px;text-shadow:0 1px 0 #b8860b}
.st .off{color:var(--line);text-shadow:none}
/* quiz head */
.track{position:relative;height:20px;margin:18px 6px 4px;background:rgba(255,255,255,.25);border-radius:99px}
.track i{position:absolute;inset-block:0;inset-inline-start:0;background:#7ef0c1;border-radius:99px;transition:width .5s}
.track .boat{position:absolute;top:-24px;font-size:34px;transition:inset-inline-start .5s;transform:translateX(50%) scaleX(-1)}
.qwrap{display:grid;gap:16px;margin-top:12px}
@media(min-width:920px){.qwrap.read{grid-template-columns:1fr 1.05fr;align-items:start}.pas{position:sticky;top:12px}}
.pas{background:light-dark(#fffaf0,#1f2c38);border-radius:28px;padding:18px;max-height:82vh;overflow:auto;border:4px solid var(--c);box-shadow:0 10px 0 rgba(0,0,0,.14)}
.pas h2{margin:0 0 8px;text-align:center;color:var(--c);font-size:1.7rem}
.pas img{width:100%;display:block;background:#fff;border-radius:14px}
.pas ol{list-style:none;margin:0;padding:0;counter-reset:ln}
.pas li{counter-increment:ln;display:grid;grid-template-columns:2.2em 1fr;gap:6px;padding:4px 8px;border-radius:12px;font-size:1.12rem;line-height:1.8;transition:background .3s}
.pas li:before{content:counter(ln);color:var(--mute);font-family:Fredoka,sans-serif;font-size:.85rem;padding-top:.3em}
.pas li.hl{background:light-dark(#fff1a8,#4a4216)}
.ptog{display:none}
@media(max-width:919px){.pas.closed{display:none}.ptog{display:inline-flex;align-items:center;gap:6px}}
.qcard{border-top:10px solid var(--c)}
.qhead{display:flex;gap:12px;align-items:flex-start}
.qhead .badge{width:64px;height:64px;font-size:34px}
.bubble{flex:1;background:var(--soft);border-radius:22px;border-start-start-radius:6px;padding:12px 16px;position:relative}
.qnum{font-family:Fredoka,sans-serif;color:var(--c);font-weight:700;font-size:.95rem}
.qt{font-size:clamp(1.15rem,3.2vw,1.35rem);line-height:1.55;margin:2px 0 0}
mark.q{background:light-dark(#fff1a8,#4a4216);color:inherit;padding:0 .25em;border-radius:8px;font-weight:600}
.lref{display:inline-block;background:var(--c);color:#fff;border-radius:99px;padding:0 .55em;font-size:.82em;font-family:Fredoka,sans-serif;font-weight:600;white-space:nowrap}
.n{display:inline-block;min-width:1.7em;text-align:center;background:light-dark(#e6f4ff,#1c3a55);color:light-dark(#0b5cab,#9fd3ff);border-radius:10px;padding:0 .25em;font-family:Fredoka,sans-serif;font-weight:700;direction:ltr}
.scene{font-size:44px;letter-spacing:6px;text-align:center;margin:12px 0 4px}
.speak{background:none;min-height:44px;min-width:44px;font-size:24px;padding:0;flex:none}
.hint{color:var(--mute);margin:12px 0;font-size:.95rem;display:flex;gap:6px;align-items:center}
.opts{display:grid;gap:12px}
.opts.short{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;gap:12px;align-items:center;text-align:start;background:var(--card);padding:12px 14px;border:4px solid var(--line);font-size:1.12rem;line-height:1.45;box-shadow:0 5px 0 var(--line);transition:transform .1s}
.opt:hover{transform:translateY(-2px)}
.opt .l{flex:none;width:42px;height:42px;border-radius:14px;color:#fff;display:grid;place-items:center;font-family:Fredoka,sans-serif;font-weight:700;font-size:1.2rem}
.opts.short .opt{justify-content:center;font-size:1.5rem;font-family:Fredoka,sans-serif;font-weight:600}
.opt.sel{border-color:var(--c);background:light-dark(#f0f7ff,#1d3346)}
.opt.ok{border-color:var(--good);background:light-dark(#e2f8ee,#163a2d);box-shadow:0 5px 0 var(--good)}
.opt.no{border-color:var(--bad);background:light-dark(#fde9ea,#3d1d20);box-shadow:0 5px 0 var(--bad)}
.eq{direction:ltr;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0}
.tile{background:var(--c);color:#fff;font-family:Fredoka,sans-serif;font-weight:700;font-size:clamp(28px,7vw,44px);min-width:1.9em;padding:4px 12px;border-radius:18px;text-align:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.op{font-family:Fredoka,sans-serif;font-weight:700;font-size:clamp(26px,6vw,40px);color:var(--ink);min-width:1em;text-align:center}
.slot{min-width:2.4em;border:4px dashed var(--coral);color:var(--coral);background:light-dark(#fff4f0,#3a2420);font-family:Fredoka,sans-serif;font-weight:700;font-size:clamp(28px,7vw,44px);padding:0 10px;border-radius:18px;text-align:center}
.slot.empty{animation:pulse 1.4s infinite}
.pics{display:grid;gap:10px;margin:18px auto;max-width:560px}
.pics .eq{margin:0;background:var(--soft);border-radius:20px;padding:10px;gap:6px}
.pics .ico{font-size:clamp(32px,8vw,48px);line-height:1}
.pics .tile{font-size:clamp(24px,6vw,36px)}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:360px;margin:0 auto;direction:ltr}
.pad button{background:var(--soft);font-family:Fredoka,sans-serif;font-size:1.7rem;font-weight:700;min-height:62px;box-shadow:0 5px 0 var(--line)}
.pad button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.pad .go{background:var(--good);color:#fff;box-shadow:0 5px 0 #0f7c55}
.fb{margin-top:18px;padding:14px 16px;border-radius:20px;display:flex;gap:12px;align-items:flex-start}
.fb .face{font-size:44px;line-height:1}
.fb.ok{background:light-dark(#e2f8ee,#163a2d)}.fb.no{background:light-dark(#fde9ea,#3d1d20)}.fb.try{background:light-dark(#fff4cf,#3b3418)}
.fb strong{display:block;font-family:Fredoka,sans-serif;font-size:1.25rem}
.nav{margin-top:20px;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.stop{text-align:center;padding:30px 10px}
.oct{width:170px;height:170px;margin:0 auto 16px;background:var(--bad);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);display:grid;place-items:center;color:#fff;font:700 40px Fredoka,sans-serif}
.big{font-size:clamp(28px,6vw,40px);font-family:Fredoka,sans-serif;font-weight:700;margin:0}
.res{display:grid;gap:10px;margin:16px 0}
.res div{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:18px;padding:8px 12px;border-inline-start:8px solid var(--c)}
.res .badge{width:48px;height:48px;font-size:26px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td,th{padding:8px 6px;border-bottom:2px solid var(--line);text-align:start;vertical-align:top}
.tag{font-weight:700;white-space:nowrap}.tag.ok{color:var(--good)}.tag.no{color:var(--bad)}
.note{font-size:.8rem;color:var(--mute);margin-top:12px}
.cf{position:fixed;top:40%;left:50%;width:12px;height:12px;border-radius:3px;pointer-events:none;z-index:9}
@keyframes pulse{50%{background:light-dark(#ffe3d9,#4a2a22)}}
@keyframes boom{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.94);opacity:.3}}
@keyframes bob{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .3s ease}.shake{animation:shake .3s 2}.badge.bob{animation:bob 2.4s ease-in-out infinite}.cf{animation:boom .9s ease-out forwards}}
@media (prefers-reduced-motion:reduce){.cf{display:none}.slot.empty{animation:none}}
@media(max-width:600px){.qhead>.badge{display:none}.opts.short{grid-template-columns:repeat(2,minmax(0,1fr))}table{font-size:.8rem}}
</style>
</head>

{id:'r2',name:'סבב 2',sub:'שאלות חדשות',icon:'🏴‍☠️',stations:[
{id:'bee',icon:'🐝',c:C.yellow,name:'הדבורה',kind:'קטע מידע',part:1,title:'הַדְּבוֹרָה',text:[
'כשאנחנו רואים דבורה עפה מפרח לפרח, נראה שהיא סתם מסתובבת.',
'אבל לדבורה יש עבודה חשובה מאוד. היא אוספת צוף, מיץ מתוק שיש בתוך הפרחים.',
'מהצוף הדבורים מכינות דבש, והדבש הוא האוכל שלהן בחורף.',
'הדבורה היא חרק. לחרקים יש שש רגליים, ולרוב יש להם גם כנפיים.',
'רוב החרקים חיים לבד, אבל הדבורים חיות יחד בכוורת גדולה.',
'בכוורת יש מלכה אחת, והיא מטילה את כל הביצים.',
'שאר הדבורים עובדות: יש שמנקות, יש ששומרות על הפתח, ויש שיוצאות לאסוף צוף.',
'כשדבורה מוצאת שדה מלא פרחים, היא חוזרת לכוורת ורוקדת.',
'היא מסתובבת במעגלים ומנענעת את הגוף שלה.',
'הריקוד מספר לשאר הדבורים לאיזה כיוון לעוף, וכמה רחוק נמצאים הפרחים.',
'כך כל הדבורים יודעות איפה האוכל, בלי מפה ובלי מילים. איזה רעיון חכם!',
'בזמן שהדבורה אוספת צוף, נדבקת אליה אבקה צהובה מהפרח.',
'כשהיא עפה לפרח הבא, האבקה עוברת איתה ועוזרת לפרחים לגדל פירות.',
'בפעם הבאה שתאכלו תפוח או אבטיח, זכרו: אולי דבורה קטנה עזרה לו לגדול.'],qs:[
{q:'מדוע הדבורים אוספות צוף?',o:['כי הן אוהבות לעוף מפרח לפרח','כי מהצוף הן מכינות דבש, האוכל שלהן בחורף','כי הצוף עוזר לפרחים לגדל פירות','כי המלכה מטילה ביצים בתוך הצוף'],a:1,hl:[2,3],e:'בשורות 2–3 כתוב שמהצוף הדבורים מכינות דבש, והדבש הוא האוכל שלהן בחורף.'},
{q:'בשורה 5 כתוב: "אבל הדבורים חיות יחד". מדוע כתוב "אבל"?',o:['כי הדבורים הן לא חרקים','כי הדבורים שונות מרוב החרקים, שחיים לבד','כי בכוורת יש רק מלכה אחת','כי הדבורים עפות רחוק מהכוורת'],a:1,hl:[5],e:'בתחילת שורה 5 כתוב שרוב החרקים חיים לבד. "אבל" מראה שהדבורים שונות מהם – הן חיות יחד.'},
{q:'בשורה 11 כתוב: "איזה רעיון חכם!" מהו הרעיון?',o:['לרקוד כדי לספר לדבורים האחרות איפה הפרחים','להכין דבש לחורף','לגור יחד בכוורת גדולה','לשמור על הפתח של הכוורת'],a:0,hl:[8,9,10,11],e:'בשורות 8–11 כתוב שהדבורה רוקדת, והריקוד מספר לשאר הדבורים לאן לעוף – בלי מפה ובלי מילים.'},
{q:'מה המטרה של המשפט האחרון בקטע (שורה 14)?',o:['להסביר איך מכינים דבש','להזכיר שהדבורים עוזרות לפירות שאנחנו אוכלים לגדול','להזהיר מעקיצה של דבורה','לספר שדבורים אוהבות לאכול תפוחים'],a:1,hl:[12,13,14],e:'בשורות 12–13 כתוב שהאבקה שהדבורה מעבירה עוזרת לפרחים לגדל פירות. המשפט האחרון מזכיר את זה.'},
{q:'על איזו שאלה אין תשובה בקטע המידע?',o:['כמה רגליים יש לדבורה?','מי מטילה את הביצים בכוורת?','כמה דבורים חיות בכל כוורת?','מה אוכלות הדבורים בחורף?'],a:2,hl:[5],e:'בשורה 5 כתוב שהכוורת גדולה, אבל לא כתוב כמה דבורים יש בה. לשאר השאלות יש תשובה בקטע.'}]},
{id:'tower',icon:'🧱',c:C.red,name:'המגדל של נועה',kind:'סיפור',part:1,title:'הַמִּגְדָּל שֶׁל נוֹעָה',text:[
'נועה רצתה לבנות את המגדל הכי גבוה בבית. היא הוציאה את כל הקוביות מהארגז.',
'"כדאי לשים את הקוביות הגדולות למטה," אמר יונתן, אחיה הגדול.',
'"אני לא צריכה עזרה!" אמרה נועה, ושמה קובייה קטנה ראשונה.',
'היא בנתה מהר, קובייה על קובייה, והמגדל עלה וגבה.',
'כשהמגדל הגיע עד הברך שלה, הוא התחיל להתנדנד מצד לצד.',
'נועה עצרה את הנשימה, ושמה עוד קובייה אחת בזהירות רבה.',
'בום! כל הקוביות נפלו והתפזרו על השטיח.',
'נועה ישבה על הרצפה, ושתי דמעות ירדו לה על הלחיים.',
'יונתן התיישב לידה ולא אמר כלום. הוא רק הרים קובייה גדולה והגיש לה אותה.',
'נועה הסתכלה על הקובייה, ואחר כך על יונתן. "אולי ננסה ביחד?" שאלה בשקט.',
'הפעם הם התחילו מהקוביות הגדולות, ובנו לאט לאט.',
'כל כמה קוביות, נועה בדקה שהמגדל עומד ישר.',
'המגדל עלה מעל הברך, מעל המותן ועד הכתף של נועה – והוא לא זז בכלל.',
'"גם אני הייתי ממהר פעם," צחק יונתן. "המגדל הראשון שלי נפל שלוש פעמים!"',
'נועה חייכה. "מגדל טוב לא בונים מהר," אמרה. "בונים אותו חזק."'],qs:[
{q:'למה התכוונה נועה כשאמרה "אני לא צריכה עזרה!"?',o:['שהיא לא אוהבת את יונתן','שהיא רוצה לבנות לבד, בדרך שלה','שהיא כבר סיימה לבנות','שאין מספיק קוביות לשניהם'],a:1,hl:[2,3],e:'יונתן הציע עצה (שורה 2), ונועה ענתה שהיא לא צריכה עזרה – היא רצתה לבנות לבד, בדרך שלה.'},
{q:'מדוע המגדל הראשון נפל?',o:['כי יונתן דחף אותו','כי נועה בנתה מהר, ושמה קובייה קטנה למטה','כי לא היו מספיק קוביות','כי השטיח היה רטוב'],a:1,hl:[2,3,4],e:'יונתן אמר לשים את הגדולות למטה (שורה 2), אבל נועה שמה קובייה קטנה ראשונה ובנתה מהר (שורות 3–4).'},
{q:'בשורה 5 כתוב: "הוא התחיל להתנדנד". מה פירוש "להתנדנד"?',o:['לזוז מצד לצד','לגדול','להיעלם','להשמיע רעש'],a:0,hl:[5],e:'מיד אחרי המילה כתוב "מצד לצד" – להתנדנד זה לזוז מצד לצד, כמו נדנדה.'},
{q:'מדוע יונתן לא אמר כלום, ורק הגיש לנועה קובייה גדולה (שורה 9)?',o:['כי הוא כעס עליה','כי הוא רצה לבנות מגדל משלו','כי הוא רצה לעזור לה בעדינות, בלי להגיד "אמרתי לך"','כי הוא לא ראה שהמגדל נפל'],a:2,hl:[8,9],e:'נועה הייתה עצובה (שורה 8). יונתן התיישב לידה והגיש לה קובייה גדולה – כך הזכיר לה בעדינות את העצה שלו.'},

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EMO='🌼⭐🐱🚗🍎🐶🌙🐟🍀';
const mx=s=>String(s).split(new RegExp(`([0-9${EMO}](?:[0-9 +−×÷=${EMO}]*[0-9${EMO}])?)`,'u')).map((p,i)=>i%2?`<span dir="ltr" style="unicode-bidi:isolate;white-space:nowrap">${esc(p)}</span>`:esc(p)).join('');
const fq=(s,nums)=>String(s).split(/("[^"]+"|שורות? \d+(?:[–-]\d+)?|\(שורה \d+\)|\d+)/).map((p,i)=>{if(i%2===0)return esc(p);if(p[0]==='"')return `<mark class="q">${esc(p)}</mark>`;if(/שור/.test(p))return `<span class="lref">${esc(p.replace(/[()]/g,''))}</span>`;return nums?`<span class="n">${esc(p)}</span>`:`<span dir="ltr">${esc(p)}</span>`}).join('');
const R=()=>ROUNDS.find(r=>r.id===S.round);
const key=(st)=>S.round+':'+st.id;
const starN=st=>{const r=S.res[key(st)];if(!r)return -1;const ok=r.filter(x=>x&&x.ok).length,n=st.qs.length;return ok===n?3:ok>=n*0.6?2:ok>0?1:0};
const stars=st=>{const k=starN(st);return k<0?'':`<span class="st" aria-label="${k} כוכבים">${'★'.repeat(k)}<span class="off">${'★'.repeat(3-k)}</span></span>`};
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='he-IL';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function confetti(){const cs=['#ff6b4a','#ffc93c','#18a874','#1e88e5','#8e44ef','#e94e8a'];for(let i=0;i<22;i++){const d=document.createElement('i');d.className='cf';d.style.background=cs[i%6];d.style.setProperty('--x',(Math.random()*360-180)+'px');d.style.setProperty('--y',(Math.random()*-260-40)+'px');document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}}

  <div class="row" style="margin-top:22px">${S.mode==='test'?'<button class="btn" id="full">⏱️ התחלת מבחן מלא</button>':''}${done?'<button class="btn alt" id="rep">📋 דוח להורה</button><button class="btn alt" id="rst">🔄 איפוס הסבב</button>':''}</div>`;

  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>start([b.dataset.s]));
  const f=app.querySelector('#full');if(f)f.onclick=()=>start(rd.stations.map(s=>s.id),true);
  const r=app.querySelector('#rep');if(r)r.onclick=report;
  const x=app.querySelector('#rst');if(x)x.onclick=()=>{rd.stations.forEach(s=>delete S.res[key(s)]);save();home()};

function start(ids,full){
  cur={ids,si:0,qi:0,full:!!full,ans:{},end:full?Date.now()+45*60000:0,stopShown:false};
  ids.forEach(id=>cur.ans[id]=[]);
  if(full)startTimer();show();
}
function startTimer(){stopTimer();timer=setInterval(()=>{if(!cur)return;const left=Math.max(0,cur.end-Date.now());const el=document.getElementById('clock');if(el)el.textContent=fmt(left);if(left===0){stopTimer();finish()}},1000)}
function stopTimer(){if(timer)clearInterval(timer);timer=null}
const fmt=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const test=()=>S.mode==='test';
const stOf=id=>R().stations.find(s=>s.id===id);
function eqHTML(str,val){return `<div class="eq">${str.split(' ').map(t=>t==='☐'?`<span class="slot ${val?'':'empty'}">${val?esc(val):'?'}</span>`:/^\d+$/.test(t)?`<span class="tile">${t}</span>`:[...t].length===1&&EMO.includes(t)?`<span class="ico">${t}</span>`:/\p{Extended_Pictographic}/u.test(t)?`<span class="ico">${t}</span>`:`<span class="op">${esc(t)}</span>`).join('')}</div>`}

function show(){
  const st=stOf(cur.ids[cur.si]);
  if(cur.full&&st.part===2&&!cur.stopShown){cur.stopShown=true;
    app.innerHTML=`<div class="card stop pop"><div class="oct">עִצְרוּ!</div><p class="big">סיימתם את החלק הראשון 👏</p><p>אפשר לנוח רגע, ולעבור לחשבון רק אחרי שהמבוגר מאשר.</p><button class="btn" id="go">🔢 ממשיכים לחשבון</button></div>`;
    app.querySelector('#go').onclick=show;return}
  const q=st.qs[cur.qi];Object.assign(cur,{tries:0,val:'',locked:false});
  const total=st.qs.length,pct=cur.qi/total*100,read=!!(st.img||st.text);
  let body='';
  if(q.t==='num')body=`<div id="eqb">${eqHTML(q.eq,'')}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="del" aria-label="מחיקה">⌫</button><button data-k="0">0</button><button data-k="ok" class="go" aria-label="בדיקה">✓</button></div>`;
  else{const short=q.o.every(o=>o.length<=4);
    body=(q.t==='pic'?`<div class="pics">${q.rows.map(r=>eqHTML(r)).join('')}</div>`:'')+(q.sc?`<div class="scene" aria-hidden="true">${q.sc}</div>`:'')+`<p class="hint">👆 בחרו תשובה אחת</p><div class="opts ${short?'short':''}">${q.o.map((o,i)=>`<button class="opt" data-o="${i}"><span class="l" style="background:${LC[i]}">${L[i]}</span><span>${fq(o,false)}</span></button>`).join('')}</div>`}
  const pas=st.img?`<img alt="קטע הקריאה: ${st.name}" src="${IMG[st.img]}">`:st.text?`<h2>${st.title}</h2><ol>${st.text.map((l,i)=>`<li id="L${i+1}">${esc(l)}</li>`).join('')}</ol>`:'';
  app.innerHTML=`<div style="--c:${st.c}"><header class="top"><button class="ib" id="home">🏝️ למפה</button><span class="sp"></span>${cur.full?`<span class="chip">⏱️ <span id="clock">${fmt(cur.end-Date.now())}</span></span>`:''}<span class="chip">${st.icon} ${st.name}</span></header>
  <div class="track" aria-label="שאלה ${cur.qi+1} מתוך ${total}"><i style="width:${pct}%"></i><span class="boat" style="inset-inline-start:${pct}%">⛵</span></div>
  <div class="qwrap ${read?'read':''}">
  ${read?`<div class="pas closed" id="pas">${pas}</div>`:''}
  <div class="card qcard pop" style="margin-top:0">
  ${read?'<button class="btn alt ptog" id="pt" style="margin-bottom:12px">📖 לקטע</button>':''}
  <div class="qhead"><span class="badge">${st.icon}</span><div class="bubble"><span class="qnum">שאלה ${cur.qi+1} מתוך ${total}</span><p class="qt">${fq(q.q,st.id.startsWith('word'))}</p></div><button class="speak" id="say" aria-label="הקראת השאלה">🔊</button></div>
  ${body}<div id="fb" aria-live="polite"></div>
  <div class="nav"><button class="btn alt" id="prev" ${cur.qi===0&&cur.si===0?'style="visibility:hidden"':''}>→ הקודמת</button><button class="btn" id="next" ${test()?'':'style="display:none"'}>הבאה ←</button></div>
  </div></div></div>`;
  if(read&&matchMedia('(min-width:920px)').matches)app.querySelector('#pas').classList.remove('closed');
  const pt=app.querySelector('#pt');if(pt)pt.onclick=()=>togglePas();
  app.querySelector('#say').onclick=()=>say(q.q+(q.o?'. '+q.o.map((o,i)=>L[i]+'. '+o).join('. '):''));
  app.querySelector('#home').onclick=()=>{saveStation();home()};
  app.querySelector('#prev').onclick=()=>move(-1);
  app.querySelector('#next').onclick=()=>move(1);
  const prev=cur.ans[st.id][cur.qi];
  if(q.t==='num'){if(prev&&test()){cur.val=String(prev.v);drawEq(q)}
    app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k,q,st));
    document.onkeydown=e=>{if(/^\d$/.test(e.key))press(e.key,q,st);else if(e.key==='Backspace')press('del',q,st);else if(e.key==='Enter')press('ok',q,st)}}
  else{document.onkeydown=null;if(prev&&test())mark(prev.v);
    app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>choose(+b.dataset.o,q,st))}
}
function togglePas(open){const p=app.querySelector('#pas'),pt=app.querySelector('#pt');if(!p)return;const c=open===true?false:!p.classList.contains('closed');p.classList.toggle('closed',c);if(pt)pt.textContent=c?'📖 לקטע':'🙈 הסתרת הקטע';if(!c&&!matchMedia('(min-width:920px)').matches)p.scrollIntoView({behavior:'smooth'})}
function drawEq(q){app.querySelector('#eqb').innerHTML=eqHTML(q.eq,cur.val)}
function mark(i){app.querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('sel',j===i))}
function press(k,q,st){if(cur.locked)return;
  if(k==='del')cur.val=cur.val.slice(0,-1);
  else if(k==='ok'){if(cur.val==='')return;const n=+cur.val;answer(st,q,n,q.ok?q.ok(n):n===q.a);return}
  else if(cur.val.length<3)cur.val+=k;
  drawEq(q);if(test()&&cur.val!=='')cur.ans[st.id][cur.qi]={v:+cur.val,ok:q.ok?q.ok(+cur.val):+cur.val===q.a}}
function choose(i,q,st){if(cur.locked)return;
  if(test()){mark(i);cur.ans[st.id][cur.qi]={v:i,ok:i===q.a};return}
  answer(st,q,i,i===q.a,app.querySelectorAll('.opt')[i])}
function answer(st,q,v,ok,btn){
  const fb=app.querySelector('#fb');
  if(test()){cur.ans[st.id][cur.qi]={v,ok};move(1);return}
  cur.tries++;
  if(!ok&&cur.tries<2){
    if(btn){btn.classList.add('no','shake');btn.disabled=true}
    let tip=q.t==='num'?'בדקו את החישוב עוד פעם, לאט.':q.t==='pic'?'התחילו מהשורה שיש בה רק ציור אחד מסוג אחד.':st.id.startsWith('word')?'קראו שוב את השאלה עד הסוף, וחשבו בשלבים.':'כדאי לחזור לקטע ולחפש שם את התשובה.';
    if(q.hl){q.hl.forEach(n=>{const l=app.querySelector('#L'+n);if(l)l.classList.add('hl')});togglePas(true);tip=`הציצו בשורות שסימנו לכם בצהוב בקטע 💛`}
    else if(q.h)tip=`הציצו בקטע: ${q.h}`;
    fb.innerHTML=`<div class="fb try pop"><span class="face">🤔</span><div><strong>כמעט! נסו שוב</strong>${esc(tip)}</div></div>`;
    if(q.t==='num'){cur.val='';drawEq(q)}
    cur.ans[st.id][cur.qi]={v,ok:false,first:true};return}
  const first=cur.ans[st.id][cur.qi];
  cur.ans[st.id][cur.qi]={v,ok:ok&&!(first&&first.first)};
  cur.locked=true;
  if(btn)btn.classList.add(ok?'ok':'no');
  if(!ok&&q.o)app.querySelectorAll('.opt')[q.a].classList.add('ok');
  if(ok)confetti();
  const right=q.o?`${L[q.a]}. ${q.o[q.a]}`:(q.show||q.a);
  const cheers=['מצוין!','נכון מאוד!','כל הכבוד!','איזה אלופים!'];
  fb.innerHTML=`<div class="fb ${ok?'ok':'no'} pop"><span class="face">${ok?(cur.tries>1?'💪':'🌟'):'💡'}</span><div><strong>${ok?(cur.tries>1?'יפה! הצלחתם בניסיון השני':cheers[cur.qi%4]):'התשובה הנכונה: '+esc(right)}</strong>${mx(q.e)}</div></div>`;
  const n=app.querySelector('#next');n.style.display='';n.focus({preventScroll:true});fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function move(d){
  const st=stOf(cur.ids[cur.si]);cur.qi+=d;
  if(cur.qi<0){if(cur.si>0){cur.si--;cur.qi=stOf(cur.ids[cur.si]).qs.length-1}else cur.qi=0}
  else if(cur.qi>=st.qs.length){if(cur.si<cur.ids.length-1){cur.si++;cur.qi=0}else return finish()}
  show();window.scrollTo({top:0,behavior:'smooth'});
}
function saveStation(){if(!cur)return;cur.ids.forEach(id=>{const st=stOf(id),a=cur.ans[id];if(a.some(x=>x))S.res[key(st)]=st.qs.map((_,i)=>a[i]||{v:null,ok:false})});save();stopTimer();document.onkeydown=null}
function finish(){
  saveStation();const ids=cur.ids;cur=null;
  const rows=ids.map(id=>{const st=stOf(id),r=S.res[key(st)]||[];return {st,ok:r.filter(x=>x&&x.ok).length,n:st.qs.length}});
  const ok=rows.reduce((a,r)=>a+r.ok,0),n=rows.reduce((a,r)=>a+r.n,0);
  if(ok>=n*0.6)setTimeout(confetti,200);
  app.innerHTML=`<header class="top"><h1>${ok===n?'אלופים! 🏆':'הגעתם לאי! 🎉'}</h1></header>
  <div class="card pop"><p class="big">${S.name?esc(S.name)+', ':''}ענית נכון על ${ok} מתוך ${n}</p>
  <div class="res">${rows.map(r=>`<div style="--c:${r.st.c}"><span class="badge">${r.st.icon}</span><b class="fred" style="flex:1">${r.st.name}</b>${stars(r.st)}<span class="fred">${r.ok}/${r.n}</span></div>`).join('')}</div>
  <div class="row">${rows.some(r=>r.ok<r.n)?'<button class="btn" id="wrong">💪 עוד ניסיון במה שהיה קשה</button>':''}<button class="btn alt" id="rep">📋 תשובות והסברים</button><button class="btn alt" id="map">🏝️ למפה</button></div></div>`;
  app.querySelector('#map').onclick=home;app.querySelector('#rep').onclick=report;
  const w=app.querySelector('#wrong');if(w)w.onclick=()=>{S.mode='practice';save();const id=ids.find(id=>(S.res[key(stOf(id))]||[]).some(x=>!x.ok));start([id]);cur.qi=S.res[key(stOf(id))].findIndex(x=>!x.ok);show()};
}
function report(){
  stopTimer();const rd=R();
  app.innerHTML=`<header class="top"><button class="ib" id="map">🏝️ למפה</button><span class="sp"></span><span class="chip">דוח להורה · ${rd.name}${S.name?' · '+esc(S.name):''}</span></header>
  <div class="card"><p style="margin-top:0">הכי מועיל לדעת <b>איזו</b> שאלה עוד קשה, ולא כמה. ההסבר ליד כל שאלה הוא מה שאפשר להגיד לילד.</p>
  ${rd.stations.filter(s=>S.res[key(s)]).map(st=>`<h3 style="color:${st.c}">${st.icon} ${st.name}</h3><table><thead><tr><th>#</th><th>תוצאה</th><th>תשובה נכונה והסבר</th></tr></thead><tbody>${st.qs.map((q,i)=>{const r=S.res[key(st)][i];return `<tr><td>${i+1}</td><td><span class="tag ${r.ok?'ok':'no'}">${r.ok?'✓ נכון':r.v===null?'– דילג':'✗ עוד קשה'}</span></td><td><b>${esc(q.o?L[q.a]+'. '+q.o[q.a]:(q.show||q.a))}</b><br>${mx(q.e)}</td></tr>`}).join('')}</tbody></table>`).join('')||'<p>עוד לא נפתרו שאלות בסבב הזה.</p>'}
  <p class="note">סבב 1 מבוסס על מבחן לדוגמה לשלב א׳ (Heyli). סבב 2 – שאלות מקוריות באותו מבנה. בתרגול, תשובה נחשבת נכונה רק אם נענתה נכון בניסיון הראשון.</p></div>`;
  app.querySelector('#map').onclick=home;
}
home();
}
</script>
