<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>מוסך התנועות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Varela+Round&display=swap">
<style>
/* Layout: race-garage screen — track on top, 4 station tabs, one big task card, coach controls at the bottom */
:root{
  --asphalt:#1D3557; --paper:#FFF8EC; --card:#ffffff; --ink:#1D3557; --soft:#5f6e84;
  --red:#E63946; --yellow:#FFC93C; --sky:#4CC9F0; --lime:#8AC926; --violet:#9B5DE5; --orange:#FB8B24;
  --display:"Rubik","Arial Hebrew",Arial,sans-serif; --read:"Varela Round","Arial Hebrew",Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--display);direction:rtl;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-weight:900;font-size:clamp(22px,5vw,34px);margin:0;text-wrap:balance}
.checker{height:12px;border-radius:6px;background:repeating-conic-gradient(var(--asphalt) 0 25%,var(--card) 0 50%) 0 0/12px 12px}
.track{position:relative;background:var(--asphalt);border-radius:18px;height:70px;overflow:hidden}
.track::before{content:"";position:absolute;inset:50% 14px auto;border-top:4px dashed var(--yellow);opacity:.7}
.finish{position:absolute;left:0;top:0;bottom:0;width:22px;background:repeating-conic-gradient(var(--ink) 0 25%,var(--card) 0 50%) 0 0/11px 11px}
.car{position:absolute;top:9px;right:8px;width:52px;height:52px;transition:right .7s cubic-bezier(.3,1.4,.5,1);transform:scaleX(-1)}
.fuel{display:flex;gap:4px;align-items:center}
.fuel span{width:15px;height:22px;border-radius:4px;border:2px solid var(--ink);background:var(--card)}
.fuel span.on{background:var(--red)}
.fuel b{font-size:14px;margin-inline-start:6px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tab{border:4px solid;border-radius:16px;background:var(--card);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font:700 15px var(--display);color:var(--ink);cursor:pointer}
.tab img{width:38px;height:38px}
.tab[aria-pressed="true"]{color:var(--card)}
.panel{background:var(--card);border-radius:24px;border:4px solid var(--ink);padding:18px;display:flex;flex-direction:column;align-items:center;gap:16px;min-height:360px}
.prompt{font-size:19px;font-weight:700;text-align:center;text-wrap:balance}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.msg{min-height:28px;font-weight:700;font-size:19px;text-align:center}
.btn{border:0;border-radius:14px;padding:10px 18px;font:700 17px var(--display);cursor:pointer;background:var(--ink);color:var(--card)}
.btn.ghost{background:transparent;color:var(--ink);border:3px solid var(--ink)}
.vcar{border:4px solid;border-radius:18px;background:var(--card);cursor:pointer;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px;font:700 15px var(--display);color:var(--ink)}
.vcar img{width:40px;height:40px}
.vcar .s{font:400 34px var(--read)}
.big{font-family:var(--read);font-size:clamp(90px,26vw,150px);line-height:1.15}
.detail{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center;border-radius:18px;padding:14px;width:100%;box-sizing:border-box}
.detail .txt{flex:1;min-width:0;max-width:440px;display:flex;flex-direction:column;gap:8px;font-size:17px;line-height:1.5}
.detail .gest{font-weight:700;border-radius:12px;padding:6px 10px;background:var(--card)}
.letters{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.lt{width:46px;height:46px;border-radius:12px;border:3px solid var(--ink);background:var(--card);font:400 26px var(--read);color:var(--ink);cursor:pointer}
.lt[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.pic{width:min(170px,40vw);height:min(170px,40vw)}
.gear{width:88px;height:88px;border-radius:50%;border:5px dashed var(--violet);background:var(--card);font:900 38px var(--display);color:var(--ink);cursor:pointer}
.slots{display:flex;gap:8px;direction:rtl;flex-wrap:wrap;justify-content:center}
.slot{min-width:84px;height:84px;border-radius:14px;border:4px dashed var(--soft);display:flex;align-items:center;justify-content:center;font:400 44px var(--read);padding:0 6px}
.slot.full{border-style:solid;border-color:var(--asphalt);background:var(--yellow)}
.chip{min-width:84px;height:84px;border-radius:14px;border:4px solid var(--asphalt);background:var(--card);font:400 44px var(--read);color:var(--ink);cursor:pointer;padding:0 8px}
.chip[disabled]{opacity:.25;cursor:default}
.shake{animation:sh .4s} @keyframes sh{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
.pop{animation:pp .5s} @keyframes pp{50%{transform:scale(1.15)}}
.coach{display:flex;gap:10px 16px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px;color:var(--soft)}
.coach label{display:flex;gap:4px;align-items:center;cursor:pointer}
.coach .vc{font:400 20px var(--read);color:var(--ink)}
.peek{font-size:13px;padding:4px 10px}
button:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
@media (max-width:520px){.tab{font-size:12px}.tab img{width:30px;height:30px}.vcar{min-width:74px}.chip,.slot{min-width:66px;height:68px;font-size:34px}.gear{width:70px;height:70px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>מוּסַךְ הַתְּנוּעוֹת שֶׁל נֹעַם</h1>
    <div class="fuel" id="fuel" aria-label="מד דלק"></div>
  </header>
  <div class="track" aria-hidden="true"><div class="finish"></div><img class="car" id="car" alt=""></div>
  <div class="tabs" role="group" aria-label="תחנות">
    <button class="tab" data-m="learn" style="border-color:var(--red)"><img data-i="1f527" alt="">5 הַמְּכוֹנִיּוֹת</button>
    <button class="tab" data-m="which" style="border-color:var(--sky)"><img data-i="1f50e" alt="">אֵיזוֹ מְכוֹנִית?</button>
    <button class="tab" data-m="count" style="border-color:var(--violet)"><img data-i="1f44f" alt="">סְפִירַת הֲבָרוֹת</button>
    <button class="tab" data-m="build" style="border-color:var(--asphalt)"><img data-i="1f682" alt="">חִבּוּר קְרוֹנוֹת</button>
  </div>
  <section class="panel" id="panel" aria-live="polite"></section>
  <div class="checker"></div>
  <div class="coach" id="coach">
    <span>תנועות שנלמדו:</span>
    <button class="btn ghost" id="reset" style="font-size:14px;padding:6px 12px">מרוץ חדש</button>
  </div>
</div>

const tabColor={learn:"var(--red)",which:"var(--sky)",count:"var(--violet)",build:"var(--asphalt)"};
const MARKS={a:["ָ","ַ"],e:["ֶ","ֵ"],i:["ִ"],o:["וֹ"],u:["וּ","וּ","ֻ"]};
const LET=["מ","ל","ס","ר","נ","ת","ג","בּ","דּ","פּ"];
const V5=D.vowels.filter(v=>v.k!=="sh");
let mode="learn",score=0,learned=new Set(["a","e","i","o","u"]),lastSyl="";
const $=s=>document.querySelector(s),panel=$("#panel");
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
document.querySelectorAll("img[data-i]").forEach(i=>i.src=D.icons[i.dataset.i]);
$("#car").src=D.icons["1f3ce"];

// coach vowel checkboxes
V5.forEach(v=>{const l=document.createElement("label");l.innerHTML=`<input type="checkbox" id="v-${v.k}" checked><span class="vc">${v.snd}</span>`;
  $("#reset").before(l);l.querySelector("input").onchange=e=>{e.target.checked?learned.add(v.k):learned.delete(v.k);
    if(learned.size<2){e.target.checked=true;learned.add(v.k);}go(mode);};});

function drawFuel(){$("#fuel").innerHTML=Array.from({length:12},(_,i)=>`<span class="${i<score?'on':''}"></span>`).join("")+`<b>${score}/12</b>`;
  const t=$(".track").clientWidth-70;$("#car").style.right=(8+t*Math.min(score,12)/12)+"px";}
const cheers=["יוֹפִי! מִלֵּאתָ דֶּלֶק","בְּרְרְרְם! קָדִימָה","אַלּוּף הַמַּסְלוּל!","נֶהָג מְעֻלֶּה!"];
function win(m,next){score++;drawFuel();m.textContent=cheers[score%4];if(score>=12){setTimeout(finish,900);return;}setTimeout(next,1100);}
function nope(el,m,t){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");m.textContent=t;}

/* 1. learn the five cars */
function learn(sel){sel=sel||D.vowels[0];let L="מ";
  const mk=v=>v.k==="sh"?"ְ":MARKS[v.k][0];
  panel.innerHTML=`<div class="prompt">לְחַץ עַל מְכוֹנִית – קְרָא אֶת הַסִּפּוּר וַעֲשֵׂה אֶת הַתְּנוּעָה!</div>
   <div class="row">${D.vowels.map((v,i)=>`<button class="vcar" data-i="${i}" style="border-color:${v.color}${v===sel?`;background:${v.color}22`:''}"><img src="${v.icon}" alt=""><span class="s">${v.snd}</span></button>`).join("")}</div>
   <div class="detail" style="background:${sel.color}18;border:3px solid ${sel.color}">
     <div class="big" id="bigL">${L+mk(sel)}</div>
     <div class="txt"><b style="font-size:24px;color:${sel.color}">${sel.title}</b><span style="font-family:var(--read)">${sel.marks}</span>
       <span>${sel.story}</span><span class="gest">🤸 ${sel.gesture}</span></div></div>
   <div class="prompt" style="font-size:16px">הַחְלֵף אוֹת – אוֹתָהּ מְכוֹנִית, אוֹתוֹ צְלִיל:</div>
   <div class="letters">${LET.map(l=>`<button class="lt" aria-pressed="${l===L}">${l}</button>`).join("")}</div>`;
  panel.querySelectorAll(".vcar").forEach(b=>b.onclick=()=>learn(D.vowels[+b.dataset.i]));
  panel.querySelectorAll(".lt").forEach(b=>b.onclick=()=>{L=b.textContent;$("#bigL").textContent=L+mk(sel);
    panel.querySelectorAll(".lt").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#bigL").classList.remove("pop");void $("#bigL").offsetWidth;$("#bigL").classList.add("pop");});}

/* 2. which car? */
function which(){const pool=V5.filter(v=>learned.has(v.k));let v,s;
  do{v=rnd(pool);s=rnd(LET)+rnd(MARKS[v.k]);}while(s===lastSyl);lastSyl=s;
  panel.innerHTML=`<div class="prompt">אֵיפֹה הַנְּקֻדָּה? עֲשֵׂה אֶת הַתְּנוּעָה – וּבְחַר מְכוֹנִית!</div>
   <div class="big">${s}</div>
   <div class="row">${shuffle(pool).map(p=>`<button class="vcar" data-k="${p.k}" style="border-color:${p.color}"><img src="${p.icon}" alt=""><span class="s">${p.snd}</span></button>`).join("")}</div>
   <div class="msg" id="msg"></div>`;
  panel.querySelectorAll(".vcar").forEach(b=>b.onclick=()=>{
    if(b.dataset.k===v.k){b.classList.add("pop");b.style.background=v.color+"33";win($("#msg"),which);}
    else nope(b,$("#msg"),"זוֹ מְכוֹנִית אַחֶרֶת. בְּדֹק אֵיפֹה הַסִּימָן");});}

/* 3. count syllables (listening) */
let lastCount="";
function count(){let w;do{w=rnd([...D.words,...D.one]);}while(w.syl.join("")===lastCount);lastCount=w.syl.join("");
  panel.innerHTML=`<div class="prompt">עֲדִי אוֹמֶרֶת אֶת הַמִּלָּה. מְחָא כַּף עַל כָּל הֲבָרָה – כַּמָּה הִילּוּכִים?</div>
   <img class="pic" src="${w.img}" alt="">
   <button class="btn ghost peek" id="peek">הצג מילה לעדי</button>
   <div class="row">${[1,2,3].map(n=>`<button class="gear" data-n="${n}">${n}</button>`).join("")}</div><div class="msg" id="msg"></div>`;
  $("#peek").onclick=()=>{$("#peek").textContent=w.syl.join("");$("#peek").style.fontFamily="var(--read)";$("#peek").style.fontSize="22px";};
  panel.querySelectorAll(".gear").forEach(b=>b.onclick=()=>{
    if(+b.dataset.n===w.syl.length){b.classList.add("pop");b.style.background="var(--yellow)";
      $("#peek").textContent=w.syl.join(" · ");$("#peek").style.fontFamily="var(--read)";$("#peek").style.fontSize="22px";win($("#msg"),count);}
    else nope(b,$("#msg"),"נִמְחָא שׁוּב לְאַט: הֲבָרָה – כַּף");});}

/* 4. build the train */
let lastBuild="";
function build(){let w;do{w=rnd(D.words);}while(w.syl.join("")===lastBuild);lastBuild=w.syl.join("");
  const others=D.words.filter(x=>x!==w).flatMap(x=>x.syl).filter(s=>!w.syl.includes(s));
  const chips=shuffle([...w.syl,rnd(others)]);let pos=0;
  panel.innerHTML=`<div class="prompt">קְרָא אֶת הַקְּרוֹנוֹת וְחַבֵּר לְפִי הַסֵּדֶר. קָרוֹן אֶחָד תָּקוּעַ!</div>
   <img class="pic" src="${w.img}" alt="">
   <div class="slots">${w.syl.map(()=>`<div class="slot"></div>`).join("")}</div>
   <div class="row">${chips.map(c=>`<button class="chip">${c}</button>`).join("")}</div><div class="msg" id="msg"></div>`;
  const slots=panel.querySelectorAll(".slot");
  panel.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    if(b.textContent===w.syl[pos]){slots[pos].textContent=b.textContent;slots[pos].classList.add("full","pop");b.disabled=true;pos++;
      $("#msg").textContent=pos<w.syl.length?"עוֹד קָרוֹן!":"";
      if(pos===w.syl.length){$("#msg").textContent="";const m=$("#msg");setTimeout(()=>{m.textContent=w.syl.join("")+"!";},200);win(m,build);}}
    else nope(b,$("#msg"),pos===0?"מִי הַקָּרוֹן הָרִאשׁוֹן? הוּא מַתְאִים לַצְּלִיל הָרִאשׁוֹן שֶׁל הַתְּמוּנָה":"לֹא הַקָּרוֹן הַזֶּה. מָה הַהֲבָרָה הַבָּאָה?");});}

function finish(){panel.innerHTML=`<img class="pic pop" src="${D.icons['1f3c6']}" alt="">
  <div class="prompt" style="font-size:28px;font-weight:900">נֹעַם – אַלּוּף מוּסַךְ הַתְּנוּעוֹת!</div>
  <button class="btn" id="again">עוֹד מֵרוֹץ</button>`;$("#again").onclick=()=>{score=0;drawFuel();go(mode);};}

function go(m){mode=m;document.querySelectorAll(".tab").forEach(b=>{const on=b.dataset.m===m;b.setAttribute("aria-pressed",on);b.style.background=on?tabColor[b.dataset.m]:"var(--card)";});
  panel.style.borderColor=tabColor[m];({learn,which,count,build})[m]();}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.m));
$("#reset").onclick=()=>{score=0;drawFuel();go(mode);};
addEventListener("resize",drawFuel);
drawFuel();go("learn");
</script>
