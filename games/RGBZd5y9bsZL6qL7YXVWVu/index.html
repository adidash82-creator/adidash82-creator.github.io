<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>הגרנד פרי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Varela+Round&display=swap">
<style>
/* Layout: a single race screen — track strip on top, one big task card below, chunky tap targets */
:root{
  --asphalt:#1D3557; --paper:#FFF8EC; --red:#E63946; --yellow:#FFC93C; --sky:#4CC9F0; --lime:#8AC926; --violet:#9B5DE5; --orange:#FB8B24; --ink:#1D3557; --soft:#6b7a90; --card:#ffffff;
  --display:"Rubik","Arial Hebrew",Arial,sans-serif; --read:"Varela Round","Arial Hebrew",Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--display);direction:rtl;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-weight:900;font-size:clamp(22px,5vw,34px);margin:0;text-wrap:balance}
.checker{height:12px;border-radius:6px;background:repeating-conic-gradient(var(--asphalt) 0 25%,var(--card) 0 50%) 0 0/12px 12px}
.track{position:relative;background:var(--asphalt);border-radius:18px;height:74px;overflow:hidden}
.track::before{content:"";position:absolute;inset:50% 14px auto;border-top:4px dashed var(--yellow);opacity:.7}
.finish{position:absolute;left:0;top:0;bottom:0;width:22px;background:repeating-conic-gradient(var(--ink) 0 25%,var(--card) 0 50%) 0 0/11px 11px}
.car{position:absolute;top:10px;right:8px;width:54px;height:54px;transition:right .7s cubic-bezier(.3,1.4,.5,1);transform:scaleX(-1)}
.fuel{display:flex;gap:4px;align-items:center}
.fuel span{width:16px;height:22px;border-radius:4px;border:2px solid var(--ink);background:var(--card)}
.fuel span.on{background:var(--red)}
.fuel b{font-size:14px;margin-inline-start:6px}
.stations{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st{border:4px solid;border-radius:18px;background:var(--card);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font:700 16px var(--display);color:var(--ink);cursor:pointer}
.st img{width:44px;height:44px}
.st[aria-pressed="true"]{color:var(--card)}
.panel{background:var(--card);border-radius:24px;border:4px solid var(--ink);padding:18px;display:flex;flex-direction:column;align-items:center;gap:16px;min-height:340px;position:relative}
.prompt{font-size:19px;font-weight:700;text-align:center}
.big{width:min(180px,40vw);height:min(180px,40vw)}
.row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.tire{width:96px;height:96px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle,var(--card) 0 52%,#2b2b2b 53% 100%);
  font:400 52px var(--read);color:var(--ink);box-shadow:inset 0 0 0 7px #2b2b2b,inset 0 0 0 10px #555;transition:transform .15s}
.tire:active{transform:scale(.92)}
.word{font-family:var(--read);font-size:clamp(46px,12vw,72px);display:flex;gap:6px;direction:rtl}
.syl{border:0;background:none;font:inherit;cursor:pointer;padding:0 4px;border-radius:12px;border-bottom:6px solid var(--yellow)}
.syl:nth-child(odd){color:var(--ink)} .syl:nth-child(even){color:var(--red)}
.syl.lit{background:var(--yellow)}
.opt{width:118px;height:118px;border-radius:20px;border:4px solid var(--orange);background:var(--card);cursor:pointer;padding:12px}
.opt img{width:100%;height:100%}
.shake{animation:sh .4s} @keyframes sh{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
.pop{animation:pp .5s} @keyframes pp{50%{transform:scale(1.15)}}
.btn{border:0;border-radius:14px;padding:10px 18px;font:700 17px var(--display);cursor:pointer;background:var(--ink);color:var(--card)}
.btn.ghost{background:transparent;color:var(--ink);border:3px solid var(--ink)}
.say{display:flex;align-items:center;gap:6px}
.say img{width:26px;height:26px}
.msg{min-height:28px;font-weight:700;font-size:19px;text-align:center}
canvas{width:100%;max-width:520px;aspect-ratio:4/3;border:3px dashed var(--violet);border-radius:16px;touch-action:none;background:var(--card)}
.pens{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pen{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--ink);cursor:pointer}
.pen[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink)}
.coach{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px;color:var(--soft)}
.coach label{display:flex;gap:6px;align-items:center;cursor:pointer}
button:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
@media (max-width:480px){.stations{grid-template-columns:repeat(3,1fr)}.st{font-size:13px}.tire{width:74px;height:74px;font-size:40px}.opt{width:90px;height:90px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>הַגְּרַנְד פְּרִי שֶׁל נֹעַם</h1>
    <div class="fuel" id="fuel" aria-label="מד דלק"></div>
  </header>
  <div class="track" aria-hidden="true"><div class="finish"></div><img class="car" id="car" alt=""></div>
  <div class="stations" role="group" aria-label="תחנות">
    <button class="st" data-m="sound" style="border-color:var(--sky)" aria-pressed="true"><img data-i="1f527" alt="">מוּסַךְ הַצְּלִילִים</button>
    <button class="st" data-m="match" style="border-color:var(--red)" aria-pressed="false"><img data-i="26fd" alt="">תַּחֲנַת הַדֶּלֶק</button>
    <button class="st" data-m="draw" style="border-color:var(--violet)" aria-pressed="false"><img data-i="1f3a8" alt="">סְטוּדְיוֹ הָעִצּוּב</button>
  </div>
  <section class="panel" id="panel" aria-live="polite"></section>
  <div class="checker"></div>
  <div class="coach">
    <label><input type="checkbox" id="easy"> מצב קל: רק מילים בנות 2 הברות</label>
    <button class="btn ghost" id="reset" style="font-size:14px;padding:6px 12px">מרוץ חדש</button>
  </div>
</div>

const colors = {sound:"var(--sky)",match:"var(--red)",draw:"var(--violet)"};
let mode="sound", score=0, cur=null, recent=[];
const $=s=>document.querySelector(s), panel=$("#panel");
document.querySelectorAll("img[data-i]").forEach(i=>i.src=D.icons[i.dataset.i]);
$("#car").src=D.icons["1f3ce"];
const pool=()=>D.words.filter(w=>!$("#easy").checked||w.syl.length===2);
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function pick(){let p=pool().filter(w=>!recent.includes(w.w));if(!p.length){recent=[];p=pool();}
  const w=p[Math.floor(Math.random()*p.length)];recent.push(w.w);if(recent.length>5)recent.shift();return w;}
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="he-IL";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function drawFuel(){$("#fuel").innerHTML=Array.from({length:12},(_,i)=>`<span class="${i<score?'on':''}"></span>`).join("")+`<b>${score}/12</b>`;
  const t=$(".track").clientWidth-70; $("#car").style.right=(8+t*Math.min(score,12)/12)+"px";}
function win(msgEl,next){score++;drawFuel();msgEl.textContent=["יוֹפִי! מִלֵּאתָ דֶּלֶק","בְּרְרְרְם! קָדִימָה","אַלּוּף הַמַּסְלוּל!","נֶהָג מְעֻלֶּה!"][score%4];
  if(score>=12){setTimeout(finish,900);return;} setTimeout(next,1100);}
function nope(el,msgEl,t){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");msgEl.textContent=t;}

function sound(){cur=pick();
  const opts=shuffle([cur.l,...shuffle(D.letters.filter(l=>l!==cur.l)).slice(0,3)]);
  panel.innerHTML=`<div class="prompt">בְּאֵיזֶה צְלִיל מַתְחִילָה הַמִּלָּה? קְפֹץ לַצְּמִיג!</div>
   <img class="big" src="${cur.img}" alt="">
   <button class="btn ghost say" id="spk"><img src="${D.icons['1f50a']}" alt="">שְׁמַע</button>
   <div class="row">${opts.map(l=>`<button class="tire" data-l="${l}">${l}</button>`).join("")}</div><div class="msg" id="msg"></div>`;
  $("#spk").onclick=()=>say(cur.w);
  panel.querySelectorAll(".tire").forEach(b=>b.onclick=()=>{
    if(b.dataset.l===cur.l){b.classList.add("pop");b.style.boxShadow="inset 0 0 0 7px var(--lime),inset 0 0 0 10px var(--lime)";win($("#msg"),sound);}
    else nope(b,$("#msg"),"נַסֵּה צְמִיג אַחֵר");});}

function match(){cur=pick();
  const opts=shuffle([cur,...shuffle(D.words.filter(w=>w!==cur)).slice(0,2)]);
  panel.innerHTML=`<div class="prompt">לְחַץ עַל כָּל הֲבָרָה = הַעֲלָאַת הִילּוּךְ. לְאָן נוֹסַעַת הַמִּלָּה?</div>
   <div class="word">${cur.syl.map(s=>`<button class="syl">${s}</button>`).join("")}</div>
   <div class="row">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><img src="${o.img}" alt=""></button>`).join("")}</div><div class="msg" id="msg"></div>`;
  panel.querySelectorAll(".syl").forEach(s=>s.onclick=()=>s.classList.toggle("lit"));
  panel.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(opts[+b.dataset.i]===cur){b.classList.add("pop");b.style.borderColor="var(--lime)";win($("#msg"),match);}
    else nope(b,$("#msg"),"זוֹ חֲנָיָה אַחֶרֶת... קְרָא שׁוּב הֲבָרָה־הֲבָרָה");});}

function draw(){cur=pick();let pen="#1D3557",down=false;
  panel.innerHTML=`<div class="prompt">קְרָא אֶת הַמִּלָּה בְּשֶׁקֶט – וְצַיֵּר אוֹתָהּ!</div>
   <div class="word">${cur.syl.map(s=>`<span class="syl" style="cursor:default">${s}</span>`).join("")}</div>
   <div class="pens">${["#1D3557","#E63946","#FB8B24","#FFC93C","#8AC926","#4CC9F0","#9B5DE5"].map((c,i)=>`<button class="pen" style="background:${c}" data-c="${c}" aria-label="צבע" aria-pressed="${i?'false':'true'}"></button>`).join("")}</div>
   <canvas id="cv" width="800" height="600"></canvas>
   <div class="row"><button class="btn ghost" id="clr">מְחַק</button><button class="btn" id="done">סִיַּמְתִּי! מָה הָיָה כָּתוּב?</button></div>
   <div class="msg" id="msg"></div>`;
  const cv=$("#cv"),cx=cv.getContext("2d");cx.lineWidth=12;cx.lineCap=cx.lineJoin="round";
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{down=true;cv.setPointerCapture(e.pointerId);cx.strokeStyle=pen;cx.beginPath();cx.moveTo(...pt(e));};
  cv.onpointermove=e=>{if(!down)return;cx.lineTo(...pt(e));cx.stroke();};
  cv.onpointerup=cv.onpointercancel=()=>down=false;
  panel.querySelectorAll(".pen").forEach(b=>b.onclick=()=>{pen=b.dataset.c;panel.querySelectorAll(".pen").forEach(x=>x.setAttribute("aria-pressed",x===b));});
  $("#clr").onclick=()=>cx.clearRect(0,0,cv.width,cv.height);
  $("#done").onclick=()=>{const im=new Image();im.onload=()=>cx.drawImage(im,cv.width-170,cv.height-170,150,150);im.src=cur.img;
    $("#done").disabled=true;score++;drawFuel();$("#msg").textContent="הַצִּיּוּר שֶׁלְּךָ וְהַתְּמוּנָה – יַחַד!";
    if(score>=12){setTimeout(finish,1500);return;}
    const n=document.createElement("button");n.className="btn";n.textContent="מִלָּה הַבָּאָה";n.onclick=draw;$("#done").after(n);};}

function finish(){panel.innerHTML=`<img class="big pop" src="${D.icons['1f3c6']}" alt="">
  <div class="prompt" style="font-size:28px;font-weight:900">נֹעַם – אַלּוּף הַגְּרַנְד פְּרִי!</div>
  <div class="prompt">מִלֵּאתָ אֶת כָּל מַד הַדֶּלֶק</div><button class="btn" id="again">עוֹד מֵרוֹץ</button>`;
  $("#again").onclick=()=>{score=0;drawFuel();go(mode);};}

function go(m){mode=m;document.querySelectorAll(".st").forEach(b=>{const on=b.dataset.m===m;b.setAttribute("aria-pressed",on);b.style.background=on?colors[b.dataset.m]:"var(--card)";});
  panel.style.borderColor=colors[m];({sound,match,draw})[m]();}
document.querySelectorAll(".st").forEach(b=>b.onclick=()=>go(b.dataset.m));
$("#easy").onchange=()=>go(mode);
$("#reset").onclick=()=>{score=0;drawFuel();go(mode);};
addEventListener("resize",drawFuel);
drawFuel();go("sound");
