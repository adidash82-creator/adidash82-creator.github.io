*{box-sizing:border-box}
body{margin:0;font-family:NSH,system-ui,sans-serif;background:#eaf6df;color:#222}
.wrap{display:flex;gap:16px;padding:14px;align-items:flex-start;max-width:1500px;margin:auto}
.boardbox{flex:1;min-width:0}.boardbox svg{width:100%;height:auto;display:block}
.panel{width:460px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
@media(max-width:1000px){.wrap{flex-direction:column}.panel{width:100%}}
.box{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 2px 8px rgba(30,80,20,.1)}
.turn{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}
.dot{width:20px;height:20px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:8px}
.sc{border-radius:12px;padding:6px;background:#f2f8ec;text-align:center;font-weight:700;border:3px solid transparent}
.sc.on{border-color:#3f9f3a;background:#e3f4d6}.sc b{display:block;font-size:24px}
.tcard{background:#f2fbe9;border:3px solid #7fb36a;border-radius:18px;overflow:hidden}
.tcard .band{background:#3f9f3a;color:#fff;padding:6px 12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.tcard h2{margin:10px 12px 4px;text-align:center;color:#2f5d1e;font-size:24px}
.lines{padding:6px 10px 12px;text-align:center}
.line{margin:6px 0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.w{font-size:34px;font-weight:700;padding:2px 10px;border-radius:12px;border:3px solid transparent;cursor:default;transition:all .15s;user-select:none}
.hunting .w{cursor:pointer;background:#fff;border-color:#d9ecc9}
.hunting .w:hover{border-color:#3f9f3a;transform:translateY(-2px)}
.w.ok{background:#7ed957!important;border-color:#2e9e5b!important;color:#0b3d0b;animation:pop .4s}
.w.no{background:#ffd6d6!important;border-color:#e23b3b!important;animation:shake .4s}
.w.show{background:#fff3b0!important;border-color:#f2b705!important;animation:pop .5s}
.ccard{border-radius:18px;overflow:hidden;text-align:center;background:#fffaf0;border:3px solid #e6d3a6;animation:pop .35s}
.ccard .band{color:#fff;padding:8px;font-size:24px;font-weight:800}
.ccard .q{font-size:28px;font-weight:700;padding:14px 16px;line-height:1.5}
.ccard .bigw{display:inline-block;font-size:42px;font-weight:800;border:4px solid;border-radius:16px;padding:2px 20px;margin-top:6px}
.ccard .rw{font-size:14px;color:#7a5a2a;font-weight:700;padding-bottom:10px}
@keyframes pop{from{transform:scale(.8);opacity:.3}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
button{font-family:inherit;font-size:19px;font-weight:700;border:0;border-radius:14px;padding:12px 16px;cursor:pointer}
.b-green{background:#3f9f3a;color:#fff}.b-orange{background:#e0832a;color:#fff}.b-light{background:#eef5e8;color:#2f5d1e;font-size:15px;padding:8px 12px}
.row{display:flex;gap:10px}.row>*{flex:1}
.modes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 10px 10px}
.modes button{font-size:14px;padding:6px 10px;background:#e3f4d6;color:#2f5d1e}.modes button.sel{background:#3f9f3a;color:#fff}
.msg{min-height:28px;font-weight:800;color:#2f5d1e;text-align:center;font-size:19px}
.modal{position:fixed;inset:0;background:rgba(20,50,10,.45);display:flex;align-items:center;justify-content:center;z-index:9}
.modal .in{background:#fff;border-radius:22px;padding:24px;max-width:460px;width:92%;text-align:center;animation:pop .3s}
.modal h1{margin:0 0 8px;color:#2f5d1e}.modal input{font-family:inherit;font-size:18px;padding:9px 12px;border-radius:10px;border:2px solid #cfe5bf;width:100%;margin:5px 0}
.nbtn.sel{background:#3f9f3a;color:#fff}.hidden{display:none!important}.big{font-size:60px;line-height:1}
#pawns g{transition:transform .28s ease}

async function tap(el){

  const p=P(),sp=D.special[p.pos];render();
  if(sp=='star'){p.pts+=2;render();modal(`<div class="big">⭐</div><h1>כּוֹכָב!</h1><p>${esc(p.name)} מְקַבֵּל 2 נְקֻדּוֹת</p><button class="b-green" onclick="closeModal();endTurn()">הַמְשֵׁךְ</button>`)}
  else if(sp=='move'){modal(`<div class="big">🦖</div><h1>רְקִיעָה!</h1><p style="font-size:22px">לֵךְ 5 צַעֲדֵי דִּינוֹזָאוּר כְּבֵדִים: בּוּם, בּוּם!</p><button class="b-green" onclick="P().pts++;closeModal();endTurn()">עָשִׂיתִי! (+1)</button>`)}
  else if(sp=='egg'){modal(`<div class="big">🥚</div><h1>בֵּיצָה!</h1><p>${esc(p.name)} מְקַבֵּל עוֹד תּוֹר!</p><button class="b-green" onclick="closeModal();endTurn(true)">יֵשׁ!</button>`)}
  else if(sp=='jump'){modal(`<div class="big">🦘</div><h1>קְפִיצָה!</h1><p>קוֹפְצִים 2 מִשְׁבָּצוֹת קָדִימָה</p><button class="b-green" onclick="jump()">הוֹפּ!</button>`)}
  else{say('כָּל הַכָּבוֹד! 🎉');setTimeout(()=>endTurn(),700)}
}
async function jump(){closeModal();const p=P();for(let k=0;k<2&&p.pos<D.n;k++){p.pos++;place(S.cur);await sleep(330)}if(p.pos>=D.n)return finish();endTurn()}
function endTurn(same){if(S.over)return;if(!same)S.cur=(S.cur+1)%S.players.length;S.ch=null;
  if(!S.queue.length){say('🌿 טֶקְסְט חָדָשׁ!');nextText()}else render()}
function finish(){const p=P();p.pts+=5;S.over=true;render();const r=S.players.slice().sort((a,b)=>b.pts-a.pts);
modal(`<div class="big">🏆</div><h1>הִגַּעְתָּ לַקֵּן!</h1><p>${esc(p.name)} הִגִּיעַ רִאשׁוֹן (+5)</p>${r.map((q,i)=>`<div style="display:flex;justify-content:space-between;font-size:20px;padding:6px 10px;border-radius:10px;background:${i?'#f2f8ec':'#fff3c4'};margin:4px 0"><span>${i+1}. ${esc(q.name)}</span><b>${q.pts} נק׳</b></div>`).join('')}<button class="b-green" style="width:100%;margin-top:10px" onclick="setup()">מִשְׂחָק חָדָשׁ</button>`)}
function openRules(){modal(`<h1>חוקי המשחק</h1><div style="text-align:right;line-height:1.7;font-size:16px">
1. קוראים את הטקסט (התלמיד בוחר איך) ולוחצים ״קראנו״ – נקודה.<br>2. שולפים קלף צייד ולוחצים על המילה בטקסט.<br>
מצא / רמז / תשובה = 2 צעדים + נקודה · תבנית = 3 צעדים + 2 נקודות.<br>3. שני ניסיונות. אחר כך המילה מסומנת וקוראים אותה יחד.<br>
4. אחרי 4 קלפים – טקסט חדש.<br>⭐ +2 · 🦖 רקיעה +1 · 🥚 עוד תור · 🦘 קפיצה 2 קדימה · הראשון לקן +5.</div>
<button class="b-green" style="margin-top:12px" onclick="closeModal()">הבנתי</button>`)}
setup();
</script><a href="../../" aria-label="חזרה לעולם המשחקים" style="position:fixed;bottom:16px;left:16px;z-index:9999;width:52px;height:52px;border-radius:50%;background:#ffc93c;color:#1b2a5e;display:grid;place-items:center;font-size:26px;text-decoration:none;box-shadow:0 4px 0 #d89c12,0 6px 14px #0003">🏠</a>
