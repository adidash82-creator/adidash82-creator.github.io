<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>עולם המשחקים של עדי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, playful, clear — a toy box for kids up to 12 and their teacher
   IDEA: a shelf of chunky 3D toy blocks; every game is a block you press
   PICTURE: floating letter-cubes over a hill, then the block shelf itself
   COLOUR and TYPE: sky blue ground, sunny yellow, grass green, coral accent; Secular One + Rubik
   LAYOUT: hero band, sticky filter bar, grade "worlds" as sections of 3D cards */
:root{color-scheme:light dark;
--bg:light-dark(#8fd3ff,#16224a);--bg2:light-dark(#c9ecff,#1f2f5e);
--ink:light-dark(#1b2a5e,#f5f2e8);--soft:light-dark(#3d4d80,#c7cde6);
--card:light-dark(#ffffff,#26386e);--edge:light-dark(#d5e3f5,#121b3d);
--sun:#ffc93c;--grass:#5cc85a;--coral:#ff6f61;--grape:#8b6cf0;--sea:#2fa8e0;
--fs:17px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.55 Rubik,'Arial Hebrew',Arial,sans-serif;overflow-x:clip}
body.big{--fs:20px}
a{color:inherit}
.skip{position:absolute;right:-999px;top:8px;background:var(--sun);color:#1b2a5e;padding:10px 16px;border-radius:12px;z-index:50}
.skip:focus{right:12px}
:focus-visible{outline:4px solid var(--coral);outline-offset:3px}

/* hero */
.hero{position:relative;padding:clamp(24px,4vw,48px) max(5vw,16px) 0;background:linear-gradient(var(--bg),var(--bg2));overflow:hidden}
.hwrap{max-width:1240px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:center}
h1{font:400 clamp(34px,5.4vw,58px)/1.05 'Secular One',Rubik,sans-serif;margin:0 0 14px;text-wrap:balance;text-shadow:0 4px 0 light-dark(#ffffff99,#0006)}
.lead{font-size:1.1em;color:var(--soft);margin:0 0 20px;max-width:34ch}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.pill{background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;box-shadow:0 5px 0 var(--edge)}
.pill b{color:var(--coral)}
.scene{width:100%;height:auto;display:block}
.float{animation:bob 4s ease-in-out infinite}
.float.d2{animation-delay:-1.3s}.float.d3{animation-delay:-2.6s}
@keyframes bob{50%{transform:translateY(-12px)}}

/* filter bar */
.bar{position:sticky;top:0;z-index:20;background:light-dark(#ffffffee,#16224aee);backdrop-filter:blur(8px);border-bottom:4px solid var(--edge);padding:12px max(5vw,16px)}
.bwrap{max-width:1240px;margin:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grp>span{font-weight:700;font-size:.9em;color:var(--soft)}
.chip{font:700 .95em Rubik,sans-serif;min-height:44px;padding:8px 16px;border:0;border-radius:14px;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--edge);transition:transform .12s,box-shadow .12s}
.chip:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.chip[aria-pressed=true]{background:var(--c,var(--sea));color:#fff;box-shadow:0 5px 0 light-dark(#0003,#0008)}
select,input[type=search]{font:500 16px Rubik,sans-serif;min-height:44px;padding:8px 14px;border-radius:14px;border:3px solid var(--edge);background:var(--card);color:var(--ink)}
input[type=search]{flex:1 1 180px}
.tools{margin-inline-start:auto;display:flex;gap:8px}

/* worlds */
main{max-width:1240px;margin:auto;padding:8px max(5vw,16px) 60px}
.world{margin-top:36px}
.whead{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.badge{width:62px;height:62px;flex:none;border-radius:18px;display:grid;place-items:center;font:400 26px 'Secular One',sans-serif;color:#fff;background:var(--c);box-shadow:0 7px 0 light-dark(#0002,#0007),inset 0 -6px 0 #0002,inset 0 4px 0 #fff5;transform:rotate(-6deg)}
h2{font:400 clamp(26px,3.4vw,36px)/1.1 'Secular One',sans-serif;margin:0}
.whead p{margin:2px 0 0;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;perspective:900px}

/* 3D card */
.card{position:relative;display:flex;flex-direction:column;text-decoration:none;background:var(--card);border-radius:24px;padding:18px 18px 16px;box-shadow:0 10px 0 var(--edge),0 18px 26px light-dark(#1b2a5e22,#0006);transform-style:preserve-3d;transition:transform .25s,box-shadow .25s;border-top:6px solid var(--c)}
.card:hover,.card:focus-visible{transform:translateY(-6px) rotateX(6deg) rotateY(var(--ry,0deg));box-shadow:0 16px 0 var(--edge),0 28px 34px light-dark(#1b2a5e33,#0008)}
.card:active{transform:translateY(6px);box-shadow:0 3px 0 var(--edge)}
.ico{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--c);box-shadow:inset 0 -6px 0 #0002,inset 0 4px 0 #fff6,0 6px 0 light-dark(#0002,#0006);margin-bottom:12px;transform:translateZ(30px)}
.ico svg{width:38px;height:38px}
.card h3{font:700 1.15em/1.25 Rubik,sans-serif;margin:0 0 6px}
.card p{margin:0 0 12px;color:var(--soft);font-size:.95em;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.8em;font-weight:700;padding:3px 10px;border-radius:999px;background:light-dark(#eef4fb,#1b2a56)}
.tag.lv{background:var(--lc);color:#1b2a5e}
.go{position:absolute;left:14px;top:14px;width:40px;height:40px;border-radius:50%;background:var(--sun);display:grid;place-items:center;box-shadow:0 4px 0 #d89c12;color:#1b2a5e;font-weight:800}
.empty{text-align:center;padding:40px;font-size:1.2em;display:none}
footer{text-align:center;padding:24px 16px 40px;color:var(--soft);font-size:.9em}

@media(max-width:600px){.bar{position:static}}
@media(max-width:760px){.hwrap{grid-template-columns:1fr}.scene{max-width:440px;margin:auto}.tools{margin-inline-start:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card:hover{transform:none}}
</style>
</head>

</header>

  </div>
  <input type="search" id="q" placeholder="חיפוש משחק…" aria-label="חיפוש משחק">
  <div class="tools">
   <button class="chip" id="bigBtn" aria-pressed="false" title="הגדלת טקסט">א+</button>
  </div>
 </div>
</nav>

<main id="games">

 <p class="empty" id="empty">לא נמצא משחק כזה. נסו לבחור נושא או כיתה אחרים.</p>
</main>
<footer>נבנה עבור השיעורים של עדי פרץ</footer>

 ['emo','מסע הרגשות','VYs2Jx5soH4PgsTsDhiiDh','רגשי','מתחילים','משחק','שאלונים רגשיים כמשחק: כדור פורח שלוקח את הדאגות.'],
 ['emo','מסע הרגשות – תלת־ממד','C4U1dsaxhPmxL1yCGzp9a2','רגשי','מתחילים','משחק','גרסה מבריקה עם דרגות, מטבעות, גביעים ודמות מלווה.'],
 ['emo','מסע הרגשות – מדבקות','PyqptBKYm7Kw6eB8GzHrDp','רגשי','מתחילים','משחק','גרסה שטוחה בסגנון מדבקות, עם צלילים ופרסים.']
];
const ICON={
 'ניקוד':'<circle cx="12" cy="9" r="6" fill="#fff"/><circle cx="9" cy="21" r="3" fill="#fff"/><circle cx="17" cy="21" r="3" fill="#fff"/><path d="M24 6h10v26H24z" fill="#fff" opacity=".8"/>',
 'קריאה ופענוח':'<path d="M4 8q9-4 15 2v24q-6-6-15-2z" fill="#fff"/><path d="M34 8q-9-4-15 2v24q6-6 15-2z" fill="#fff" opacity=".8"/>',
 'הבנת הנקרא':'<circle cx="15" cy="15" r="10" fill="none" stroke="#fff" stroke-width="5"/><path d="M22 22l11 11" stroke="#fff" stroke-width="6" stroke-linecap="round"/>',
 'כתיב':'<path d="M8 30l3-10L27 4l7 7-16 16z" fill="#fff"/><path d="M8 30l10-3" stroke="#fff" stroke-width="3"/>',
 'פיסוק':'<circle cx="10" cy="28" r="5" fill="#fff"/><path d="M24 6v16" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="24" cy="31" r="3.5" fill="#fff"/>',
 'לשון ודקדוק':'<rect x="4" y="4" width="13" height="13" rx="3" fill="#fff"/><rect x="21" y="4" width="13" height="13" rx="3" fill="#fff" opacity=".8"/><rect x="12" y="21" width="13" height="13" rx="3" fill="#fff"/>',
 'חשיבה':'<path d="M19 4a11 11 0 0 0-6 20v5h12v-5A11 11 0 0 0 19 4z" fill="#fff"/><rect x="14" y="31" width="10" height="4" rx="2" fill="#fff"/>',
 'רגשי':'<path d="M19 33S4 23 4 13a8 8 0 0 1 15-4 8 8 0 0 1 15 4c0 10-15 20-15 20z" fill="#fff"/>'
};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let grade='';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

$('fGrade').insertAdjacentHTML('beforeend',
 `<button class="chip" data-g="" aria-pressed="true" style="--c:#1b2a5e">הכול</button>`+
 WORLDS.map(w=>`<button class="chip" data-g="${w.id}" aria-pressed="false" style="--c:${w.c}">${esc(w.name.replace('כיתות ','').replace('כיתה ',''))}</button>`).join(''));
$('fSkill').insertAdjacentHTML('beforeend',Object.keys(SK).map(s=>`<option>${esc(s)}</option>`).join(''));
const nGames=G.filter(g=>g[5]==='משחק').length;
$('stats').innerHTML=`<span class="pill"><b>${G.length}</b> פעילויות</span><span class="pill"><b>${nGames}</b> משחקים</span><span class="pill"><b>${G.length-nGames}</b> שיעורים חווייתיים</span>`;

function card(g,i){
 const [w,t,slug,sk,lv,kind,d]=g;
 return `<a class="card" href="${U}${slug}/" style="--c:${SK[sk]};--lc:${LV[lv]};--ry:${i%2?3:-3}deg" aria-label="${esc(t)} – ${esc(kind)}, ${esc(sk)}, ${esc(lv)}">
  <span class="go" aria-hidden="true">◀</span>
  <span class="ico" aria-hidden="true"><svg viewBox="0 0 38 38">${ICON[sk]}</svg></span>
  <h3>${esc(t)}</h3><p>${esc(d)}</p>
  <span class="tags"><span class="tag lv">${esc(lv)}</span><span class="tag">${esc(sk)}</span><span class="tag">${kind==='שיעור'?'שיעור 45 דק׳':'משחק'}</span></span></a>`;
}
function render(){
 const lv=$('fLevel').value,sk=$('fSkill').value,q=$('q').value.trim();
 let total=0;
 $('worlds').innerHTML=WORLDS.map(w=>{
  if(grade&&grade!==w.id)return'';
  const list=G.filter(g=>g[0]===w.id&&(!lv||g[4]===lv)&&(!sk||g[3]===sk)&&(!q||(g[1]+g[6]+g[3]).includes(q)));
  total+=list.length;
  if(!list.length)return'';
  return `<section class="world" id="${w.id}" aria-labelledby="h-${w.id}"><div class="whead"><span class="badge" style="--c:${w.c}" aria-hidden="true">${esc(w.short)}</span><div><h2 id="h-${w.id}">${esc(w.name)}</h2><p>${esc(w.sub)} · ${list.length} פעילויות</p></div></div><div class="grid">${list.map(card).join('')}</div></section>`;
 }).join('');
 $('empty').style.display=total?'none':'block';
}
$('fGrade').addEventListener('click',e=>{
 const b=e.target.closest('[data-g]');if(!b)return;
 grade=b.dataset.g;
 $('fGrade').querySelectorAll('[data-g]').forEach(x=>x.setAttribute('aria-pressed',x===b));
 render();
});
['fLevel','fSkill'].forEach(id=>$(id).addEventListener('change',render));
$('q').addEventListener('input',render);
function setBig(on){document.body.classList.toggle('big',on);$('bigBtn').setAttribute('aria-pressed',on);store.set('hub-big',on?'1':'')}
$('bigBtn').addEventListener('click',()=>setBig(!document.body.classList.contains('big')));
setBig(store.get('hub-big')==='1');
render();
}
</script>
</body>
</html>
